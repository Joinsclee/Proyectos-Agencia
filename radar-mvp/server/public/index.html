<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar de Oportunidades Inmobiliarias</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="hero">
    <div class="hero-content">
      <span class="pill"><span class="live-dot"></span> Datos en vivo · sin límites</span>
      <h1>Radar de <span class="gold">Oportunidades</span> Inmobiliarias</h1>
      <p class="sub">Inmuebles en venta de bancos, remates judiciales y portal abierto en Colombia. Consulta en tiempo real desde la base de datos — todos los resultados, todas las fotos.</p>
      <div class="summary-bar" id="summary"></div>
    </div>
  </header>

  <nav class="tabs-bar">
    <div class="tabs-inner">
      <div class="tabs-group" id="tabs">
        <button class="tab-btn active" data-tab="portal"><span class="tab-emoji">🏘</span> Portal abierto <span class="tab-count" id="c-portal">—</span></button>
        <button class="tab-btn" data-tab="bancos"><span class="tab-emoji">🏦</span> Bancos <span class="tab-count" id="c-bancos">—</span></button>
        <button class="tab-btn" data-tab="remates"><span class="tab-emoji">⚖️</span> Remates judiciales <span class="tab-count" id="c-remates">—</span></button>
      </div>
      <div class="nav-right">
        <button class="tab-btn tab-fav" data-tab="guardados"><span class="tab-emoji">♥</span> <span class="nav-label">Guardados</span> <span class="tab-count" id="c-guardados">0</span></button>
        <span class="nav-sep" aria-hidden="true"></span>
        <div class="authbar" id="authbar"></div>
      </div>
    </div>
  </nav>

  <div class="vstats"><div class="vstats-inner" id="vstats"></div></div>

  <div class="legend" id="legend"></div>

  <section class="controls"><div class="controls-inner">
    <div class="filters-row" id="filters"></div>
    <div class="results-info"><span id="count">—</span> · <button class="btn-clear" id="clear">Limpiar filtros</button></div>
  </div></section>

  <main class="content">
    <div class="cards-grid" id="grid"></div>
    <div class="loading" id="loading" style="display:none;">Cargando…</div>
    <div class="empty" id="empty" style="display:none;"><div class="h">Sin resultados</div><div>Ajusta los filtros para ver más.</div></div>
  </main>
  <nav class="pager" id="pager"></nav>

  <div class="modal" id="modal">
    <div class="modal-box">
      <button class="modal-close" id="modal-close">×</button>
      <div id="modal-content" style="display:contents;"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
