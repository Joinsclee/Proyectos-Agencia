<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comparador · Radar de Oportunidades</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tilt+Warp&family=Barlow+Semi+Condensed:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/portal.css">
</head>
<body>
  <nav class="portal-nav" aria-label="Navegación principal">
    <a class="brand" href="/"><span class="brand-mark">R</span>Radar CRECE</a>
    <div class="portal-links"><a class="portal-link" href="/cuenta">Mi cuenta</a><a class="portal-button secondary" href="/">Volver al Radar</a></div>
  </nav>
  <main class="portal-main">
    <header class="portal-hero">
      <span class="eyebrow">Decisión comparable</span>
      <h1>Compara con los mismos criterios</h1>
      <p>Selecciona entre dos y tres guardados. El comparador no inventa datos: muestra “sin dato” cuando una fuente no los entrega.</p>
    </header>
    <section class="account-card">
      <h2>Selecciona oportunidades</h2>
      <div class="compare-picker" id="compare-picker"></div>
      <p class="message" id="compare-message" role="status"></p>
    </section>
    <section class="compare-table-wrap" id="comparison" hidden></section>
  </main>
  <script src="/comparador.js"></script>
</body>
</html>
