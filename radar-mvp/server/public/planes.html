<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planes · Radar de Oportunidades</title>
  <!-- El logotipo oficial del Radar. Hasta ahora el producto no declaraba
       ninguno: la pestaña salía con el globo gris del navegador y un acceso
       directo en el escritorio del móvil, con una captura de la página. Es la
       marca en el sitio donde una herramienta que se consulta cada semana tiene
       que reconocerse de un vistazo, entre otras veinte pestañas.
       El de 32 se sirve aparte del de 512 porque el navegador reduce mal: a ese
       tamaño las miras finas del logotipo se pierden si las reduce él. -->
  <link rel="icon" type="image/png" sizes="32x32" href="/radar/radar-crece-32.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/radar/radar-crece.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/radar/radar-crece-180.png">
  <meta name="description" content="Compara los planes del Radar de Oportunidades Inmobiliarias.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tilt+Warp&family=Barlow+Semi+Condensed:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/portal.css">
</head>
<body>
  <nav class="portal-nav" aria-label="Navegación principal">
    <a class="brand" href="/"><img class="brand-mark" src="/radar/radar-crece.png" alt="" width="512" height="512">Radar CRECE</a>
    <div class="portal-links">
      <a class="portal-link" href="/">Explorar oportunidades</a>
      <a class="portal-link" id="account-link" href="/cuenta">Mi cuenta</a>
      <a class="portal-button secondary" id="session-link" href="/login">Ingresar</a>
    </div>
  </nav>
  <main class="portal-main">
    <header class="portal-hero">
      <span class="eyebrow">Planes simples, alcance claro</span>
      <h1>Elige cuánto quieres profundizar</h1>
      <p>Explora el mercado gratis. Radar Pro desbloquea la información necesaria para evaluar las oportunidades de mayor señal.</p>
      <div class="status-note" id="payment-availability">Comprobando disponibilidad del checkout de prueba…</div>
    </header>
    <section class="plans-grid" id="plans" aria-live="polite"></section>
    <p class="message" id="message" role="status" aria-live="polite"></p>
  </main>
  <script src="/ficha-pendiente.js"></script>
  <script src="/sesion.js"></script>
  <script src="/planes.js"></script>
</body>
</html>
