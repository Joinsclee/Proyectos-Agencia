name: Radar MVP CI

on:
  pull_request:
    paths:
      - "radar-mvp/**"
      - ".github/workflows/radar-mvp-ci.yml"
  push:
    branches:
      - main
    paths:
      - "radar-mvp/**"
      - ".github/workflows/radar-mvp-ci.yml"
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

concurrency:
  group: radar-mvp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: TypeScript y pruebas
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: radar-mvp
    env:
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key-000000
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: radar-mvp/package-lock.json

      - name: Instalar dependencias reproducibles
        run: npm ci

      - name: Validar TypeScript
        run: npm run typecheck

      - name: Ejecutar pruebas unitarias e integración
        run: npm test

      - name: Auditar dependencias de producción
        run: npm audit --omit=dev --audit-level=high

  production-smoke:
    name: Smoke de producción
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: radar-mvp
    env:
      E2E_BASE_URL: https://joinsclee-radar.juno8i.easypanel.host
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: radar-mvp/package-lock.json

      - name: Instalar dependencias reproducibles
        run: npm ci

      - name: Medir salud y latencia de producción
        run: npm run monitor:production

      - name: Conservar diagnóstico del monitor
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-production-monitor-${{ github.run_id }}
          path: radar-mvp/artifacts/production-monitor.json
          if-no-files-found: warn
          retention-days: 14

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Validar recorridos críticos en producción
        run: npm run test:e2e

      - name: Resumir fallo operativo
        if: failure()
        run: |
          echo "## Radar CRECE: smoke de producción falló" >> "$GITHUB_STEP_SUMMARY"
          echo "Revisar EasyPanel, Supabase y el runbook en radar-mvp/docs/PRODUCTION_RUNBOOK.md." >> "$GITHUB_STEP_SUMMARY"

      - name: Abrir o actualizar incidente
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Radar CRECE] Monitor de producción fallando';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'El smoke automático detectó una degradación de producción.',
              '',
              `Ejecución: ${runUrl}`,
              'Runbook: `radar-mvp/docs/PRODUCTION_RUNBOOK.md`',
              '',
              'Revisar primero `/health`, `/ready`, EasyPanel y Supabase.',
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              per_page: 100,
            });
            const incident = issues.find(issue => !issue.pull_request && issue.title === title);
            if (incident) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: incident.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title,
                body,
              });
            }

      - name: Cerrar incidente recuperado
        if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Radar CRECE] Monitor de producción fallando';
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              per_page: 100,
            });
            const incident = issues.find(issue => !issue.pull_request && issue.title === title);
            if (incident) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: incident.number,
                body: `Producción volvió a estar sana en la ejecución ${context.runId}. Cierre automático.`,
              });
              await github.rest.issues.update({
                ...context.repo,
                issue_number: incident.number,
                state: 'closed',
              });
            }
