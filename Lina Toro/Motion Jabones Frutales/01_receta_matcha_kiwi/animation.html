<!DOCTYPE html>
<!--
  JABONES FRUTALES · ANIM 01 — RECETA #1: Jabón de Matcha estilo kiwi (Antioxidante)
  Cliente: SAVIAS · Lina Toro · Video: 3 jabones frutales
  Segmento en video: 00:45 → 01:20 (Lina presenta ingredientes del primer jabón)
  Tipo: ficha de receta · overlay derecha-centro · banda cream translúcida
  Duración total: 35.0s (entrada → hold largo → salida) · 1920x1080 · fondo transparente (alpha)
  Captura MOV: node _capture/capture-animation.js 01_receta_matcha_kiwi/animation.html 01_receta_matcha_kiwi/animation.mov 1920 1080 35.0
-->
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Receta 01 · Matcha Kiwi · SAVIAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Cormorant+SC:wght@500;600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --sage: #9CAF88;
  --sage-deep: #7B8F6A;
  --gold: #B8943E;
  --cream: #F5EFE6;
  --cream-deep: #EDE4D3;
  --paper: #FAF7F2;
  --ink: #1F1F1B;
  --ink-soft: #4A4A45;
  --bg-banda: rgba(245, 239, 230, 0.90);

  --font-display: 'Cormorant Garamond', Georgia, serif;
  --font-sc: 'Cormorant SC', Georgia, serif;
  --font-body: 'Lora', Georgia, serif;

  --e-expo: cubic-bezier(0.16, 1, 0.30, 1);
  --e-soft: cubic-bezier(0.22, 1, 0.36, 1);
  --total-duration: 35.0s;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: transparent; width: 100%; height: 100%; overflow: hidden; }
body { font-family: var(--font-display); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }

/* ── Card: derecha, centrada vertical ── */
.receta-card {
  position: absolute; top: 50%; right: 96px;
  transform: translateY(-50%) translateX(46px) scale(0.98);
  width: 620px; padding: 50px 58px 54px;
  background: var(--bg-banda);
  backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
  box-shadow: 0 18px 60px rgba(31,31,27,0.16);
  opacity: 0;
  animation:
    card-enter .85s var(--e-expo) 0.1s forwards,
    card-exit .6s cubic-bezier(0.4,0,1,1) calc(var(--total-duration) - 0.6s) forwards;
}
.receta-card::before {
  content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
  background: var(--sage-deep); transform: scaleX(0); transform-origin: left center;
  animation: line-draw .7s var(--e-expo) 0.55s forwards;
}
.receta-card::after {
  content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 2px;
  background: var(--gold); transform: scaleX(0); transform-origin: right center;
  animation: line-draw .7s var(--e-expo) 0.7s forwards;
}

/* ── Encabezado ── */
.tag {
  font-family: var(--font-sc); font-weight: 600; font-size: 21px;
  letter-spacing: 0.34em; text-transform: uppercase; color: var(--sage-deep);
  display: flex; align-items: center; gap: 14px; margin-bottom: 22px;
  opacity: 0; transform: translateY(10px);
  animation: rise .6s var(--e-expo) 0.9s forwards;
}
.tag::before { content: ''; width: 30px; height: 1.5px; background: var(--gold); }

.soap-name {
  font-family: var(--font-display); font-weight: 600; font-size: 62px;
  line-height: 1.0; color: var(--ink); margin-bottom: 8px;
  opacity: 0; transform: translateY(16px); filter: blur(8px);
  animation: blurRise .9s var(--e-expo) 1.05s forwards;
}
.subline {
  display: flex; align-items: baseline; gap: 16px; margin-bottom: 30px;
  opacity: 0; transform: translateY(12px);
  animation: rise .7s var(--e-expo) 1.3s forwards;
}
.subline .style { font-family: var(--font-display); font-style: italic; font-size: 38px; color: var(--gold); }
.subline .benefit {
  font-family: var(--font-sc); font-weight: 600; font-size: 16px; letter-spacing: 0.2em;
  text-transform: uppercase; color: var(--paper); background: var(--sage-deep);
  padding: 6px 14px; border-radius: 2px;
}

/* ── Lista de ingredientes ── */
.ingredientes { list-style: none; display: flex; flex-direction: column; }
.ingredientes li {
  font-family: var(--font-body); font-weight: 400; font-size: 28px; line-height: 1.35;
  color: var(--ink); display: flex; justify-content: space-between; align-items: baseline; gap: 30px;
  padding: 13px 0; opacity: 0; transform: translateX(-16px); filter: blur(6px);
  animation: slideBlur .6s var(--e-expo) forwards;
}
.ingredientes li:not(:last-child) { border-bottom: 1px solid rgba(123,143,106,0.26); }
.ingredientes .name { flex: 1; }
.ingredientes .qty { font-family: var(--font-display); font-style: italic; font-weight: 500; font-size: 34px; color: var(--gold); white-space: nowrap; }
.ingredientes li:nth-child(1) { animation-delay: 1.55s; }
.ingredientes li:nth-child(2) { animation-delay: 1.75s; }
.ingredientes li:nth-child(3) { animation-delay: 1.95s; }
.ingredientes li:nth-child(4) { animation-delay: 2.15s; }
.ingredientes li:nth-child(5) { animation-delay: 2.35s; }

.ornament {
  font-family: var(--font-display); font-size: 22px; letter-spacing: 0.45em;
  color: var(--sage-deep); text-align: center; margin-top: 26px;
  opacity: 0; transform: scale(.7);
  animation: pop .55s var(--e-expo) 2.7s forwards;
}

@keyframes card-enter { to { opacity: 1; transform: translateY(-50%) translateX(0) scale(1); } }
@keyframes card-exit  { to { opacity: 0; transform: translateY(-50%) translateX(0) scale(0.99); } }
@keyframes line-draw  { to { transform: scaleX(1); } }
@keyframes rise       { to { opacity: 1; transform: translateY(0); } }
@keyframes blurRise   { to { opacity: 1; transform: translateY(0); filter: blur(0); } }
@keyframes slideBlur  { to { opacity: 1; transform: translateX(0); filter: blur(0); } }
@keyframes pop        { to { opacity: 1; transform: scale(1); } }
</style>
</head>
<body>
<div class="receta-card">
  <div class="tag">Receta · 01</div>
  <div class="soap-name">Jabón de Matcha</div>
  <div class="subline"><span class="style">estilo kiwi</span><span class="benefit">Antioxidante</span></div>
  <ul class="ingredientes">
    <li><span class="name">Glicerina transparente</span><span class="qty">80 g</span></li>
    <li><span class="name">Glicerina blanca</span><span class="qty">20 g</span></li>
    <li><span class="name">Matcha</span><span class="qty">1 pizca</span></li>
    <li><span class="name">Semillas de amapola</span><span class="qty">al gusto</span></li>
    <li><span class="name">Fragancia de kiwi</span><span class="qty">1 g</span></li>
  </ul>
  <div class="ornament">·&nbsp;&nbsp;✦&nbsp;&nbsp;·</div>
</div>
</body>
</html>
