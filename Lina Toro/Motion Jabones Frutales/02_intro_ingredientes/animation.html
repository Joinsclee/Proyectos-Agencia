<!DOCTYPE html>
<!--
  JABONES FRUTALES · ANIM 02 — INTRO: ingredientes de la alacena
  Segmento: 00:14 → 00:24 (Lina nombra matcha, cacao, leche, cúrcuma)
  Tipo: lista editorial · overlay derecha-centro · 10.0s · 1920x1080 alpha
-->
<html lang="es"><head><meta charset="UTF-8"><title>Intro · Ingredientes · SAVIAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Cormorant+SC:wght@500;600&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --sage:#9CAF88;--sage-deep:#7B8F6A;--gold:#B8943E;--cream:#F5EFE6;--paper:#FAF7F2;--ink:#1F1F1B;--ink-soft:#4A4A45;
  --bg-banda:rgba(245,239,230,0.90);
  --fd:'Cormorant Garamond',Georgia,serif;--fsc:'Cormorant SC',Georgia,serif;--fb:'Lora',Georgia,serif;
  --e-expo:cubic-bezier(0.16,1,0.30,1);--total-duration:10.0s;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent;width:100%;height:100%;overflow:hidden}
body{font-family:var(--fd);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.card{position:absolute;top:50%;right:104px;transform:translateY(-50%) translateX(46px) scale(.98);
  width:560px;padding:48px 56px 52px;background:var(--bg-banda);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  box-shadow:0 18px 60px rgba(31,31,27,.16);opacity:0;
  animation:enter .85s var(--e-expo) .2s forwards, exit .6s cubic-bezier(.4,0,1,1) calc(var(--total-duration) - .6s) forwards;}
.card::before{content:'';position:absolute;top:0;left:0;width:100%;height:2px;background:var(--sage-deep);transform:scaleX(0);transform-origin:left;animation:lx .7s var(--e-expo) .55s forwards}
.card::after{content:'';position:absolute;bottom:0;left:0;width:100%;height:2px;background:var(--gold);transform:scaleX(0);transform-origin:right;animation:lx .7s var(--e-expo) .7s forwards}
.tag{font-family:var(--fsc);font-weight:600;font-size:21px;letter-spacing:.34em;text-transform:uppercase;color:var(--sage-deep);display:flex;align-items:center;gap:14px;margin-bottom:10px;opacity:0;transform:translateY(10px);animation:rise .6s var(--e-expo) .9s forwards}
.tag::before{content:'';width:30px;height:1.5px;background:var(--gold)}
.sub{font-family:var(--fd);font-style:italic;font-size:30px;color:var(--ink-soft);margin-bottom:28px;opacity:0;transform:translateY(10px);animation:rise .6s var(--e-expo) 1.1s forwards}
.lista{list-style:none;display:flex;flex-direction:column}
.lista li{display:flex;justify-content:space-between;align-items:baseline;gap:24px;padding:14px 0;opacity:0;transform:translateX(-16px);filter:blur(6px);animation:sb .6s var(--e-expo) forwards}
.lista li:not(:last-child){border-bottom:1px solid rgba(123,143,106,.26)}
.lista .name{font-family:var(--fd);font-weight:500;font-size:40px;color:var(--ink);line-height:1}
.lista .note{font-family:var(--fd);font-style:italic;font-size:26px;color:var(--gold);white-space:nowrap}
.lista li:nth-child(1){animation-delay:3.6s}
.lista li:nth-child(2){animation-delay:4.2s}
.lista li:nth-child(3){animation-delay:4.8s}
.lista li:nth-child(4){animation-delay:5.4s}
@keyframes enter{to{opacity:1;transform:translateY(-50%) translateX(0) scale(1)}}
@keyframes exit{to{opacity:0;transform:translateY(-50%) translateX(0) scale(.99)}}
@keyframes lx{to{transform:scaleX(1)}}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
@keyframes sb{to{opacity:1;transform:translateX(0);filter:blur(0)}}
</style></head><body>
<div class="card">
  <div class="tag">En tu alacena</div>
  <div class="sub">ingredientes que ya tienes</div>
  <ul class="lista">
    <li><span class="name">Té matcha</span><span class="note">antioxidante</span></li>
    <li><span class="name">Cacao</span><span class="note">nutritivo</span></li>
    <li><span class="name">Leche</span><span class="note">suaviza</span></li>
    <li><span class="name">Cúrcuma</span><span class="note">ilumina</span></li>
  </ul>
</div>
</body></html>
