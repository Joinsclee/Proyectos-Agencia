<!DOCTYPE html>
<!--
  JABONES FRUTALES · ANIM 03 — TIP: Capacidad del molde (peso del agua × 1,2)
  Segmento: 01:30 → 02:10 · formula card · overlay derecha-centro · 40.0s · 1920x1080 alpha
-->
<html lang="es"><head><meta charset="UTF-8"><title>Tip · Capacidad del molde · SAVIAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Cormorant+SC:wght@500;600&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --sage:#9CAF88;--sage-deep:#7B8F6A;--gold:#B8943E;--cream:#F5EFE6;--paper:#FAF7F2;--ink:#1F1F1B;--ink-soft:#4A4A45;
  --bg-banda:rgba(245,239,230,0.90);
  --fd:'Cormorant Garamond',Georgia,serif;--fsc:'Cormorant SC',Georgia,serif;--fb:'Lora',Georgia,serif;
  --e-expo:cubic-bezier(0.16,1,0.30,1);--total-duration:40.0s;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent;width:100%;height:100%;overflow:hidden}
body{font-family:var(--fd);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.card{position:absolute;top:50%;right:104px;transform:translateY(-50%) translateX(46px) scale(.98);
  width:600px;padding:50px 58px 54px;background:var(--bg-banda);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  box-shadow:0 18px 60px rgba(31,31,27,.16);opacity:0;
  animation:enter .85s var(--e-expo) .2s forwards, exit .6s cubic-bezier(.4,0,1,1) calc(var(--total-duration) - .6s) forwards;}
.card::before{content:'';position:absolute;top:0;left:0;width:100%;height:2px;background:var(--sage-deep);transform:scaleX(0);transform-origin:left;animation:lx .7s var(--e-expo) .55s forwards}
.card::after{content:'';position:absolute;bottom:0;left:0;width:100%;height:2px;background:var(--gold);transform:scaleX(0);transform-origin:right;animation:lx .7s var(--e-expo) .7s forwards}
.tag{font-family:var(--fsc);font-weight:600;font-size:21px;letter-spacing:.34em;text-transform:uppercase;color:var(--sage-deep);display:flex;align-items:center;gap:14px;margin-bottom:18px;opacity:0;transform:translateY(10px);animation:rise .6s var(--e-expo) .9s forwards}
.tag::before{content:'';width:30px;height:1.5px;background:var(--gold)}
.head{font-family:var(--fd);font-weight:600;font-size:50px;line-height:1.05;color:var(--ink);margin-bottom:34px;opacity:0;transform:translateY(16px);filter:blur(8px);animation:br .9s var(--e-expo) 1.05s forwards}
.formula{display:flex;flex-direction:column;gap:8px;margin-bottom:30px}
.frow{display:flex;align-items:baseline;gap:18px;opacity:0;transform:translateY(14px);filter:blur(6px)}
.frow.r1{animation:br .8s var(--e-expo) 1.4s forwards}
.frow.r2{animation:br .8s var(--e-expo) 1.7s forwards}
.f-water{font-family:var(--fb);font-size:34px;color:var(--ink)}
.f-mult{font-family:var(--fd);font-style:italic;font-weight:600;font-size:72px;color:var(--gold);line-height:.9}
.f-eq{font-family:var(--fd);font-style:italic;font-size:40px;color:var(--sage-deep)}
.f-res{font-family:var(--fd);font-weight:600;font-size:40px;color:var(--ink)}
.rule{height:1.5px;background:rgba(123,143,106,.3);margin:6px 0 18px;transform:scaleX(0);transform-origin:left;animation:lx .8s var(--e-expo) 1.95s forwards}
.note{font-family:var(--fb);font-style:italic;font-size:25px;line-height:1.5;color:var(--ink-soft);opacity:0;transform:translateY(10px);animation:rise .7s var(--e-expo) 2.3s forwards}
.note b{color:var(--gold);font-style:italic;font-weight:600;font-family:var(--fd)}
.ornament{font-family:var(--fd);font-size:22px;letter-spacing:.45em;color:var(--sage-deep);text-align:center;margin-top:26px;opacity:0;transform:scale(.7);animation:pop .55s var(--e-expo) 2.7s forwards}
@keyframes enter{to{opacity:1;transform:translateY(-50%) translateX(0) scale(1)}}
@keyframes exit{to{opacity:0;transform:translateY(-50%) translateX(0) scale(.99)}}
@keyframes lx{to{transform:scaleX(1)}}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
@keyframes br{to{opacity:1;transform:translateY(0);filter:blur(0)}}
@keyframes pop{to{opacity:1;transform:scale(1)}}
</style></head><body>
<div class="card">
  <div class="tag">Tip · Medir el molde</div>
  <div class="head">Capacidad del molde</div>
  <div class="formula">
    <div class="frow r1"><span class="f-water">peso del agua</span><span class="f-mult">× 1,2</span></div>
    <div class="frow r2"><span class="f-eq">=</span><span class="f-res">gramos de jabón a fundir</span></div>
  </div>
  <div class="rule"></div>
  <div class="note"><b>1,2</b> = densidad del jabón. Así pesas justo y <b>no desperdicias</b>.</div>
  <div class="ornament">·&nbsp;&nbsp;✦&nbsp;&nbsp;·</div>
</div>
</body></html>
