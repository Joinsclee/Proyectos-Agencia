<!DOCTYPE html>
<!--
  JABONES FRUTALES · ANIM 09 — CTA EVENTO FINAL (con QR) ★ · BANNER INFERIOR full-width
  Segmento: 15:25 → 16:09 (fin) · banner inferior · 44.0s · 1920x1080 alpha · sin salida (se mantiene)
  QR: wa.me/message/O3ULP3S5BWWUP1 (grupo WhatsApp SAVIAS)
-->
<html lang="es"><head><meta charset="UTF-8"><title>CTA evento final · banner · SAVIAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Cormorant+SC:wght@500;600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --sage:#9CAF88;--sage-deep:#7B8F6A;--gold:#B8943E;--cream:#F5EFE6;--paper:#FAF7F2;--ink:#1F1F1B;--ink-soft:#4A4A45;
  --bg-banda:rgba(245,239,230,0.95);
  --fd:'Cormorant Garamond',Georgia,serif;--fsc:'Cormorant SC',Georgia,serif;--fb:'Lora',Georgia,serif;
  --e-expo:cubic-bezier(0.16,1,0.30,1);--total-duration:44.0s;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent;width:100%;height:100%;overflow:hidden}
body{font-family:var(--fd);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.banner{position:absolute;left:0;right:0;bottom:0;height:312px;background:var(--bg-banda);
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);box-shadow:0 -16px 56px rgba(31,31,27,.20);
  display:flex;align-items:center;gap:64px;padding:0 96px;
  transform:translateY(105%);opacity:0;animation:bup .9s var(--e-expo) .1s forwards;}
.banner::before{content:'';position:absolute;top:0;left:0;width:100%;height:3px;background:var(--gold);transform:scaleX(0);transform-origin:left;animation:lx 1.0s var(--e-expo) .6s forwards}
.left{flex:1;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-family:var(--fsc);font-weight:600;font-size:22px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:12px;opacity:0;transform:translateY(10px);animation:rise .6s var(--e-expo) .85s forwards}
.head{font-family:var(--fd);font-weight:600;font-size:64px;line-height:1.0;color:var(--ink);opacity:0;transform:translateY(16px);filter:blur(8px);animation:br .9s var(--e-expo) 1.05s forwards}
.head em{font-style:italic;color:var(--gold)}
.bullets{display:flex;align-items:center;gap:22px;font-family:var(--fb);font-size:24px;color:var(--ink-soft);opacity:0;transform:translateY(10px);animation:rise .7s var(--e-expo) 1.4s forwards}
.bullets span{display:flex;align-items:center;gap:22px}
.bullets span::before{content:'✦';color:var(--gold);font-size:16px}
.right{flex:0 0 auto;display:flex;align-items:center;gap:28px}
.qr{flex:0 0 auto;width:184px;height:184px;padding:11px;background:var(--paper);box-shadow:0 6px 22px rgba(31,31,27,.18);opacity:0;transform:scale(.86);animation:pop .7s var(--e-expo) 1.7s forwards}
.qr img{width:100%;height:100%;display:block}
.qr-info{display:flex;flex-direction:column;gap:8px;opacity:0;transform:translateX(16px);animation:risex .7s var(--e-expo) 2.0s forwards}
.qr-info .scan{font-family:var(--fsc);font-weight:600;font-size:18px;letter-spacing:.22em;text-transform:uppercase;color:var(--sage-deep)}
.qr-info .big{font-family:var(--fd);font-weight:600;font-size:40px;line-height:1.02;color:var(--ink)}
.qr-info .small{font-family:var(--fb);font-style:italic;font-size:23px;color:var(--ink-soft);max-width:330px}
.qr-info .small b{font-family:var(--fd);font-weight:600;font-style:normal;color:var(--gold)}
.chip{position:absolute;top:-17px;right:96px;font-family:var(--fsc);font-weight:600;font-size:18px;letter-spacing:.22em;text-transform:uppercase;color:var(--paper);background:var(--sage-deep);padding:9px 20px;border-radius:2px;box-shadow:0 6px 16px rgba(31,31,27,.18);opacity:0;transform:scale(.7) rotate(-3deg);animation:popr .6s var(--e-expo) 2.3s forwards}
@keyframes bup{to{transform:translateY(0);opacity:1}}
@keyframes lx{to{transform:scaleX(1)}}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
@keyframes risex{to{opacity:1;transform:translateX(0)}}
@keyframes br{to{opacity:1;transform:translateY(0);filter:blur(0)}}
@keyframes pop{to{opacity:1;transform:scale(1)}}
@keyframes popr{to{opacity:1;transform:scale(1) rotate(-3deg)}}
</style></head><body>
<div class="banner">
  <div class="chip">100% gratis</div>
  <div class="left">
    <div class="eyebrow">✦&nbsp; Evento gratuito · este mes</div>
    <div class="head">Aprende a crear <em>tu negocio</em> de jabones</div>
    <div class="bullets"><span>Paso a paso, desde cero</span><span>Te entrego herramientas</span></div>
  </div>
  <div class="right">
    <div class="qr"><img src="qr.png" alt="QR"></div>
    <div class="qr-info">
      <div class="scan">Escanéame ➜</div>
      <div class="big">Grupo de WhatsApp</div>
      <div class="small">+ regístrate en el <b>link de la descripción</b></div>
    </div>
  </div>
</div>
</body></html>
