<!DOCTYPE html>
<!--
  JABONES FRUTALES · ANIM 10 — MINIATURA: video "marmoleado de chocolate" (Parece de revista)
  Segmento sugerido: ~13:00 (durante el jabón de cacao) · tarjeta video relacionado · izquierda · 7.0s · 1920x1080 alpha
  Video: youtube.com/watch?v=VEbYddq-PfQ
-->
<html lang="es"><head><meta charset="UTF-8"><title>Miniatura · Marmoleado · SAVIAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700&family=Cormorant+SC:wght@500;600&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --sage:#9CAF88;--sage-deep:#7B8F6A;--gold:#B8943E;--cream:#F5EFE6;--paper:#FAF7F2;--ink:#1F1F1B;--ink-soft:#4A4A45;
  --bg-banda:rgba(245,239,230,0.93);
  --fd:'Cormorant Garamond',Georgia,serif;--fsc:'Cormorant SC',Georgia,serif;--fb:'Lora',Georgia,serif;
  --e-expo:cubic-bezier(0.16,1,0.30,1);--total-duration:7.0s;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent;width:100%;height:100%;overflow:hidden}
body{font-family:var(--fd);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.card{position:absolute;top:50%;left:104px;transform:translateY(-50%) translateX(-60px);
  width:500px;padding:26px 26px 30px;background:var(--bg-banda);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  box-shadow:0 18px 60px rgba(31,31,27,.20);opacity:0;
  animation:enterL .8s var(--e-expo) .15s forwards, exitL .6s cubic-bezier(.4,0,1,1) calc(var(--total-duration) - .6s) forwards;}
.tag{font-family:var(--fsc);font-weight:600;font-size:18px;letter-spacing:.32em;text-transform:uppercase;color:var(--sage-deep);display:flex;align-items:center;gap:12px;margin-bottom:16px;opacity:0;transform:translateY(8px);animation:rise .6s var(--e-expo) .55s forwards}
.tag::before{content:'';width:26px;height:1.5px;background:var(--gold)}
.thumb{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border:1px solid rgba(31,31,27,.10);box-shadow:0 8px 22px rgba(31,31,27,.18);opacity:0;transform:scale(.96);animation:pop .7s var(--e-expo) .7s forwards}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:74px;height:74px;border-radius:50%;background:rgba(245,239,230,.94);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(31,31,27,.28)}
.play::after{content:'';border-left:24px solid var(--gold);border-top:15px solid transparent;border-bottom:15px solid transparent;margin-left:6px}
.title{font-family:var(--fd);font-weight:600;font-size:38px;line-height:1.06;color:var(--ink);margin-top:18px;opacity:0;transform:translateY(10px);animation:rise .6s var(--e-expo) 1.0s forwards}
.sub{font-family:var(--fb);font-style:italic;font-size:22px;color:var(--ink-soft);margin-top:6px;opacity:0;transform:translateY(10px);animation:rise .6s var(--e-expo) 1.2s forwards}
@keyframes enterL{to{opacity:1;transform:translateY(-50%) translateX(0)}}
@keyframes exitL{to{opacity:0;transform:translateY(-50%) translateX(-40px)}}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
@keyframes pop{to{opacity:1;transform:scale(1)}}
</style></head><body>
<div class="card">
  <div class="tag">Ver también</div>
  <div class="thumb"><img src="thumb.jpg" alt="miniatura"><div class="play"></div></div>
  <div class="title">Marmoleado de chocolate</div>
  <div class="sub">técnica completa en mi canal</div>
</div>
</body></html>
