<!DOCTYPE html>
<!--
  JABONES FRUTALES · ANIM 06 — TIP: Temperatura para añadir semillas (45–48 °C)
  Segmento: 08:34 → 08:50 · temp card · overlay derecha-centro · 16.0s · 1920x1080 alpha
-->
<html lang="es"><head><meta charset="UTF-8"><title>Tip · Temperatura semillas · SAVIAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Cormorant+SC:wght@500;600&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --sage:#9CAF88;--sage-deep:#7B8F6A;--gold:#B8943E;--cream:#F5EFE6;--paper:#FAF7F2;--ink:#1F1F1B;--ink-soft:#4A4A45;
  --bg-banda:rgba(245,239,230,0.90);
  --fd:'Cormorant Garamond',Georgia,serif;--fsc:'Cormorant SC',Georgia,serif;--fb:'Lora',Georgia,serif;
  --e-expo:cubic-bezier(0.16,1,0.30,1);--total-duration:16.0s;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent;width:100%;height:100%;overflow:hidden}
body{font-family:var(--fd);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.card{position:absolute;top:50%;right:104px;transform:translateY(-50%) translateX(46px) scale(.98);
  width:540px;padding:48px 56px 50px;background:var(--bg-banda);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  box-shadow:0 18px 60px rgba(31,31,27,.16);opacity:0;
  animation:enter .85s var(--e-expo) .2s forwards, exit .55s cubic-bezier(.4,0,1,1) calc(var(--total-duration) - .55s) forwards;}
.card::before{content:'';position:absolute;top:0;left:0;width:100%;height:2px;background:var(--sage-deep);transform:scaleX(0);transform-origin:left;animation:lx .7s var(--e-expo) .55s forwards}
.card::after{content:'';position:absolute;bottom:0;left:0;width:100%;height:2px;background:var(--gold);transform:scaleX(0);transform-origin:right;animation:lx .7s var(--e-expo) .7s forwards}
.tag{font-family:var(--fsc);font-weight:600;font-size:21px;letter-spacing:.34em;text-transform:uppercase;color:var(--sage-deep);display:flex;align-items:center;gap:14px;margin-bottom:20px;opacity:0;transform:translateY(10px);animation:rise .6s var(--e-expo) .9s forwards}
.tag::before{content:'';width:30px;height:1.5px;background:var(--gold)}
.temp{font-family:var(--fd);font-weight:600;font-size:108px;line-height:.95;color:var(--gold);margin-bottom:4px;opacity:0;transform:translateY(18px) scale(.96);filter:blur(9px);animation:brs 1.0s var(--e-expo) 1.05s forwards}
.temp .u{font-size:60px;font-style:italic;font-weight:400}
.sub{font-family:var(--fd);font-style:italic;font-size:34px;color:var(--ink);margin-bottom:18px;opacity:0;transform:translateY(12px);animation:rise .7s var(--e-expo) 1.45s forwards}
.note{font-family:var(--fb);font-style:italic;font-size:24px;line-height:1.5;color:var(--ink-soft);opacity:0;transform:translateY(10px);animation:rise .7s var(--e-expo) 1.75s forwards}
@keyframes enter{to{opacity:1;transform:translateY(-50%) translateX(0) scale(1)}}
@keyframes exit{to{opacity:0;transform:translateY(-50%) translateX(0) scale(.99)}}
@keyframes lx{to{transform:scaleX(1)}}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
@keyframes brs{to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
</style></head><body>
<div class="card">
  <div class="tag">Temperatura</div>
  <div class="temp">45–48<span class="u"> °C</span></div>
  <div class="sub">para añadir las semillas</div>
  <div class="note">Así quedan en suspensión y no se van al fondo del molde.</div>
</div>
</body></html>
