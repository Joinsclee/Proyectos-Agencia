<!DOCTYPE html>
<!--

<html lang="es"><head><meta charset="UTF-8"><title>CTA evento (medio) · banner · SAVIAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Cormorant+SC:wght@500;600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --sage:#9CAF88;--sage-deep:#7B8F6A;--gold:#B8943E;--cream:#F5EFE6;--paper:#FAF7F2;--ink:#1F1F1B;--ink-soft:#4A4A45;
  --bg-banda:rgba(245,239,230,0.94);
  --fd:'Cormorant Garamond',Georgia,serif;--fsc:'Cormorant SC',Georgia,serif;--fb:'Lora',Georgia,serif;
  --e-expo:cubic-bezier(0.16,1,0.30,1);--total-duration:27.0s;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent;width:100%;height:100%;overflow:hidden}
body{font-family:var(--fd);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.banner{position:absolute;left:0;right:0;bottom:0;height:232px;background:var(--bg-banda);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 -14px 50px rgba(31,31,27,.16);
  display:flex;align-items:center;justify-content:space-between;gap:60px;padding:0 96px;
  transform:translateY(105%);opacity:0;
  animation:bup .85s var(--e-expo) .1s forwards, bdown .6s cubic-bezier(.4,0,1,1) calc(var(--total-duration) - .6s) forwards;}
.banner::before{content:'';position:absolute;top:0;left:0;width:100%;height:3px;background:var(--gold);transform:scaleX(0);transform-origin:left;animation:lx .9s var(--e-expo) .6s forwards}
.left{display:flex;flex-direction:column;gap:8px}
.eyebrow{font-family:var(--fsc);font-weight:600;font-size:22px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:12px;opacity:0;transform:translateY(10px);animation:rise .6s var(--e-expo) .85s forwards}
.head{font-family:var(--fd);font-weight:600;font-size:62px;line-height:1.02;color:var(--ink);opacity:0;transform:translateY(16px);filter:blur(8px);animation:br .9s var(--e-expo) 1.05s forwards}
.head em{font-style:italic;color:var(--gold)}
.right{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:14px}
.cta-line{display:flex;align-items:center;gap:14px;font-family:var(--fd);font-weight:600;font-size:40px;color:var(--ink);opacity:0;transform:translateX(16px);animation:risex .7s var(--e-expo) 1.4s forwards}
.cta-line .arrow{color:var(--gold);font-style:italic}
.chip{font-family:var(--fsc);font-weight:600;font-size:19px;letter-spacing:.22em;text-transform:uppercase;color:var(--paper);background:var(--sage-deep);padding:9px 20px;border-radius:2px;opacity:0;transform:scale(.8);animation:pop .55s var(--e-expo) 1.75s forwards}
@keyframes bup{to{transform:translateY(0);opacity:1}}
@keyframes bdown{to{transform:translateY(105%);opacity:0}}
@keyframes lx{to{transform:scaleX(1)}}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
@keyframes risex{to{opacity:1;transform:translateX(0)}}
@keyframes br{to{opacity:1;transform:translateY(0);filter:blur(0)}}
@keyframes pop{to{opacity:1;transform:scale(1)}}
</style></head><body>
<div class="banner">
  <div class="left">
    <div class="eyebrow">✦&nbsp; Evento gratuito · este mes</div>
    <div class="head">Crea tu negocio de jabones <em>desde casa</em></div>
  </div>
  <div class="right">
    <div class="cta-line"><span class="arrow">➜</span> Regístrate en la descripción</div>
    <div class="chip">100% gratis</div>
  </div>
</div>
</body></html>
