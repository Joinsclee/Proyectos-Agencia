<html lang="es"><head><meta charset="UTF-8"><title>Tip · Sobrecocción · SAVIAS</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Cormorant+SC:wght@500;600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --sage:#9CAF88;--sage-deep:#7B8F6A;--gold:#B8943E;--cream:#F5EFE6;--paper:#FAF7F2;--ink:#1F1F1B;--ink-soft:#4A4A45;

  --fd:'Cormorant Garamond',Georgia,serif;--fsc:'Cormorant SC',Georgia,serif;--fb:'Lora',Georgia,serif;
  --e-expo:cubic-bezier(0.16,1,0.30,1);--total-duration:28.0s;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent;width:100%;height:100%;overflow:hidden}
body{font-family:var(--fd);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.card{position:absolute;top:50%;right:104px;transform:translateY(-50%) translateX(46px) scale(.98);

.card::before{content:'';position:absolute;top:0;left:0;width:100%;height:2px;background:var(--sage-deep);transform:scaleX(0);transform-origin:left;animation:lx .7s var(--e-expo) .55s forwards}
.card::after{content:'';position:absolute;bottom:0;left:0;width:100%;height:2px;background:var(--gold);transform:scaleX(0);transform-origin:right;animation:lx .7s var(--e-expo) .7s forwards}

.head{font-family:var(--fd);font-weight:600;font-size:54px;line-height:1.04;color:var(--ink);margin-bottom:10px;opacity:0;transform:translateY(16px);filter:blur(8px);animation:br .9s var(--e-expo) 1.05s forwards}

.lista li:not(:last-child){border-bottom:1px solid rgba(123,143,106,.26)}
.lista li::before{content:'';flex:0 0 auto;width:9px;height:9px;border-radius:50%;background:var(--gold)}
.lista li b{font-family:var(--fd);font-weight:600;color:var(--ink)}
.lista li:nth-child(1){animation-delay:1.55s}
.lista li:nth-child(2){animation-delay:1.75s}
.lista li:nth-child(3){animation-delay:1.95s}
.foot{font-family:var(--fb);font-style:italic;font-size:24px;color:var(--ink-soft);margin-top:24px;opacity:0;transform:translateY(10px);animation:rise .7s var(--e-expo) 2.4s forwards}
@keyframes enter{to{opacity:1;transform:translateY(-50%) translateX(0) scale(1)}}
@keyframes exit{to{opacity:0;transform:translateY(-50%) translateX(0) scale(.99)}}
@keyframes lx{to{transform:scaleX(1)}}

@keyframes sb{to{opacity:1;transform:translateX(0);filter:blur(0)}}

<div class="card">

</div>
