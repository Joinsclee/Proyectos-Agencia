<!DOCTYPE html>
<!--
  ANIMACIÓN #07a: Han pasado 24 horas — versión CREAM
  Cliente: SAVIAS · Video: Jabón Drop Swirl
  Tipo: title-card / chapter-card (transición narrativa fuerte)
  Duración total: 4.5s
  Dimensiones: 1920x1080 (frame completo YouTube horizontal)
  Background: cream sólido (#F5EFE6) — placa interrumpe el metraje
  Captura: node capture-animation.js animation.html animation.mov 1920 1080 4.5

  NOTA: Esta es la versión cream/clara. Existe #07b en dark hero.
  Cristhian decide cuál pega con el ritmo del video.
-->
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Han pasado 24 horas · Cream · SAVIAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600&family=Cormorant+SC:wght@400;500;600&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --sage: #9CAF88;
  --sage-deep: #7B8F6A;
  --gold: #B8943E;
  --cream: #F5EFE6;
  --cream-deep: #EDE4D3;
  --ink: #1F1F1B;
  --ink-soft: #4A4A45;

  --font-display: 'Cormorant Garamond', Georgia, serif;
  --font-display-sc: 'Cormorant SC', Georgia, serif;
  --font-body: 'Lora', Georgia, serif;

  --total-duration: 4.5s;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
}

body {
  background: var(--cream);
  font-family: var(--font-display);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

/* ───────── CARD CENTRAL ───────── */
.card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 0 160px;
  max-width: 1600px;
  opacity: 0;
  transform: scale(0.97);
  animation:
    card-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards,
    card-out 0.7s cubic-bezier(0.4, 0, 1, 1) calc(var(--total-duration) - 0.7s) forwards;
}

/* Línea gold superior */
.top-line {
  width: 140px;
  height: 1.5px;
  background: var(--sage-deep);
  margin-bottom: 40px;
  transform: scaleX(0);
  transform-origin: center;
  animation: line-draw 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.4s forwards;
}

/* Eyebrow */
.eyebrow {
  font-family: var(--font-display-sc);
  font-weight: 500;
  font-size: 28px;
  letter-spacing: 0.42em;
  text-transform: uppercase;
  color: var(--sage-deep);
  margin-bottom: 36px;
  opacity: 0;
  transform: translateY(14px);
  animation: text-in 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.6s forwards;
}

/* Hero title */
.hero-title {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 200px;
  line-height: 1.0;
  color: var(--ink);
  letter-spacing: -0.01em;
  margin-bottom: 36px;
  opacity: 0;
  transform: translateY(20px);
  animation: text-in 0.85s cubic-bezier(0.22, 1, 0.36, 1) 0.85s forwards;
}

.hero-title .accent {
  font-style: italic;
  color: var(--gold);
  font-weight: 400;
}

/* Descriptor italic */
.descriptor {
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 400;
  font-size: 42px;
  line-height: 1.3;
  color: var(--ink-soft);
  max-width: 1100px;
  opacity: 0;
  transform: translateY(14px);
  animation: text-in 0.6s cubic-bezier(0.22, 1, 0.36, 1) 1.25s forwards;
}

/* Ornamento */
.bottom-ornament {
  font-family: var(--font-display);
  font-size: 26px;
  letter-spacing: 0.45em;
  color: var(--gold);
  margin-top: 44px;
  opacity: 0;
  transform: scale(0.6);
  animation: ornament-in 0.5s cubic-bezier(0.22, 1, 0.36, 1) 1.55s forwards;
}

/* Línea gold inferior */
.bottom-line {
  width: 140px;
  height: 1.5px;
  background: var(--sage-deep);
  margin-top: 28px;
  transform: scaleX(0);
  transform-origin: center;
  animation: line-draw 0.55s cubic-bezier(0.22, 1, 0.36, 1) 1.65s forwards;
}

/* Corner tags */
.corner-tag {
  position: absolute;
  font-family: var(--font-display-sc);
  font-weight: 500;
  font-size: 15px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--sage-deep);
  display: flex;
  align-items: center;
  gap: 14px;
  opacity: 0;
  animation: corner-in 0.5s cubic-bezier(0.22, 1, 0.36, 1) 1.85s forwards;
}

.corner-tag::before {
  content: '';
  width: 22px; height: 1px;
  background: var(--sage-deep);
}

.corner-tag.top-left { top: 70px; left: 90px; }
.corner-tag.bottom-right {
  bottom: 70px; right: 90px;
  flex-direction: row-reverse;
}

/* ───────── KEYFRAMES ───────── */
@keyframes card-in { to { opacity: 1; transform: scale(1); } }
@keyframes card-out { to { opacity: 0; transform: scale(1.02); } }
@keyframes line-draw { to { transform: scaleX(1); } }
@keyframes text-in { to { opacity: 1; transform: translateY(0); } }
@keyframes ornament-in { to { opacity: 1; transform: scale(1); } }
@keyframes corner-in { to { opacity: 1; } }
</style>
</head>
<body>

<div class="corner-tag top-left">SAVIAS · Drop Swirl</div>

<div class="card">
  <div class="top-line"></div>
  <div class="eyebrow">Curado · día 1</div>
  <h1 class="hero-title">Han pasado <span class="accent">24 horas</span></h1>
  <div class="descriptor">El momento más esperado</div>
  <div class="bottom-ornament">·  ✦  ·</div>
  <div class="bottom-line"></div>
</div>

<div class="corner-tag bottom-right">Lina Toro · Jabonería</div>

</body>
</html>
