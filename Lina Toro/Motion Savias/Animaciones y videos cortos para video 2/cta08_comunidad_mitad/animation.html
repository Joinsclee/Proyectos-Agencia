  - 2.5-3.5s: entrada del QR (sostenido a partir de aquí)
  - 3.5-19.0s: TODO sostenido (15.5s de QR escaneable)
  - 19.0-20.0s: salida con fade

<html lang="es">
<head>
<meta charset="UTF-8">
<title>cta08 · Comunidad mitad · SAVIAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cormorant+SC:wght@500;600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --sage: #9CAF88;
  --sage-deep: #7B8F6A;
  --gold: #B8943E;
  --gold-bright: #D4AC55;
  --cream: #F5EFE6;
  --paper: #FAF7F2;
  --ink: #1F1F1B;
  --ink-soft: #4A4A45;
  --dark-tinta: #3E4A2F;

  --font-display: 'Cormorant Garamond', Georgia, serif;
  --font-display-sc: 'Cormorant SC', Georgia, serif;
  --font-body: 'Lora', Georgia, serif;

  --total-duration: 20.0s;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  background: transparent;
  width: 100%; height: 100%;
  overflow: hidden;
}

body {
  font-family: var(--font-display);
  -webkit-font-smoothing: antialiased;
}

/* ───────── CONTENEDOR GENERAL ─────────
   Composición centro-derecha. Layout horizontal:
   - Izquierda dentro del composite: pantallazo classroom con marco editorial
   - Derecha: bloque CTA verde-tinta con QR */
.cta-composite {
  position: absolute;
  top: 50%;
  right: 70px;
  transform: translateY(-50%);
  width: 1080px;
  display: grid;
  grid-template-columns: 1.05fr 1fr;
  gap: 22px;
  align-items: stretch;
  opacity: 0;
  animation:
    composite-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards,
    composite-out 0.8s cubic-bezier(0.4, 0, 1, 1) calc(var(--total-duration) - 0.8s) forwards;
}

/* ───────── COLUMNA IZQUIERDA: pantallazo classroom ───────── */
.screen-column {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* Tag superior */
.screen-tag-row {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 8px 18px;
  background: rgba(245, 239, 230, 0.88);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  align-self: flex-start;
  opacity: 0;
  transform: translateX(-10px);
  animation: text-in 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.55s forwards;
}
.screen-tag-row::before {
  content: '';
  width: 22px; height: 1.5px;
  background: var(--gold);
}
.screen-tag {
  font-family: var(--font-display-sc);
  font-weight: 600;
  font-size: 14px;
  letter-spacing: 0.38em;
  text-transform: uppercase;
  color: var(--sage-deep);
}

.screen-frame {
  background: var(--paper);
  border: 1px solid var(--gold);
  padding: 8px;
  position: relative;
  box-shadow: 0 12px 32px rgba(31, 31, 27, 0.22);
  opacity: 0;
  transform: scale(0.96);
  animation: frame-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.4s forwards;
  /* Opacidad reducida según brief (~70% durante todo el CTA) */
}

.screen-frame::before, .screen-frame::after {
  content: '';
  position: absolute;
  width: 20px; height: 20px;
  border: 1.5px solid var(--gold);
}
.screen-frame::before {
  top: -1px; left: -1px;
  border-right: none; border-bottom: none;
}
.screen-frame::after {
  bottom: -1px; right: -1px;
  border-left: none; border-top: none;
}

.screen-frame img {
  width: 100%;
  height: auto;
  display: block;
  /* Sutil pan/zoom durante los 20s — efecto ken burns suave */
  animation: kenburns 20s ease-in-out 0.4s forwards;
}

@keyframes kenburns {
  0% { transform: scale(1.0) translateX(0); }
  100% { transform: scale(1.06) translateX(-2%); }
}

.screen-caption {
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 400;
  font-size: 20px;
  color: var(--cream);
  background: rgba(62, 74, 47, 0.88);
  padding: 10px 18px;
  text-align: center;
  align-self: stretch;
  opacity: 0;
  transform: translateY(8px);
  animation: text-in 0.5s cubic-bezier(0.22, 1, 0.36, 1) 1.1s forwards;
}

/* ───────── COLUMNA DERECHA: bloque CTA verde-tinta + QR ───────── */
.cta-column {
  background: rgba(62, 74, 47, 0.92);
  padding: 30px 32px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  position: relative;
  opacity: 0;
  transform: translateX(20px);
  animation:
    cta-col-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) 1.5s forwards;
}

.cta-column::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 2px;
  background: var(--gold-bright);
  transform: scaleX(0);
  transform-origin: left center;
  animation: line-draw 0.55s cubic-bezier(0.22, 1, 0.36, 1) 2.0s forwards;
}

.cta-eyebrow {
  font-family: var(--font-display-sc);
  font-weight: 600;
  font-size: 14px;
  letter-spacing: 0.42em;
  text-transform: uppercase;
  color: var(--cream);
  display: flex;
  align-items: center;
  gap: 12px;
  opacity: 0;
  transform: translateY(8px);
  animation: text-in 0.5s cubic-bezier(0.22, 1, 0.36, 1) 2.1s forwards;
}
.cta-eyebrow::before, .cta-eyebrow::after {
  content: '';
  width: 14px; height: 1px;
  background: var(--cream);
}

.cta-headline {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 36px;
  line-height: 1.1;
  color: var(--cream);
  text-align: center;
  letter-spacing: -0.01em;
  opacity: 0;
  transform: translateY(10px);
  animation: text-in 0.55s cubic-bezier(0.22, 1, 0.36, 1) 2.3s forwards;
}

.cta-headline .accent {
  font-style: italic;
  color: var(--gold-bright);
  font-weight: 400;
}

.qr-slot {
  width: 220px;
  height: 220px;
  background: var(--paper);
  border: 2px solid var(--gold-bright);
  padding: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transform: scale(0.85);
  animation: qr-in 0.6s cubic-bezier(0.34, 1.3, 0.64, 1) 2.5s forwards;
}

.qr-slot img {
  width: 100%; height: 100%;
  object-fit: contain;
}

.cta-subhead {
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 400;
  font-size: 20px;
  color: rgba(245, 239, 230, 0.88);
  text-align: center;
  display: flex;
  align-items: center;
  gap: 12px;
  opacity: 0;
  transform: translateY(8px);
  animation: text-in 0.5s cubic-bezier(0.22, 1, 0.36, 1) 2.75s forwards;
}

.cta-subhead .arrow {
  display: inline-block;
  font-size: 26px;
  color: var(--gold-bright);
  font-style: normal;
  animation: arrow-bounce 1.8s ease-in-out 3.5s infinite;
}

@keyframes composite-in { to { opacity: 1; transform: translateY(-50%); } }
@keyframes composite-out { to { opacity: 0; transform: translateY(-50%); } }
@keyframes frame-in { to { opacity: 0.92; transform: scale(1); } }
@keyframes text-in { to { opacity: 1; transform: translateY(0) translateX(0); } }
@keyframes cta-col-in { to { opacity: 1; transform: translateX(0); } }
@keyframes line-draw { to { transform: scaleX(1); } }
@keyframes qr-in { to { opacity: 1; transform: scale(1); } }
@keyframes arrow-bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(5px); }
}
</style>
</head>
