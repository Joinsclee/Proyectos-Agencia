<style>
:root {
  --sage: #9CAF88;
  --sage-deep: #7B8F6A;
  --gold: #B8943E;
  --gold-bright: #D4AC55;
  --cream: #F5EFE6;
  --paper: #FAF7F2;
  --ink: #1F1F1B;
  --ink-soft: #4A4A45;

  --font-display: 'Cormorant Garamond', Georgia, serif;
  --font-display-sc: 'Cormorant SC', Georgia, serif;
  --font-body: 'Lora', Georgia, serif;

  --total-duration: 6.0s;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  background: transparent;
  width: 100%; height: 100%;
  overflow: hidden;
}

body {
  font-family: var(--font-display);
  -webkit-font-smoothing: antialiased;
}

.leccion-card {
  position: absolute;
  top: 50%;
  right: 90px;
  transform: translateY(-50%) translateX(30px) scale(0.95);
  width: 800px;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 16px;
  opacity: 0;
  animation:
    card-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards,
    card-out 0.6s cubic-bezier(0.4, 0, 1, 1) calc(var(--total-duration) - 0.6s) forwards;
}

/* Tag superior editorial — placa cream translúcida */
.eyebrow-row {
  display: inline-flex;
  align-items: center;
  gap: 14px;
  padding: 10px 22px;
  background: rgba(245, 239, 230, 0.85);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  align-self: flex-start;
  opacity: 0;
  transform: translateX(-12px);
  animation: text-in 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.6s forwards;
}

.eyebrow-row::before {
  content: '';
  width: 28px; height: 1.5px;
  background: var(--gold);
}

.eyebrow-text {
  font-family: var(--font-display-sc);
  font-weight: 600;
  font-size: 18px;
  letter-spacing: 0.38em;
  text-transform: uppercase;
  color: var(--sage-deep);
}

.eyebrow-text .dot {
  color: var(--gold);
  font-weight: 500;
  margin: 0 4px;
}

/* Frame del pantallazo del classroom */
.screenshot-frame {
  width: 100%;
  background: var(--paper);
  border: 1px solid var(--gold);
  padding: 10px;
  position: relative;
  box-shadow: 0 14px 38px rgba(31, 31, 27, 0.22);
  opacity: 0;
  transform: scale(0.96);
  animation: frame-in 0.75s cubic-bezier(0.22, 1, 0.36, 1) 0.4s forwards;
}

/* Esquinas estilo polaroid editorial */
.screenshot-frame::before, .screenshot-frame::after {
  content: '';
  position: absolute;
  width: 24px; height: 24px;
  border: 1.5px solid var(--gold);
}
.screenshot-frame::before {
  top: -1px; left: -1px;
  border-right: none; border-bottom: none;
}
.screenshot-frame::after {
  bottom: -1px; right: -1px;
  border-left: none; border-top: none;
}

.screenshot-frame img {
  width: 100%;
  height: auto;
  display: block;
}

/* Descriptor inferior con placa cream */
.descriptor-row {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  padding: 12px 24px;
  background: rgba(245, 239, 230, 0.85);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  align-self: center;
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 400;
  font-size: 26px;
  color: var(--ink);
  margin-top: 4px;
  opacity: 0;
  animation: text-in 0.5s cubic-bezier(0.22, 1, 0.36, 1) 1.25s forwards;
}

.descriptor-row .ornament {
  font-style: normal;
  color: var(--gold);
  font-size: 18px;
  letter-spacing: 0.4em;
}

@keyframes card-in {
  to { opacity: 1; transform: translateY(-50%) translateX(0) scale(1); }
}
@keyframes card-out {
  to { opacity: 0; transform: translateY(-50%) translateX(0) scale(0.97); }
}
@keyframes frame-in {
  to { opacity: 1; transform: scale(1); }
}
@keyframes text-in {
  to { opacity: 1; transform: translateY(0) translateX(0); }
}
</style>
