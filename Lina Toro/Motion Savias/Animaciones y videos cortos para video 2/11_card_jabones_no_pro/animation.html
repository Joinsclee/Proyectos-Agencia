<head>

<title>Animación 11 · Card Jabones No Pro · SAVIAS</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cormorant+SC:wght@500;600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --sage: #9CAF88;
  --sage-deep: #7B8F6A;
  --gold: #B8943E;
  --gold-bright: #D4AC55;
  --cream: #F5EFE6;
  --paper: #FAF7F2;
  --ink: #1F1F1B;
  --ink-soft: #4A4A45;

  --font-display: 'Cormorant Garamond', Georgia, serif;
  --font-display-sc: 'Cormorant SC', Georgia, serif;
  --font-body: 'Lora', Georgia, serif;

  --total-duration: 4.5s;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  background: transparent;
  width: 100%; height: 100%;
  overflow: hidden;
}

body {
  font-family: var(--font-display);
  -webkit-font-smoothing: antialiased;
}

.video-card {
  position: absolute;
  top: 50%;
  right: 110px;
  transform: translateY(-50%) translateX(30px) scale(0.94);
  width: 720px;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 18px;
  opacity: 0;
  animation:
    card-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards,
    card-out 0.6s cubic-bezier(0.4, 0, 1, 1) calc(var(--total-duration) - 0.6s) forwards;
}

.eyebrow-row {
  display: inline-flex;
  align-items: center;
  gap: 14px;
  padding: 10px 22px;
  background: rgba(245, 239, 230, 0.78);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  align-self: flex-start;
  opacity: 0;
  transform: translateX(-12px);
  animation: text-in 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.6s forwards;
}

.eyebrow-row::before {
  content: '';
  width: 28px; height: 1.5px;
  background: var(--gold);
}

.eyebrow-text {
  font-family: var(--font-display-sc);
  font-weight: 600;
  font-size: 18px;
  letter-spacing: 0.38em;
  text-transform: uppercase;
  color: var(--sage-deep);
}

.eyebrow-text .accent {
  color: var(--gold);
}

.screenshot-frame {
  width: 100%;
  background: var(--paper);
  border: 1px solid var(--gold);
  padding: 10px;
  position: relative;
  box-shadow: 0 12px 32px rgba(31, 31, 27, 0.18);
  opacity: 0;
  transform: scale(0.96);
  animation: frame-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.4s forwards;
}

.screenshot-frame::before, .screenshot-frame::after {
  content: '';
  position: absolute;
  width: 22px; height: 22px;
  border: 1.5px solid var(--gold);
}
.screenshot-frame::before {
  top: -1px; left: -1px;
  border-right: none; border-bottom: none;
}
.screenshot-frame::after {
  bottom: -1px; right: -1px;
  border-left: none; border-top: none;
}

.screenshot-frame img {
  width: 100%;
  height: auto;
  display: block;
}

.video-title {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 42px;
  line-height: 1.1;
  color: var(--cream);
  background: rgba(62, 74, 47, 0.92);
  padding: 18px 24px;
  text-align: center;
  letter-spacing: -0.005em;
  opacity: 0;
  transform: translateY(12px);
  animation: text-in 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.95s forwards;
}

.video-title .accent {
  font-style: italic;
  color: var(--gold-bright);
  font-weight: 400;
}

.descriptor-row {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  padding: 10px 22px;
  background: rgba(245, 239, 230, 0.78);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  align-self: center;
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 400;
  font-size: 24px;
  color: var(--ink);
  margin-top: 4px;
  opacity: 0;
  animation: text-in 0.5s cubic-bezier(0.22, 1, 0.36, 1) 1.25s forwards;
}

.descriptor-row .arrow {
  font-style: normal;
  color: var(--gold);
  font-size: 28px;
}

@keyframes card-in {
  to { opacity: 1; transform: translateY(-50%) translateX(0) scale(1); }
}
@keyframes card-out {
  to { opacity: 0; transform: translateY(-50%) translateX(0) scale(0.97); }
}
@keyframes frame-in {
  to { opacity: 1; transform: scale(1); }
}
@keyframes text-in {
  to { opacity: 1; transform: translateY(0) translateX(0); }
}
</style>
