<head>

<title>cta14b · Banner WhatsApp · SAVIAS</title>

<style>
:root {
  --sage: #9CAF88;
  --sage-deep: #7B8F6A;
  --sage-light: #DCE2CB;
  --gold: #B8943E;
  --gold-bright: #D4AC55;
  --cream: #F5EFE6;
  --paper: #FAF7F2;
  --ink: #1F1F1B;
  --dark-tinta: #3E4A2F;

  --font-display: 'Cormorant Garamond', Georgia, serif;
  --font-display-sc: 'Cormorant SC', Georgia, serif;
  --font-body: 'Lora', Georgia, serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  background: transparent;
  width: 100%; height: 100%;
  overflow: hidden;
}

body {
  font-family: var(--font-display);
  -webkit-font-smoothing: antialiased;
}

/* ───────── BANNER INFERIOR ───────── */
.banner {
  position: absolute;
  left: 70px;
  right: 70px;
  bottom: 70px;
  height: 240px;
  background: rgba(62, 74, 47, 0.94);
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 40px;
  padding: 0 50px;
  box-shadow: 0 16px 42px rgba(31, 31, 27, 0.22);

  opacity: 0;
  transform: translateY(40px);
  animation:
    banner-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.0s forwards,
    banner-out 0.8s cubic-bezier(0.4, 0, 1, 1) calc(75s - 1.5s) forwards;
}

/* Línea gold superior del banner */
.banner::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: var(--gold-bright);
  transform: scaleX(0);
  transform-origin: left center;
  animation: line-draw 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.4s forwards;
}

/* Esquinas decorativas editoriales */
.banner::after {
  content: '';
  position: absolute;
  top: 12px;
  right: 12px;
  width: 24px;
  height: 24px;
  border-top: 1.5px solid var(--gold-bright);
  border-right: 1.5px solid var(--gold-bright);
  opacity: 0;
  animation: fade-in 0.5s ease-out 0.8s forwards;
}

/* Esquina inferior izquierda */
.banner-corner-bl {
  position: absolute;
  bottom: 12px;
  left: 12px;
  width: 24px;
  height: 24px;
  border-bottom: 1.5px solid var(--gold-bright);
  border-left: 1.5px solid var(--gold-bright);
  opacity: 0;
  animation: fade-in 0.5s ease-out 0.8s forwards;
}

/* ───────── COLUMNA 1: QR ───────── */
.qr-slot {
  width: 180px;
  height: 180px;
  background: var(--paper);
  border: 2px solid var(--gold-bright);
  padding: 8px;
  flex-shrink: 0;
  box-shadow: 0 8px 22px rgba(0,0,0,0.18);
  opacity: 0;
  transform: scale(0.85);
  animation: qr-in 0.6s cubic-bezier(0.34, 1.3, 0.64, 1) 0.85s forwards;
}

.qr-slot img {
  width: 100%; height: 100%;
  object-fit: contain;
  display: block;
}

/* ───────── COLUMNA 2: TEXTOS ───────── */
.text-block {
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-self: center;
}

.eyebrow {
  font-family: var(--font-display-sc);
  font-weight: 600;
  font-size: 14px;
  letter-spacing: 0.45em;
  text-transform: uppercase;
  color: var(--gold-bright);
  display: flex;
  align-items: center;
  gap: 12px;
  opacity: 0;
  transform: translateX(-10px);
  animation: text-in 0.5s cubic-bezier(0.22, 1, 0.36, 1) 1.0s forwards;
}
.eyebrow::before {
  content: '';
  width: 28px;
  height: 1.5px;
  background: var(--gold-bright);
}

.headline {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 56px;
  line-height: 1.02;
  color: var(--cream);
  letter-spacing: -0.01em;
  opacity: 0;
  transform: translateY(10px);
  animation: text-in 0.55s cubic-bezier(0.22, 1, 0.36, 1) 1.2s forwards;
}

.headline .accent {
  font-style: italic;
  color: var(--gold-bright);
  font-weight: 400;
}

.descriptor {
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 400;
  font-size: 24px;
  color: rgba(245, 239, 230, 0.78);
  display: flex;
  align-items: center;
  gap: 12px;
  opacity: 0;
  transform: translateY(8px);
  animation: text-in 0.5s cubic-bezier(0.22, 1, 0.36, 1) 1.45s forwards;
}

.descriptor .arrow {
  font-style: normal;
  color: var(--gold-bright);
  font-size: 22px;
  /* Bounce sutil después que entra */
  animation: arrow-bounce 2.2s ease-in-out 3.0s infinite;
}

/* ───────── COLUMNA 3: Icono WhatsApp en line-art editorial ───────── */
.whatsapp-icon {
  width: 130px;
  height: 130px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transform: scale(0.88);
  animation: icon-in 0.6s cubic-bezier(0.22, 1, 0.36, 1) 1.5s forwards;
}

.whatsapp-icon svg {
  width: 100%;
  height: 100%;
}

/* ───────── KEYFRAMES ───────── */
@keyframes banner-in {
  to { opacity: 1; transform: translateY(0); }
}
@keyframes banner-out {
  to { opacity: 0; transform: translateY(20px); }
}
@keyframes line-draw {
  to { transform: scaleX(1); }
}
@keyframes fade-in {
  to { opacity: 1; }
}
@keyframes qr-in {
  to { opacity: 1; transform: scale(1); }
}
@keyframes text-in {
  to { opacity: 1; transform: translateY(0) translateX(0); }
}
@keyframes icon-in {
  to { opacity: 1; transform: scale(1); }
}
@keyframes arrow-bounce {
  0%, 100% { transform: translateX(0); }
  50% { transform: translateX(6px); }
}
</style>
</head>
