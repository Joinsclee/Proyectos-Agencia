# ────────────────────────────────────────────────────────────────
# NIVEL 1 — FUNDAMENTOS VISUALES
# ────────────────────────────────────────────────────────────────
 
identidad_basica:
  nombre_marca: "SAVIAS"
  nombre_completo: "Comunidad SAVIAS"
  como_escribirlo: "SAVIAS (mayúsculas, sin tilde, sin acentos)"
  fundadora: "Lina Toro"
  dominio: "linatorojaboneria.com"
  vertical: "Comunidad de jabonería y cosmética artesanal"
  posicionamiento_visual: "Artesanal premium femenino, cálido y editorial"
  mood_tres_palabras: ["artesanal", "cálido", "editorial"]
  audiencia_visual: |
    Mujer latina 25-60 que valora lo hecho a mano, lo elegante sin pretensión,
    y lo táctil. Sensibilidad de revista de cocina + libro de recetas familiar.
    Lee revistas como Kinfolk pero quiere calidez (no frío nórdico).
  posicionamiento_estrategico_referencia: |
    Arquetipos: Sabia + Cuidadora.
    Método propio: EVA (Entender, Verificar, Aplicar).
    Enemigo declarado: la cultura de la receta copiada sin criterio.
 
# ────────────────────────────────────────────────────────────────
 
paleta:
  primario:
    hex: "#9CAF88"
    nombre: "sage"
    uso: "color identitario de marca, fondo del logo, elementos sage en piezas claras"
  
  primario_profundo:
    hex: "#7B8F6A"
    nombre: "sage-deep"
    uso: "UI tags, branding text, énfasis sobre cream, hover states"
  
  primario_claro:
    hex: "#DCE2CB"
    nombre: "sage-light"
    uso: "highlights sutiles, backgrounds secundarios"
  
  secundario_acento:
    hex: "#B8943E"
    nombre: "gold"
    uso: "CTAs, highlights de palabras clave, número-badges, líneas divisorias, ornamentos"
  
  fondos:
    cream:
      hex: "#F5EFE6"
      uso: "background principal de slides claros (DEFAULT)"
    cream_deep:
      hex: "#EDE4D3"
      uso: "background secundario, secciones diferenciadas"
    paper:
      hex: "#FAF7F2"
      uso: "fondos de número-badges, stickers, cards sobre cream"
    dark_hero:
      hex: "#2A2823"
      uso: "fondo de hero inmersivos con foto, slides emocionales"
  
  texto:
    ink:
      hex: "#1F1F1B"
      uso: "texto principal sobre fondos claros (cream/paper)"
    ink_soft:
      hex: "#4A4A45"
      uso: "subtítulos, quote intros, texto secundario"
    ink_mute:
      hex: "#7A7A72"
      uso: "captions, footers, texto terciario"
  
  lineas_divisores:
    line:
      hex: "#D4CBB8"
      uso: "líneas decorativas estándar, separadores"
    line_soft:
      hex: "#E5DCC8"
      uso: "líneas sutiles, divisores secundarios"
  
  prohibidos:
    - color: "#000000"
      razon: "negro puro rompe el sistema cálido — usar ink #1F1F1B"
    - color: "#FFFFFF"
      razon: "blanco puro rompe la calidez del cream — usar paper o cream"
    - color: "rojos saturados, magentas, azules tech, neones"
      razon: "fuera del sistema natural artesanal"
    - color: "verdes flúor / tech green (#00FF00, #39FF14)"
      razon: "atacan la audiencia (lo dice explícitamente el doc de identidad)"
 
# ────────────────────────────────────────────────────────────────
 
tipografias:
  display:
    familia: "Cormorant Garamond"
    fallback: "Georgia, 'Times New Roman', serif"
    google_fonts_url: "https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap"
    pesos_disponibles: [300, 400, 500, 600, 700]
    italica_disponible: true
    uso: "headlines, hooks, hero copy, big quotes, números grandes"
    notas: |
      Alma tipográfica de SAVIAS. Sentencia editorial elegante.
      - Hero copy: weight 400, font-size 80-96px
      - Subhero/quote-intro: italic, weight 400-500, 28-32px
      - Italic con color gold (#B8943E) = palabra clave destacada
      - Line-height apretado: 1.02-1.05 para impacto editorial
  
  display_small_caps:
    familia: "Cormorant SC"
    fallback: "Georgia, serif"
    google_fonts_url: "incluido en URL de Cormorant Garamond arriba"
    pesos_disponibles: [400, 500, 600]
    uso: "UI tags, footer brand, sticker labels, etiquetas pequeñas EN MAYÚSCULAS"
    notas: |
      SOLO en mayúsculas con letter-spacing 0.22em-0.32em.
      Tamaños: 16-22px máximo.
      NUNCA usar para texto largo o párrafos.
      Color típico: sage-deep en piezas claras, cream en piezas oscuras.
  
  body:
    familia: "Lora"
    fallback: "Georgia, serif"
    google_fonts_url: "https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
    pesos_disponibles: [400, 500, 600, 700]
    italica_disponible: true
    uso: "párrafos, descripciones, captions, texto largo"
    notas: |
      Serif humanista, complementa Cormorant sin competir.
      Line-height 1.5-1.7 para legibilidad.
      Weight 400 para cuerpo, 500 para énfasis suave, 700 para énfasis fuerte.
  
  reglas_globales:
    - "Sistema 100% serif: Cormorant Garamond + Cormorant SC + Lora"
    - "Nunca mezclar más de las 3 familias declaradas"
    - "Cormorant SC SIEMPRE en mayúsculas con tracking abierto (0.22em+)"
    - "Italic en Cormorant Garamond = énfasis emocional o cita"
    - "Color gold (#B8943E) en italic = palabra clave destacada"
    - "CERO sans-serif geométricas (Helvetica, Inter, Roboto, Arial)"
    - "CERO script o handwritten — rompen la elegancia editorial"
 
# ────────────────────────────────────────────────────────────────
 
logo:
  descripcion: |
    Monograma 'SS' con líneas paralelas entrelazadas, integrando una hoja
    estilizada en la S derecha. Style: line outline grueso, elegante, orgánico.
  
  variantes_actuales:
    color_sobre_sage:
      descripcion: "Crema (#F5EFE6 aprox) sobre fondo sage (#9CAF88)"
      uso: "presentación principal, redes sociales, hero images"
      archivo: "LOGO_SAVIAS.png"
  
  variantes_pendientes:
    monocromatica_oscura:
      estado: "PENDIENTE_GENERAR"
      necesidad: "para piezas light donde cream sobre cream no funciona"
      especificacion: "ink (#1F1F1B) sobre transparente, mantener line outline grueso"
    monocromatica_clara:
      estado: "PENDIENTE_GENERAR"
      necesidad: "para hero oscuros y foto-backgrounds"
      especificacion: "cream (#F5EFE6) sobre transparente"
    svg_editable:
      estado: "PENDIENTE_GENERAR"
      necesidad: "para escalado infinito y exportación a tamaños grandes"
      especificacion: "vectorización del PNG actual respetando proporciones exactas"
  
  caracteristicas_visuales:
    estilo: "line outline"
    peso_stroke_relativo: "grueso, ~16-20px en presentación 1080x1080"
    naturaleza: "orgánica con sofisticación editorial"
    elemento_distintivo: "hoja integrada en la curva superior de la S derecha"
  
  reglas_de_uso:
    clear_space: "mínimo el ancho de la S del monograma alrededor del logo"
    tamaño_minimo: "64px de altura para preservar la legibilidad de la hoja"
    fondos_validos:
      - "sage (#9CAF88) — versión actual"
      - "cream (#F5EFE6) cuando exista versión monocromática oscura"
      - "dark hero (#2A2823) cuando exista versión monocromática clara"
    fondos_prohibidos:
      - "blanco puro #FFFFFF"
      - "fondos con texturas complejas que compitan"
      - "fondos con bajo contraste"
  
  prohibiciones:
    - "No rotar"
    - "No deformar proporciones"
    - "No aplicar gradientes ni efectos"
    - "No cambiar el color del trazo dentro del logo"
    - "No agregar sombra o glow"
    - "No usar sobre fondos con texturas complejas"
    - "No usar sobre fondos con bajo contraste"
 
# ────────────────────────────────────────────────────────────────
# NIVEL 2 — SISTEMA VISUAL
# ────────────────────────────────────────────────────────────────
 
iconografia:
  paradigma: "ornamental_tipografico"
  notas: |
    SAVIAS NO usa icon libraries tradicionales (Lucide, Phosphor solid, FontAwesome).
    Su sistema visual se construye con ornamentos tipográficos y elementos hechos
    a mano que refuerzan el carácter editorial-artesanal.
  
  ornamentos_principales:
    estrella_brand:
      caracter: "✦"
      uso: "footer brand separator (SAVIAS ✦ 01/10)"
      color: "#B8943E (gold)"
    
    ornamentos_separadores:
      caracteres: ["✦", "✧", "·", "◆"]
      uso: "separadores en headlines, marcadores en stack-top"
      color: "#B8943E (gold)"
      tamaño: "20-28px"
      letter_spacing: "0.4em cuando son separadores entre palabras"
    
    flechas_tipograficas:
      caracteres: ["↓", "➜", "→"]
      uso: "indicadores de continuación, llamadas a la acción visual"
      color: "#B8943E (gold)"
  
  iconos_funcionales_fallback:
    cuando_se_necesitan: |
      Solo si una pieza requiere un símbolo funcional específico
      (ej: ✓ check, ⚠ alerta, ⭐ rating).
    libreria: "Phosphor Icons - variant Thin o Light EXCLUSIVAMENTE"
    peso_stroke: "1.5px máximo"
    color: "gold (#B8943E) o sage-deep (#7B8F6A) — nunca negro ni ink"
    estilo: "outline, nunca filled"
  
  prohibido:
    - "Iconos filled de cualquier librería"
    - "Font Awesome solid"
    - "Material Icons"
    - "Iconos cartoon, infantiles, o tipo Notion"
    - "Emojis decorativos (🌿💚✨🌸) en lugar de ornamentos tipográficos"
    - "Iconos de flores/hojas/plantas como decoración (cliché eco-friendly)"
 
# ────────────────────────────────────────────────────────────────
 
tratamiento_fotografico:
  estetica_general: "Editorial artesanal con luz natural cálida, mood táctil, sin pretensión"
  
  luz:
    tipo: "natural difusa"
    direccion: "lateral suave, golden hour preferentemente"
    sombras: "suaves pero presentes (NO flat lighting)"
    evitar: "luz dura tipo estudio, flash directo, luz fluorescente fría"
  
  color_grading:
    temperatura: "cálida (5500K-6500K)"
    saturacion: "moderada-baja"
    tono_dominante: "cream/dorado en highlights, sage en mid-tones, marrón cálido en shadows"
    contraste: "medio-bajo, mood suave"
    referencia: "Kinfolk magazine pero con más calidez (menos frío nórdico)"
  
  encuadre_dominante:
    primario: "close-up de manos trabajando (manos cortando, mezclando, midiendo)"
    secundario: "medium shot de mesa de trabajo"
    terciario: "wide shots del taller con vida (cocina convertida en laboratorio)"
    cero: "retratos formales tipo LinkedIn"
  
  sujetos_tipicos:
    manos:
      - "manos cortando jabón con cuchillo"
      - "manos mezclando lejía y aceites"
      - "manos entregando jabón terminado"
      - "manos midiendo ingredientes con balanza"
    espacios:
      - "mesa de cocina convertida en laboratorio"
      - "tablero de madera con jabones recién cortados"
      - "estantería con jabones curándose"
    ingredientes_visibles:
      - "flores secas (caléndula, lavanda)"
      - "avena, cúrcuma, cacao"
      - "miel en frasco de vidrio"
      - "aceites en botellas ámbar"
      - "moldes de silicona y madera"
    producto_terminado:
      - "jabones en barra con patrones marmoleados"
      - "jabones curándose en rejillas de madera"
      - "etiquetas artesanales con tipografía manual"
  
  mood_fotografico: ["táctil", "cálido", "honesto"]
  
  post_procesado:
    grano: "leve, orgánico"
    vignette: "no usar"
    filtros: "ninguno consistente — mantener look natural"
    sombras: "elevar levemente (lift shadows)"
    highlights: "controlados, sin clipping"
  
  evitar_explicitamente:
    - "Stock photos de mujer en spa con toalla blanca"
    - "Mujer riéndose sosteniendo jabón (cliché publicidad)"
    - "Fotos con marca de agua o copyright visible"
    - "Composiciones flat-lay simétricas perfectas"
    - "Fondos blancos planos puros sin textura"
    - "Look 'clínico/laboratorio' frío"
    - "Pasarela formal con traje"
    - "Fotos con flash directo o luz dura"
    - "Edición saturada estilo Instagram 2018"
  
  prompt_template_para_ia_generativa:
    base: |
      close-up cinematic shot, natural diffused light, warm color grading,
      artisanal kitchen-laboratory aesthetic, hands working with handmade soap
      and natural ingredients (oats, calendula, honey, cocoa), textured wooden
      surface, organic imperfection, sage green and cream tones, editorial mood
      like Kinfolk magazine but warmer, shallow depth of field, no people's faces
      fully visible, focus on hands and materials
    evitar_en_prompts:
      - "professional studio lighting"
      - "clean white background"
      - "polished commercial look"
      - "Instagram beauty filter"
      - "neon"
      - "dramatic shadows"
    aspect_ratios:
      reels_stories_tiktok: "9:16"
      feed_carrusel: "4:5 (1080x1350)"
      youtube_horizontal: "16:9"
    duracion_por_clip_recomendada: "3-5 segundos"
 
# ────────────────────────────────────────────────────────────────
 
ilustracion:
  usa_ilustracion: false
  razon: |
    SAVIAS no usa ilustración tradicional. Su sistema visual depende de:
    1. Fotografía documental del taller de Lina
    2. Composiciones tipográficas (Cormorant + Lora)
    3. Elementos decorativos hechos a "mano" (highlights skewados, strike-through 
       ondulado, stickers rotados)
  
  estilo_si_se_necesita: "editorial_botanico_line_art"
  notas_para_caso_futuro: |
    Si en el futuro se necesita ilustración (ej: infografía de saponificación):
    - Line art delicado (1.5px stroke máximo)
    - Color: gold sobre cream, o ink sobre cream
    - Estilo: editorial-botánico (como ilustraciones de libros antiguos de plantas)
    - CERO estilo flat-design tech startup
    - CERO ilustraciones cartoon o tipo Notion
  paleta_ilustracion_recomendada: ["#B8943E", "#1F1F1B", "#7B8F6A"]
 
# ────────────────────────────────────────────────────────────────
 
elementos_graficos_caracteristicos:
  
  sistema_highlights_skewados:
    descripcion: "Highlight/marcador detrás de palabras clave, simulando subrayador hecho a mano"
    css_pattern: |
      position: absolute;
      left: -6px; right: -6px; bottom: 6px;
      height: 38%;
      transform: skew(-3deg);
    colores_disponibles:
      gold: "rgba(184,148,62,0.35)"
      sage: "rgba(156,175,136,0.45)"
    uso: "destacar 1-3 palabras dentro de un headline o quote"
  
  strike_through_handmade:
    descripcion: "Tachado hecho con SVG ondulado (no línea recta digital)"
    svg_path: "M2 4 Q 50 1, 100 5 T 198 4"
    stroke: "#B8943E"
    stroke_width: 2.5
    uso: "tachar conceptos que se rechazan, mostrar 'antes vs después'"
  
  numero_badge_circular:
    descripcion: "Círculo con borde gold y número en Cormorant Garamond italic"
    css: |
      width: 62px; height: 62px;
      border: 1.5px solid #B8943E;
      border-radius: 50%;
      font-family: Cormorant Garamond italic;
      font-size: 38px;
      color: #B8943E;
      background: #FAF7F2;
    uso: "numerar pasos, parámetros, items en listas estructuradas"
  
  sticker_rotado:
    descripcion: "Etiqueta tipo sello artesanal, rotado -3deg, con sombra cuadrada hacia abajo-derecha"
    css: |
      background: #FAF7F2;
      border: 2px solid #B8943E;
      padding: 8px 24px;
      transform: rotate(-3deg);
      box-shadow: 2px 2px 0 #1F1F1B;
      font-family: Cormorant SC;
      letter-spacing: 0.22em;
    uso: "etiquetas tipo 'NUEVO', 'EXCLUSIVO VIP', badges de sección"
  
  ui_tag_con_linea_gold:
    descripcion: "Tag pequeño en small caps con línea gold horizontal a la izquierda"
    css: |
      ::before {
        content: '';
        width: 32px;
        height: 1.5px;
        background: #B8943E;
      }
      font-family: Cormorant SC;
      letter-spacing: 0.28em;
    posicion: "esquina superior izquierda (top: 90px, left: 90px)"
    uso: "indicar sección, categoría, en esquina superior izquierda de cada slide"
  
  footer_brand_con_estrella:
    descripcion: "Footer con nombre marca en small caps + estrella gold + número slide en italic"
    pattern: "SAVIAS  ✦  01/10"
    estrella_color: "#B8943E"
    uso: "consistencia entre slides de carrusel"
  
  ornament_lineas_decorativas:
    pattern: "· ✦ ·"
    color: "#B8943E"
    letter_spacing: "0.4em"
    uso: "separadores en hero copy, encima de headlines"
  
  border_left_quote:
    descripcion: "Línea vertical gold de 3px a la izquierda de citas"
    css: "border-left: 3px solid #B8943E; padding-left: 32px;"
    uso: "blockquotes, citas de Lina, frases destacadas"
  
  formato_canonico_carrusel:
    dimensiones: "1080 x 1350"
    aspect_ratio: "4:5"
    padding_estandar: "80-90px laterales y verticales"
    grid_interno: "12 columnas implícitas"
 
# ────────────────────────────────────────────────────────────────
# NIVEL 3 — APLICACIÓN Y REGLAS
# ────────────────────────────────────────────────────────────────
 
principios_composicion:
  jerarquia_visual:
    orden_lectura:
      1: "UI tag (esquina superior izq con línea gold)"
      2: "Hero copy / Headline (Cormorant Garamond grande)"
      3: "Subhero / Quote intro (italic, color suave)"
      4: "Cuerpo / contenido principal"
      5: "Ornamento divisor (✦ ·)"
      6: "Footer brand con estrella + número slide"
    pesos_visuales:
      headline: "weight 400, 78-96px"
      quote: "italic weight 500, 52px"
      body: "weight 400 Lora"
      captions: "italic Cormorant 20px"
  
  espaciado:
    base: "8px grid"
    padding_slide: "80-90px (carrusel 1080x1350)"
    margin_top_stack: "160px desde top antes de hero copy"
    margin_quote: "46px arriba, 24px abajo del quote-intro"
    line_height_display: "1.02-1.05"
    line_height_body: "1.5-1.7"
    letter_spacing_smallcaps: "0.22em - 0.32em"
    letter_spacing_italic: "0.05em"
  
  alineacion_dominante:
    educativo: "izquierda"
    revelacion: "centrada"
    cita: "izquierda con border-left gold"
    hero_inmersivo: "izquierda en bottom (sobre foto)"
  
  densidad:
    nivel: "equilibrada"
    proporcion_texto_aire: "40% texto / 60% aire en slides de copy puro"
  
  asimetria_controlada:
    descripcion: |
      SAVIAS evita simetría perfecta (rompe lo artesanal) pero también
      asimetría caótica. Regla: bloque centrado pero UI elements crean
      tensión visual sutil (tag arriba-izq, número arriba-der, footer abajo).
 
# ────────────────────────────────────────────────────────────────
 
sistema_fondos:
  
  jerarquia_de_uso:
    cream_base:
      hex: "#F5EFE6"
      es_default: true
      cuando_usar:
        - "Slides educativas (método, pasos, definiciones)"
        - "Slides con quote/cita"
        - "Slides de revelación tipográfica"
        - "Default cuando no hay razón para otro fondo"
    
    cream_deep:
      hex: "#EDE4D3"
      cuando_usar:
        - "Slides secundarias en carruseles largos"
        - "Secciones diferenciadas dentro de landing"
        - "Backgrounds de cards sobre cream base"
    
    sage_primario:
      hex: "#9CAF88"
      cuando_usar:
        - "Slides de CTA o cierre"
        - "Backgrounds del logo"
        - "Sections de 'lo que solo SAVIAS te da'"
      precaucion: "NUNCA usar texto blanco puro sobre sage — usar cream con shadow o cambiar fondo"
    
    dark_hero:
      hex: "#2A2823"
      cuando_usar:
        - "Slide 1 inmersivo con foto full-bleed"
        - "Slides emocionales con storytelling profundo"
        - "Cierre de carrusel con foto + texto encima"
      requiere_gradient: true
    
    paper_overlay:
      hex: "#FAF7F2"
      cuando_usar:
        - "Backgrounds de número-badges"
        - "Backgrounds de stickers"
        - "Cards decorativas sobre cream base"
      restriccion: "NUNCA como background principal de slide"
  
  sistema_gradients:
    hero_oscuro:
      top_gradient_css: |
        linear-gradient(to top,
          rgba(31,31,27,0) 0%,
          rgba(31,31,27,0.45) 100%);
        height: 20%;
      bottom_gradient_css: |
        linear-gradient(to bottom,
          rgba(31,31,27,0) 0%,
          rgba(31,31,27,0.25) 35%,
          rgba(31,31,27,0.75) 70%,
          rgba(31,31,27,0.92) 100%);
        height: 55%;
      proposito: "garantizar legibilidad del texto cream sobre foto"
  
  proporcion_recomendada_carrusel:
    cream_total: "70%"
    sage_total: "20%"
    dark_hero_total: "10%"
 
# ────────────────────────────────────────────────────────────────
 
anti_patrones:
  
  tipograficos:
    - "NUNCA usar sans-serif (Helvetica, Inter, Arial, Roboto) — rompe el sistema editorial"
    - "NUNCA mezclar más de las 3 familias declaradas (Cormorant Garamond + Cormorant SC + Lora)"
    - "NUNCA usar tipografía script o handwritten (parece Pinterest 2015)"
    - "NUNCA usar Cormorant SC para texto largo — es SOLO para tags y labels en MAYÚSCULAS"
  
  cromaticos:
    - "NUNCA negro puro #000000 — usar siempre ink #1F1F1B"
    - "NUNCA blanco puro #FFFFFF — usar paper #FAF7F2 o cream #F5EFE6"
    - "NUNCA rojos saturados, magentas, azules tech o neones — fuera del sistema"
    - "NUNCA usar gold (#B8943E) en bloques grandes — solo highlights, ornamentos y CTAs"
  
  estructurales:
    - "NUNCA composición simétrica perfecta — artesanal = imperfección controlada"
    - "NUNCA llenar el frame al 100% — el aire negativo es parte del lenguaje"
    - "NUNCA usar drop shadows >4px — solo el box-shadow 2px 2px 0 del sticker rotado"
    - "NUNCA usar gradients de más de 2 stops (excepto el hero overlay específico de 4 stops)"
  
  iconograficos:
    - "NUNCA usar emojis decorativos (🌿💚✨🌸) — usar ornamentos tipográficos (✦ ✧ ·)"
    - "NUNCA usar icon libraries genéricas filled (Font Awesome solid, Material Icons)"
    - "NUNCA íconos cartoon, infantiles, o tipo Notion"
    - "NUNCA íconos de flores/hojas/plantas como decoración (cliché eco-friendly)"
  
  fotograficos:
    - "NUNCA stock photos genéricas de 'mujer en spa con toalla blanca'"
    - "NUNCA mujer riéndose sosteniendo un jabón (cliché publicidad)"
    - "NUNCA fotos con flash directo o luz dura tipo estudio"
    - "NUNCA look 'clínico/laboratorio frío' — asusta a la audiencia"
    - "NUNCA composiciones flat-lay simétricas perfectas"
    - "NUNCA edición saturada estilo Instagram 2018"
  
  de_marca:
    - "NUNCA usar el logo sobre fondos con bajo contraste"
    - "NUNCA rotar, deformar o aplicar efectos al logo"
    - "NUNCA centrar texto si es educativo (centrado se reserva para revelación)"
  
  de_composicion:
    - "NUNCA poner texto sobre foto sin gradient overlay"
    - "NUNCA mezclar más de 2 elementos gráficos característicos en una misma pieza (saturación)"
    - "NUNCA usar más de 3 colores de la paleta en un solo slide (excluyendo neutros)"
 
