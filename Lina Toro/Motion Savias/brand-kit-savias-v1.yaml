# Este archivo es la fuente única de verdad para la identidad visual
# de SAVIAS. Las skills downstream (brand-graphics-clee, motion-snippets-clee,
# b-roll-prompter-clee, carrusel-studio, funnel-builder, thumbnail-prompter)
# leen este archivo para producir assets consistentes con la marca.
#
# IMPORTANTE: La identidad estratégica está documentada por separado en
# savias_identidad_marca_v2.pdf (Project Knowledge). Este brand kit es la
# capa VISUAL que deriva de esa identidad estratégica.
