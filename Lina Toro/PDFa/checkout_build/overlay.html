<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Hanken+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --sage:#9CAF88;--sage-deep:#7B8F6A;--gold:#B8943E;--gold-soft:#cda651;
    --cream:#F5EFE6;--ink:#2A2823;--ink-soft:#4A4A45;
    --sans:'Hanken Grotesk',system-ui,sans-serif;--serif:'Cormorant Garamond',Georgia,serif;
  }
  html,body{width:600px;height:600px}
  .card{position:relative;width:600px;height:600px;overflow:hidden;background:var(--cream)}
  .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  /* scrim superior para legibilidad del título sobre la zona crema */
  .scrim{position:absolute;left:0;right:0;top:0;height:62%;
    background:linear-gradient(180deg,rgba(245,239,230,.96) 0%,rgba(245,239,230,.86) 30%,rgba(245,239,230,.45) 62%,rgba(245,239,230,0) 100%)}
  /* viñeta inferior sutil para asentar la composición */
  .vig{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 38%,transparent 55%,rgba(42,40,35,.10) 100%)}
  .top{position:absolute;left:0;right:0;top:30px;display:flex;flex-direction:column;align-items:center;text-align:center}
  .logo{width:58px;height:58px;border-radius:15px;object-fit:cover;box-shadow:0 8px 20px -8px rgba(42,40,35,.5)}
  .eyebrow{margin-top:12px;font-family:var(--sans);font-size:12px;font-weight:800;letter-spacing:.34em;
    text-transform:uppercase;color:var(--gold)}
  .title{font-family:var(--serif);color:var(--ink);line-height:.9;margin-top:8px}
  .title .l1{display:block;font-weight:600;font-size:50px;letter-spacing:.01em}
  .title .l2{display:block;font-style:italic;font-weight:600;font-size:62px;color:var(--sage-deep);margin-top:2px}
  .rule{width:64px;height:2px;background:var(--gold);margin:16px auto 0;border-radius:2px}
  .tagline{margin-top:12px;font-family:var(--sans);font-size:14px;font-weight:600;color:var(--ink-soft);letter-spacing:.01em}
  /* sello inferior */
  .seal{position:absolute;left:50%;transform:translateX(-50%);bottom:26px;
    display:flex;align-items:center;gap:10px;background:rgba(42,40,35,.86);color:#fff;
    padding:11px 22px;border-radius:999px;backdrop-filter:blur(2px)}
  .seal b{font-family:var(--sans);font-size:13px;font-weight:800;letter-spacing:.04em}
  .seal span{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--gold-soft)}
  .seal .dot{width:5px;height:5px;border-radius:50%;background:var(--sage)}
</style></head><body>
  <div class="card">
    <img class="bg" src="base_scene.png">
    <div class="vig"></div>
    <div class="scrim"></div>
    <div class="top">
      <img class="logo" src="../assets/savias-logo.png">
      <div class="eyebrow">Savias · Jabonería artesanal</div>
      <div class="title"><span class="l1">La Ruta</span><span class="l2">Jabonera</span></div>
      <div class="rule"></div>
      <div class="tagline">Crea tu primer jabón vendible desde casa</div>
    </div>
    <div class="seal"><b>JABÓN DE GLICERINA</b><span class="dot"></span><span>paso a paso</span></div>
  </div>
</body></html>
