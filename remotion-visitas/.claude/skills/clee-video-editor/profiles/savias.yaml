# =============================================================================
# savias.yaml — brand-edit-profile de SAVIAS (jabonería artesanal premium)
# =============================================================================
# MARCA: SAVIAS (Lina Toro). Jabonería premium, artesanal, sensorial.
# TONO DE EDICIÓN: pausado, cálido, "slow luxury". Serif, paleta sage / crema /
#   dorado. El video debe respirar: menos es más. Retención por INMERSIÓN, no
#   por bombardeo de cortes.
#
# Craft universal en references/craft-rules.md (las 18 reglas aplican igual).
# Aquí solo se PARAMETRIZAN los diales. Colores EXACTOS -> brand kit.
# Los colores de abajo son SEMILLA; el brand kit visual de SAVIAS manda
# (ver references/color.md y references/captions.md).
# =============================================================================

cliente: "SAVIAS"

# Ruta al YAML visual generado por brand-kit-builder-clee (fuente de verdad de
# paleta sage/crema/dorado y tipografías serif).
extends_brand_kit: "../../../brand-kits/savias/brand-kit.yaml"  # TODO confirmar ruta real

# --- Ritmo: lento y respirado ------------------------------------------------
ritmo:
  cut_rate_seg: [5, 8]      # Planos largos: el producto y el ritual respiran.
  interrupt_cadence_seg: 5  # Interruptor suave cada ~5s (push-in mínimo, textura).
  zoom_max_pct: 105         # Push-in casi imperceptible; nada agresivo.

# --- Captions: frase, legible y elegante -------------------------------------
captions:
  mode: phrase              # Frases cortas, no karaoke duro (más premium/legible).
  switch_ms: 1500           # ~1.5s por frase: lectura calmada, acorde al ritmo.
  text_color: "#FFFFFF"    # Blanco base (semilla).
  highlight_color: "#C9A24B" # Dorado SAVIAS (aprox). El brand kit da el HEX exacto.
  outline_px: 3             # Contorno medio para legibilidad sobre fondos cálidos.
  ruta: remotion            # Remotion (o hyperframes) para captions premium
                            # data-driven; NO ffsub. Ver references/engine-decision.md
                            # y references/captions.md. Alternativa: hyperframes.

# --- Audio: sobrio y cálido --------------------------------------------------
audio:
  sfx_density: low          # SFX mínimos y orgánicos (agua, textura), nunca punchy.
  music_bpm: [60, 90]       # Tempo lento; sostiene la sensación de calma.
  music_energy: ambient     # Lecho ambiental cálido. Ver references/audio.md (ducking/LUFS).

# --- B-roll: cine lento ------------------------------------------------------
broll:
  style: cinematic-slow     # Planos largos, cámara lenta, macro sensorial del jabón.

# --- Transcripción -----------------------------------------------------------
transcripcion:
  whisper_model: medium     # Balance fidelidad/velocidad; buen es-LATAM.
  vad: true                 # Recorta silencios/relleno: timestamps limpios para
                            # el ritmo pausado. Ver references/pipeline.md.

# --- Formato -----------------------------------------------------------------
formato_default: 916        # Vertical 9:16 (Reels/TikTok). Respeta references/safe-zones.md.

# --- Tipos de edición preferidos ---------------------------------------------
tipos_edicion_preferidos:
  - inmersiva               # Sensorial, respirada, texturas y ambiente.
  - cinemática              # Look de cine, color grading cálido (ver references/color.md).

notas: |
  SAVIAS = premium/pausado. Estética serif; paleta sage / crema / dorado.
  Regla de oro: si dudas, corta MENOS y deja respirar más. El highlight dorado
  (#C9A24B aprox) y todos los colores exactos vienen del brand kit visual del
  cliente (brand-kit-builder-clee); esto es solo semilla.
  Evitar: zoom brusco, SFX secos, word-by-word, música alta. Nada "hype".
  QA final contra references/qa.md (contraste de captions, safe zones, LUFS).
