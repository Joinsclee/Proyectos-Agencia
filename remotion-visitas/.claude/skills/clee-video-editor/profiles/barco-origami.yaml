# =============================================================================
# barco-origami.yaml — brand-edit-profile de Barco de Papel / Origami (Paulina)
# =============================================================================
# MARCA: Barco de Papel / Origami (Paulina). Punto INTERMEDIO: dinámico,
#   cálido y legible, sin llegar al hipercinético.
#
# Craft universal en references/craft-rules.md (las 18 reglas aplican igual).
# Aquí solo se PARAMETRIZAN los diales. Colores EXACTOS -> brand kit.
# =============================================================================

cliente: "Barco de Papel / Origami"

# TODO calibrar contra 3-5 piezas aprobadas y tomar color del brand kit del cliente.
extends_brand_kit: "../../../brand-kits/barco-origami/brand-kit.yaml"

# --- Ritmo: intermedio -------------------------------------------------------
ritmo:
  cut_rate_seg: [3, 5]      # Dinámico pero amable.
  interrupt_cadence_seg: 4  # Interruptor cada ~4s.
  zoom_max_pct: 110         # Push-in moderado (rango intermedio 110-115).

# --- Captions: word, ritmo medio ---------------------------------------------
captions:
  mode: word                # Palabra por palabra con switch calmado.
  switch_ms: 600            # ~600ms por palabra.
  text_color: "#FFFFFF"    # Blanco base.
  highlight_color: "#FFFFFF" # TODO calibrar contra 3-5 piezas aprobadas y tomar color del brand kit del cliente.
  outline_px: 3             # Contorno medio.
  ruta: ffsub               # .ass quemado con $FFSUB por defecto; considerar
                            # remotion si se requiere motion. Ver
                            # references/engine-decision.md y references/captions.md.

# --- Audio: medio ------------------------------------------------------------
audio:
  sfx_density: med          # SFX en momentos clave.
  music_bpm: [100, 120]     # Tempo medio.
  music_energy: mid         # Energía media. Ver references/audio.md.

# --- B-roll ------------------------------------------------------------------
broll:
  style: flash-fast         # Inserts ágiles sincronizados.

# --- Transcripción -----------------------------------------------------------
transcripcion:
  whisper_model: medium     # Balance fidelidad/velocidad.
  vad: false                # Flujo continuo. Ver references/pipeline.md.

# --- Formato -----------------------------------------------------------------
formato_default: 916        # Vertical 9:16. Respeta references/safe-zones.md.

# --- Tipos de edición preferidos ---------------------------------------------
tipos_edicion_preferidos:
  - persuasiva
  - veloz

notas: |
  Barco de Papel / Origami = intermedio cálido y legible. Diales base desde la
  plantilla intermedia; CALIBRAR tras 3-5 piezas aprobadas.
  highlight_color y extends_brand_kit marcados TODO: tomar el color exacto del
  brand kit visual del cliente antes de producir en serie.
  QA final contra references/qa.md.
