# =============================================================================
# humanox.yaml — brand-edit-profile de HUMANOX
# =============================================================================
# MARCA: HUMANOX. Punto INTERMEDIO entre el premium pausado (SAVIAS) y el
#   hipercinético (Ovejas Voladoras): dinámico pero legible, con energía media.
#
# Craft universal en references/craft-rules.md (las 18 reglas aplican igual).
# Aquí solo se PARAMETRIZAN los diales. Colores EXACTOS -> brand kit.
# =============================================================================

cliente: "HUMANOX"

# TODO calibrar contra 3-5 piezas aprobadas y tomar color del brand kit del cliente.
extends_brand_kit: "../../../brand-kits/humanox/brand-kit.yaml"

# --- Ritmo: intermedio -------------------------------------------------------
ritmo:
  cut_rate_seg: [3, 5]      # Dinámico pero sin fatigar.
  interrupt_cadence_seg: 4  # Interruptor cada ~4s.
  zoom_max_pct: 112         # Push-in moderado (rango intermedio 110-115).

# --- Captions: word, ritmo medio ---------------------------------------------
captions:
  mode: word                # Palabra por palabra, pero con switch más calmado.
  switch_ms: 600            # ~600ms por palabra: legible sin perder dinamismo.
  text_color: "#FFFFFF"    # Blanco base.
  highlight_color: "#FFFFFF" # TODO calibrar contra 3-5 piezas aprobadas y tomar color del brand kit del cliente.
  outline_px: 3             # Contorno medio.
  ruta: ffsub               # .ass quemado con $FFSUB por defecto. Si se necesita
                            # motion premium, evaluar remotion en
                            # references/engine-decision.md. Ver references/captions.md.

# --- Audio: medio ------------------------------------------------------------
audio:
  sfx_density: med          # SFX en momentos clave, no en cada corte.
  music_bpm: [100, 120]     # Tempo medio.
  music_energy: mid         # Lecho de energía media. Ver references/audio.md.

# --- B-roll ------------------------------------------------------------------
broll:
  style: flash-fast         # Inserts ágiles sincronizados, sin ser frenéticos.

# --- Transcripción -----------------------------------------------------------
transcripcion:
  whisper_model: medium     # Balance fidelidad/velocidad.
  vad: false                # Flujo continuo. Ver references/pipeline.md.

# --- Formato -----------------------------------------------------------------
formato_default: 916        # Vertical 9:16. Respeta references/safe-zones.md.

# --- Tipos de edición preferidos ---------------------------------------------
tipos_edicion_preferidos:
  - persuasiva
  - veloz

notas: |
  HUMANOX = intermedio dinámico y legible. Diales base a partir de la plantilla
  intermedia; AJUSTAR tras revisar 3-5 piezas aprobadas del cliente.
  highlight_color y extends_brand_kit marcados TODO: tomar el color exacto del
  brand kit visual (brand-kit-builder-clee) antes de producir en serie.
  QA final contra references/qa.md.
