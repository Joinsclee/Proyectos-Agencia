/* Carruseles de La Huerta LAB. Sale de las landings y anuncios de venta aprobados (sep-2026) y de
   perfil-carrusel.md. Lienzo 1080x1350 (4:5); .f916 adapta a historias 1080x1920.
   Lima y coral NUNCA como texto pequeño sobre crema (2,7:1): sobre crema el acento es el oliva. */
:root{--deep:#061f1d;--deep2:#04100f;--green:#0f4640;--lime:#d4e84b;--leaf:#87a942;--olive:#5a6a1c;--coral:#ef7854;
  --crema:#f7f6ef;--crema2:#efeee4;--linea:#dde3d4;--tinta:#14322f;--tinta2:#44514b;
  --t:'Inter',-apple-system,'Segoe UI',Arial,sans-serif;--s:'Playfair Display',Georgia,serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent}
.slide{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:var(--t);color:#fff;background:var(--deep)}
.f916 .slide{height:1920px}
.slide.claro{background:var(--crema);color:var(--tinta)}
em{font-family:var(--s);font-style:italic;font-weight:500;color:var(--lime);letter-spacing:-.01em}
.claro em{color:var(--olive)}
strong{font-weight:800}

/* piezas comunes */
.marca{position:absolute;left:84px;top:64px;display:flex;align-items:center;gap:14px;z-index:5}
.marca img{width:64px;height:64px}
.marca span{font-weight:700;font-size:22px;letter-spacing:.2em;text-transform:uppercase;color:var(--lime)}
.claro .marca span{color:var(--olive)}
.pie{position:absolute;left:84px;right:84px;bottom:52px;display:flex;justify-content:space-between;font-weight:600;font-size:24px;letter-spacing:.06em;color:rgba(248,245,237,.7);z-index:5}
.claro .pie{color:var(--tinta2)}
.eyebrow{font-weight:700;font-size:28px;letter-spacing:.16em;text-transform:uppercase;color:var(--lime);margin-bottom:26px}
.claro .eyebrow{color:var(--olive)}
.chip{display:inline-block;padding:12px 26px;border-radius:999px;background:var(--lime);color:var(--deep);font-weight:800;font-size:26px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:26px}
.titulo{font-weight:800;letter-spacing:-.03em;line-height:1.02}
.cuerpo{font-size:42px;line-height:1.32;font-weight:400;color:rgba(248,245,237,.92)}
.claro .cuerpo{color:var(--tinta2)}
.bloque{position:absolute;left:84px;right:84px;z-index:4}
.foto{position:absolute;left:0;right:0;top:0;overflow:hidden}
.foto img{width:100%;height:100%;object-fit:cover}

/* portada: foto a sangre con velo profundo bajo el texto */
.portada .foto{bottom:0}
.portada .foto::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,31,29,.35) 0%,rgba(6,31,29,0) 26%,rgba(6,31,29,.15) 42%,rgba(6,31,29,.88) 66%,rgba(6,31,29,.97) 100%)}
.portada .bloque{bottom:230px}
.portada .titulo{font-size:108px}
.portada .bajada{margin-top:28px;font-size:42px;font-weight:600;line-height:1.25;color:rgba(248,245,237,.95)}

/* segunda portada: tipográfica sobre crema */
.portada2 .bloque{top:300px}
.portada2 .titulo{font-size:118px;color:var(--tinta)}
.portada2 .bajada{margin-top:40px;font-size:44px;line-height:1.3;color:var(--tinta2);max-width:860px}
.portada2 .regla{width:140px;height:8px;background:var(--olive);margin-bottom:46px;border-radius:4px}

/* texto (con foto opcional arriba) */
.texto .foto{height:560px}
.texto .foto::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,31,29,0) 50%,rgba(6,31,29,1) 100%)}
.texto .bloque{top:300px}
.texto.confoto .bloque{top:600px}
.texto .titulo{font-size:84px;margin-bottom:34px}

/* pilar: foto arriba, número grande montado en el borde */
.pilar .foto{height:690px}
.pilar .foto::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,31,29,.25) 0%,rgba(6,31,29,0) 30%,rgba(6,31,29,0) 60%,rgba(6,31,29,1) 100%)}
.pilar .num{position:absolute;left:72px;top:520px;font-weight:800;font-size:220px;line-height:1;letter-spacing:-.05em;color:var(--lime);z-index:4}
.pilar .bloque{top:790px}
.pilar .titulo{font-size:78px;margin-bottom:26px}
.pilar .cuerpo{font-size:40px}

/* cifra: un número que ES el punto, con su fuente */
.cifra .bloque{top:280px}
.cifra .valor{font-weight:800;font-size:250px;line-height:.95;letter-spacing:-.05em;color:var(--tinta)}
.cifra .valor em{font-size:.9em}
.cifra .subraya{width:220px;height:12px;background:var(--leaf);border-radius:6px;margin:34px 0 40px}
.cifra .etiqueta{font-size:56px;font-weight:800;line-height:1.12;letter-spacing:-.02em;color:var(--tinta)}
.cifra .fuente{margin-top:36px;font-size:26px;line-height:1.4;color:var(--tinta2)}

/* lista numerada */
.lista .bloque{top:270px}
.lista .titulo{font-size:80px;margin-bottom:56px}
.lista ol{list-style:none;display:grid;gap:34px}
.lista li{display:flex;gap:30px;align-items:baseline}
.lista li i{flex:0 0 auto;font-style:normal;font-weight:800;font-size:34px;color:var(--deep);background:var(--lime);border-radius:999px;width:66px;height:66px;display:grid;place-content:center}
.lista li span{font-size:46px;line-height:1.22;font-weight:600}

/* cita */
.cita .bloque{top:320px}
.cita .comillas{font-family:var(--s);font-style:italic;font-size:220px;line-height:.6;color:var(--lime);height:110px}
.cita .frase{font-family:var(--s);font-style:italic;font-weight:500;font-size:74px;line-height:1.14;color:#fff;letter-spacing:-.01em}
.cita .autor{margin-top:52px;font-weight:700;font-size:28px;letter-spacing:.14em;text-transform:uppercase;color:var(--lime)}

/* guardable: checklist sobre crema */
.guardable .bloque{top:250px}
.guardable .chip{background:var(--deep);color:var(--crema)}
.guardable .titulo{font-size:76px;color:var(--tinta);margin-bottom:50px}
.guardable ul{list-style:none;display:grid;gap:26px}
.guardable li{display:flex;gap:26px;align-items:flex-start;font-size:42px;line-height:1.25;font-weight:600;color:var(--tinta);padding-bottom:26px;border-bottom:2px solid var(--linea)}
.guardable li::before{content:'';flex:0 0 auto;width:44px;height:44px;margin-top:4px;border-radius:10px;border:4px solid var(--olive)}

/* cierre: una sola acción. El coral solo vive aquí. */
.cierre .bloque{top:330px}
.cierre .titulo{font-size:96px;margin-bottom:44px}
.cierre .accion{display:inline-block;padding:30px 50px;border-radius:22px;background:var(--coral);color:#fff;font-weight:800;font-size:46px;letter-spacing:.02em;box-shadow:0 24px 60px rgba(239,120,84,.35)}
.cierre .bajada{margin-top:40px;font-size:40px;line-height:1.3;color:rgba(248,245,237,.9)}

/* infografía (una sola imagen): pasos con hilo */
.infografia .bloque{top:250px}
.infografia .titulo{font-size:80px;margin-bottom:60px}
.infografia ol{list-style:none;position:relative;display:grid;gap:40px}
.infografia ol::before{content:'';position:absolute;left:38px;top:20px;bottom:20px;width:6px;border-radius:3px;background:linear-gradient(180deg,var(--lime),rgba(212,232,75,.25))}
.infografia li{position:relative;display:flex;gap:34px;align-items:center}
.infografia li i{flex:0 0 auto;font-style:normal;width:82px;height:82px;border-radius:50%;background:var(--lime);color:var(--deep);font-weight:800;font-size:38px;display:grid;place-content:center;z-index:1}
.infografia li span{font-size:44px;line-height:1.2;font-weight:700}
.infografia li small{display:block;margin-top:6px;font-size:30px;font-weight:400;color:rgba(248,245,237,.8)}
.f916 .infografia .bloque{top:330px}
</style></head>
