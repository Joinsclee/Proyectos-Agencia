     AJUSTES DE MAQUETA · lahuertalab.com/venta-page
     Pegar en un bloque «HTML/Javascript personalizado» al FINAL de la
     página, después de la sección de modalidades.

     Solo toca la disposición. No cambia textos ni precios: eso va en el
     editor de GoHighLevel, sobre los bloques que ya existen.
     ══════════════════════════════════════════════════════════════════ -->
<style>
  /* ── Las dos modalidades, una encima de la otra ──────────────────────
     Hoy .lhs-offergrid es un grid de dos columnas de 568 px. Al pasarlo
     a una sola columna las tarjetas se irían a 1160 px de ancho, que es
     demasiado para leer: por eso se limita y se centra.

     El presencial queda arriba porque ya va primero en el HTML, y es el
     que tiene cupos contados. */
  #fp-venta-ajustes ~ *, /* no-op: ancla para que el bloque tenga alcance */
  .lhs-offergrid{
    grid-template-columns: 1fr !important;
    max-width: 640px;
    margin-inline: auto;
    gap: 20px !important;
  }

  /* Apiladas, la tarjeta destacada necesita menos altura: el contenido
     manda y no hay una hermana al lado con la que igualarse. */
  .lhs-offergrid > .lhs-card{ height: auto; }

  /* En móvil ya estaba en una columna; esto solo evita que el ancho
     máximo apriete el contenido contra los bordes. */
  @media (max-width: 700px){
    .lhs-offergrid{ max-width: none; }
  }
</style>
<div id="fp-venta-ajustes" hidden></div>
