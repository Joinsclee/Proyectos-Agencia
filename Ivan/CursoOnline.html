<meta charset="utf-8">
<title>Fincas Productivas · Programa Online | La Huerta LAB</title>
<meta name="description" content="Aprende a diseñar una finca productiva desde donde estés. 8 semanas con sesiones en vivo con Iván, un año de acceso al contenido y un año de comunidad en La Huerta LAB.">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:ital,wght@1,600&display=swap');

body:has(.lh3){margin:0}
.lh3 .price .eye{color:#d4e84b}
:is(.c-section,.c-row,.c-column,.c-custom-code,.custom-code-container):has(.lh3){padding-top:0!important;margin-top:0!important}
.lh3 .bonus-clock{display:inline-block;background:#d4e84b;color:#061f1d;padding:10px 15px;border-radius:10px;font-weight:800;font-variant-numeric:tabular-nums}
.lh3 .videos video{object-fit:contain;border-radius:16px}
.lh3 .videos video::-webkit-media-controls-download-button{display:none!important}
.lh3 figure{margin:0}
.lh3 figcaption{font-size:13px;margin-top:8px}
.lh3{--g:#061f1d;--l:#d4e84b;width:var(--vw,100vw);max-width:none;margin-left:calc(50% - var(--vw,100vw)/2);overflow:clip;background:#f7f6ef;color:var(--g);font:17px/1.65 Inter,Arial,sans-serif}
.lh3,.lh3 *{box-sizing:border-box}
.lh3 img{display:block;width:100%;height:auto}
.lh3 a{color:inherit}
.lh3 section{padding:64px 0}
.lh3 .w{width:min(1120px,calc(100% - 36px));margin:auto}
.lh3 h1,.lh3 h2,.lh3 h3{line-height:1.1;letter-spacing:-.04em;margin:0 0 22px}
.lh3 h1{font-size:clamp(40px,5.5vw,72px)}
.lh3 h2{font-size:clamp(30px,3.5vw,46px)}
.lh3 h3{font-size:28px}
.lh3 p{margin:0 0 18px}
.lh3 .dark{background:var(--g);color:#fff}
.lh3 .center{text-align:center}
.lh3 em{font-family:'Playfair Display',serif;color:var(--l)}
.lh3 .eye{font-size:12px;letter-spacing:.13em;font-weight:800;text-transform:uppercase;color:#6e7b25}
.lh3 .dark .eye{color:var(--l)}
.lh3 .btn{display:inline-flex;justify-content:center;align-items:center;min-height:54px;border:0;border-radius:12px;padding:14px 24px;background:var(--l);color:var(--g);font:800 16px Inter,Arial;text-decoration:none;cursor:pointer}
.lh3 a:focus-visible,.lh3 button:focus-visible{outline:3px solid #ef7854;outline-offset:4px}
.lh3 .nav{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:45px}
.lh3 .logo{width:72px;filter:brightness(0) invert(1)}
.lh3 .lead{font-size:21px;max-width:850px;margin:0 auto 25px}
.lh3 .bundle{max-width:1000px;margin:30px auto 24px;border-radius:20px;overflow:hidden}
.lh3 small{display:block;font-size:13px;opacity:.8;margin:14px 0}
.lh3 .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.lh3 .card{padding:24px;border:1px solid #d4decb;border-radius:18px;background:#fff}
.lh3 .card b{display:block;font-size:20px;margin-bottom:12px}
.lh3 .format-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.lh3 .format-grid .card{height:100%}
.lh3 .format-grid .card p{margin:0}
.lh3 .section-copy{max-width:850px}
.lh3 .row{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:50px;padding:35px 0;border-bottom:1px solid #d7ded0}
.lh3 .row:nth-child(even) .pic{order:2}
.lh3 .pic img{border-radius:20px;object-fit:contain}
.lh3 .price{padding:45px 24px;border-radius:25px;background:var(--g);color:#fff;text-align:center}
.lh3 .amount{font-size:clamp(42px,6vw,68px);font-weight:800}
.lh3 .price-includes{max-width:650px;margin:26px auto;padding:0;list-style:none;text-align:left}
.lh3 .price-includes li{position:relative;padding:8px 0 8px 30px;border-bottom:1px solid rgba(255,255,255,.16)}
.lh3 .price-includes li::before{content:'✓';position:absolute;left:0;color:var(--l);font-weight:800}
.lh3 .stock{max-width:620px;border:1px solid #778834;border-radius:16px;padding:20px;margin:22px auto}
.lh3 .stock strong{font-size:30px;color:var(--l)}
.lh3 progress{display:block;width:100%;height:12px;accent-color:var(--l);margin:12px 0}
.lh3 .tabs{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.lh3 .tabs button{padding:12px;border:1px solid #829067;background:transparent;color:inherit;border-radius:10px;cursor:pointer;font:inherit}
.lh3 .tabs button[aria-pressed=true]{background:var(--l);color:var(--g)}
.lh3 .clock{font-size:clamp(28px,5vw,56px);font-weight:800;font-variant-numeric:tabular-nums;margin:25px 0}
.lh3 .videos{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.lh3 .videos video{width:100%;aspect-ratio:16/9;background:var(--g)}
.lh3 .bio{display:grid;grid-template-columns:1fr 1fr;gap:45px;align-items:center}
.lh3 .bio img{border-radius:22px}
.lh3 details{padding:20px 0;border-bottom:1px solid #cbd7c4}
.lh3 summary{font-weight:700;cursor:pointer}
.lh3 details p{margin-top:15px}
.lh3 footer{padding:32px 0 112px;border-top:1px solid #cbd7c4;font-size:13px}
.lh3 [hidden]{display:none!important}
.lh3 .offer-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px 24px;max-width:1000px;margin:0 auto 28px;padding:14px 18px;border:1px solid rgba(212,232,75,.45);border-radius:16px;background:rgba(255,255,255,.06);text-align:left}
.lh3 .offer-copy b{display:block;color:var(--l);font-size:15px;line-height:1.35}
.lh3 .offer-copy span{display:block;font-size:13px;color:rgba(255,255,255,.78);margin-top:2px}
.lh3 .offer-clock{display:flex;gap:8px}
.lh3 .offer-clock span{display:flex;flex-direction:column;align-items:center;min-width:54px;padding:8px 6px 6px;border-radius:10px;background:#fff;color:var(--g)}
.lh3 .offer-clock b{font-size:22px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.lh3 .offer-clock i{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-top:4px;opacity:.7}
.lh3 .nav-cta{display:flex;flex-direction:column;align-items:flex-end;max-width:330px;text-align:right}
.lh3 .nav-cta small{margin:8px 0 0;font-size:11.5px;line-height:1.4}
.lh3 .pay-note{max-width:430px;margin:12px auto 0}
.lh3 .pill{display:inline-block;margin:0 0 6px;padding:7px 16px;border:1px solid rgba(255,255,255,.3);border-radius:999px;font-size:14px}
.lh3 .prog{max-width:620px;margin:34px auto 0;padding:24px 22px;border:1px solid rgba(255,255,255,.24);border-radius:18px;background:rgba(255,255,255,.04);text-align:center}
.lh3 .prog b{display:block;font-size:17px;margin-bottom:4px}
.lh3 .prog p{margin:0 0 16px;font-size:15px;color:rgba(255,255,255,.84)}
.lh3 .prog-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 20px;border:1px solid var(--l);border-radius:12px;color:var(--l);font-weight:800;font-size:15px;text-decoration:none}
.lh3 .prog-btn:hover{background:rgba(212,232,75,.12)}
.lh3 .prog small{margin:12px 0 0}
.lh3 .prog-link{display:inline-block;margin-top:6px;color:var(--l);font-weight:700;text-underline-offset:4px}
.lh3 .wa-float{position:fixed;right:20px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:999999;display:inline-flex;align-items:center;gap:10px;max-width:calc(100vw - 32px);padding:11px 18px 11px 14px;border:2px solid #fff;border-radius:999px;background:#075e54;color:#fff;text-decoration:none;text-align:left;box-shadow:0 8px 28px rgba(0,0,0,.28)}
.lh3 .wa-float:hover{background:#064c44}
.lh3 .wa-float svg{width:30px;height:30px;flex:none}
.lh3 .wa-float b{display:block;font-size:15px;line-height:1.2;font-weight:800}
.lh3 .wa-float span span{display:block;font-size:12px;line-height:1.3;opacity:.92}
@media(max-width:560px){
.lh3 .offer-bar{flex-direction:column;align-items:stretch;text-align:center;gap:8px;padding:10px 12px;margin-bottom:18px}
.lh3 .offer-copy b{font-size:13.5px}
.lh3 .offer-copy span{font-size:11.5px;margin-top:0}
.lh3 .offer-clock{justify-content:center;gap:6px}
.lh3 .offer-clock span{flex:1;min-width:0;padding:5px 4px 4px;border-radius:8px}
.lh3 .offer-clock b{font-size:18px}
.lh3 .offer-clock i{font-size:9px;margin-top:2px}
.lh3 .nav-cta small{display:none}
}
@media(max-width:480px){
.lh3 .pill{font-size:13px;padding:6px 12px}
.lh3 .wa-float{right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:10px 14px 10px 12px}
.lh3 .wa-float svg{width:26px;height:26px}
.lh3 .wa-float b{font-size:14px}
}
@media(max-width:760px){
.lh3 section{padding:42px 0}
.lh3 .row,.lh3 .bio{grid-template-columns:1fr;gap:22px}
.lh3 .row:nth-child(even) .pic{order:0}
.lh3 .grid{grid-template-columns:1fr 1fr}
.lh3 .format-grid{grid-template-columns:1fr 1fr}
.lh3 .videos{grid-template-columns:1fr}
.lh3 .lead{font-size:18px}
}
@media(max-width:420px){
.lh3 .grid{grid-template-columns:1fr}
.lh3 .format-grid{grid-template-columns:1fr}
.lh3 .w{width:calc(100% - 28px)}
}
</style>

<div id="lh-online" class="lh3">
<p>La Huerta LAB · Cargando…</p>
</div>

<script>
(function landing(C,M){
 const D='https://assets.cdn.filesafe.space/IdRKxMkw62mZx47SMDaS/media/';
 const ok=u=>/^https:\/\//i.test(u||'');

 function init(){
  const r=document.getElementById(C.id);
  if(!r||r.dataset.ready)return;
  r.dataset.ready='1';

  const q=s=>r.querySelector(s),
        O=C.online,
        cut=Date.parse(C.close),
        routeEnd=Date.parse(C.routeEnd),
        soilEnd=Date.parse(C.soilEnd);

  if(O){
   document.title='Fincas Productivas · Programa Online | La Huerta LAB';
   let description=document.head.querySelector('meta[name="description"]');
   if(!description){
    description=document.createElement('meta');
    description.name='description';
    document.head.append(description);
   }
   description.content='Aprende a diseñar una finca productiva desde donde estés. 8 semanas con sesiones en vivo con Iván, un año de acceso al contenido y un año de comunidad en La Huerta LAB.';
  }

  const wa='https://wa.me/573158505012?text='+encodeURIComponent(
   O?'Hola, tengo una duda sobre la inscripción o el pago del programa online Fincas Productivas de La Huerta LAB. ¿Me pueden ayudar?'
    :'Hola, quiero información de la formación presencial de La Huerta LAB.'
  );
  const waNext='https://wa.me/573158505012?text='+encodeURIComponent(
   'Hola, quiero información de la próxima convocatoria del programa online Fincas Productivas de La Huerta LAB.'
  );

  /* Los botones de inscripción llevan directo al pago en Skool, nunca a otra
     sección de la página. Al cerrar la convocatoria pasan a WhatsApp. */
  const cta=(txt)=>O
   ?`<a class="btn" data-go data-label="${txt||'Quiero formarme online'} →" href="${C.checkout}">${txt||'Quiero formarme online'} →</a>`
   :`<a class="btn" href="#${C.id}-precio">Quiero vivir Campo Escuela →</a>`;
  const payNote='El pago se realiza en nuestra comunidad de Skool. Al hacer clic, irás allí para completar tu inscripción.';

  const sec=(eye,title,body,cls='')=>
   `<section class="${cls}"><div class="w"><p class="eye">${eye}</p><h2>${title}</h2>${body}</div></section>`;

  const row=x=>`
   <article class="row" ${x[5]?'data-bonus="'+x[5]+'"':''}>
    <div class="pic">
     <img src="${x[3]}" alt="${x[1]}" loading="lazy">
    </div>
    <div>
     <p class="eye">${x[0]}</p>
     <h3>${x[1]}</h3>
     <p>${x[2]}</p>
     ${x[4]?`<small>${x[4]}</small>`:''}
     ${x[5]?`<div class="bonus-clock" data-bonus-clock="${x[5]}"></div>`:''}
    </div>
   </article>`;

  const rows=M.map((x,i)=>[
   String(i+1).padStart(2,'0')+' · '+x[0],x[1],x[2],D+x[3]
  ]);

  if(!O){
   rows.push(
    ['Experiencia presencial','4 días de inmersión','Observa una finca en funcionamiento, recorre sus componentes y pregunta en contexto real.',D+'6aaa828fa84eda365a9228d1.png'],
    ['Estancia incluida','3 noches en La Huerta Hotel','Quédate en el lugar de la experiencia. El precio depende del plan de alojamiento elegido.',D+'6aaa828f9f8b31b6ab40990d.png'],
    ['Durante los 4 días','Alimentación completa','Dedica tu atención a aprender con las comidas incluidas en tu inscripción.',D+'6aaa8297e51ec8fd0b9e09ea.png'],
    ['Aplicación en terreno','Prácticas en campo','Conecta las explicaciones con el sistema real y participa en las actividades del entrenamiento.',D+'6aaa828f13566d7d341e6138.png']
   );
  }

  const included=[
   ['Incluido en ambas modalidades','Memorias del curso','Vuelve sobre lo aprendido con el material de apoyo del entrenamiento.',D+'6aaa8294a84eda365a9228f3.png'],
   ['Incluida en ambas modalidades','Calculadora de siembra','Planifica cantidades de producción según las necesidades de tu familia o tus clientes.',D+'6aaa828f9f8b31b6ab40990c.png']
  ];

  const benefits=O?[
   ['Prioriza tu inversión','Distingue qué resolver primero y qué puede esperar.'],
   ['Entiende tu finca','Relaciona suelo, agua y producción para decidir con criterio.'],
   ['Empieza sin gastar de más','Evita las inversiones que se hacen por afán y se pagan por años.'],
   ['Resuelve tus dudas','Lleva tus preguntas a las sesiones con Iván.']
  ]:[
   ['Ve antes de hacer','Observa decisiones reales antes de aplicarlas a tu terreno.'],
   ['Conecta el sistema','Entiende cómo conviven suelo, cultivos, animales y agua.'],
   ['Pregunta en contexto','Contrasta tus dudas mientras recorres la finca.'],
   ['Enfócate en aprender','Vive la inmersión con alojamiento y comidas incluidos.']
  ];

  const onlineBenefits=[
   ['Véanlo en pareja','Una sola inscripción por proyecto. Si detrás de la finca son dos, se forman los dos: vean las sesiones juntos y tomen las decisiones juntos.'],
   ['Un año con todo el contenido','Sesiones grabadas, lecciones y material quedan cargados 12 meses en la plataforma. Repasa cada principio justo cuando lo vas a aplicar, no cuando lo dicte un calendario.'],
   ['Un año dentro de La Huerta LAB','12 meses en la comunidad. Cuando en tu zona nadie cree que se puede producir sin agroquímicos, aquí hay gente que ya lo está haciendo.'],
   ['En vivo, no enlatado','8 sesiones semanales en vivo con Iván para revisar tus dudas, más lecciones pregrabadas exclusivas del programa que avanzas a tu ritmo.'],
   ['Sin viajar','El método completo llega a donde está tu finca — o a donde estás evaluando comprarla. Sin tiquetes ni hospedaje.'],
   ['Los mismos bonos del presencial','Los bonos de acción rápida aplican igual que en el curso presencial, con los mismos límites de plazas y de fechas.']
  ];

  const bonuses=[
   [
    'Bono 01 · Hasta agotar las 30 plazas',
    '1 a 1 con Iván: tu plan personalizado',
    'Pon tu proyecto frente a Iván. Revisa tus objetivos, tu terreno y lo que hoy te frena para orientar un plan personalizado.',
    C.planImage,
    '30 plazas en total, compartidas entre online y presencial. Disponible hasta que se cubran las 30. Asignación por orden de inscripción y confirmación del equipo. Consulta disponibilidad antes de pagar.',
    'plan'
   ],
   [
    'Bono 02 · Disponible hasta el 18 de septiembre',
    'Ruta de 90 días',
    'Ordena tus prioridades según tu tierra, clima y presupuesto. Define una secuencia para aplicar el método sin querer hacerlo todo a la vez.',
    D+'6aaa829437639ce00c9bf41c.png',
    'Disponible hasta el 18 de septiembre de 2026 a las 23:59, hora de Colombia. Después deja de incluirse para nuevas inscripciones.',
    'route'
   ],
   [
    'Bono 03 · Disponible hasta el 19 de septiembre',
    'Interpreta tu suelo',
    'Entiende tu análisis de suelo y orienta las decisiones para remineralizarlo y nutrir tus plantas con el enfoque de Iván.',
    C.soilImage,
    'Disponible hasta el 19 de septiembre de 2026 a las 23:59, hora de Colombia. Requiere análisis de suelo; no incluye laboratorio. Interfaz ilustrativa.',
    'soil'
   ]
  ];

  const faq=[
   ['¿Necesito tener finca?','Puedes formarte si ya tienes tierra o si estás evaluando comprar y quieres decidir con más criterio.'],
   ['¿Qué herramientas incluye?','Ambas modalidades incluyen memorias y calculadora de siembra. La ruta de 90 días y el recurso Interpreta tu suelo son bonos sujetos a sus fechas límite; el 1 a 1 está limitado a 30 plazas compartidas. Al vencer un bono deja de incluirse para nuevos compradores. Quienes lo obtuvieron a tiempo lo conservan.'],
   ['¿Incluye comunidad durante 12 meses?',O?'Sí. Los 12 meses de comunidad en Skool están incluidos en el online.':'No. Los 12 meses de comunidad corresponden únicamente a la modalidad online.'],
   ['¿Qué ocurre si no puedo asistir?',O?'Las sesiones quedan grabadas. Revisa las fechas en la <a href="#'+C.id+'-calendario">sección de calendario</a>.':'Consulta al hotel sus condiciones de cancelación y cambio de fecha antes de reservar.'],
   ['¿Hay garantía de rentabilidad?','No se garantizan resultados económicos. Dependen del terreno, mercado, recursos y ejecución. Consulta las políticas de compra y devolución antes de pagar.']
  ];

  if(O){
   faq.splice(3,0,
    ['¿Puedo tomarlo con mi pareja?','Sí. La inscripción es por proyecto, no por persona: si detrás de la misma finca son dos, se forman los dos con una sola inscripción.'],
    ['¿Cuándo son las sesiones en vivo?','Una por semana durante ocho semanas: los miércoles de 6:00 a 8:00 p. m., hora de Colombia, del 30 de septiembre al 18 de noviembre de 2026. Todas quedan grabadas.'],
    ['¿Cuánto tiempo tengo acceso?','12 meses. Los videos, las lecciones y el material quedan cargados un año en la plataforma, y la comunidad de La Huerta LAB también es por 12 meses.'],
    ['¿Dónde se dicta el programa?','En La Huerta LAB, nuestra plataforma en Skool. Lecciones, sesiones en vivo, grabaciones y comunidad, todo en un solo lugar.'],
    ['¿En qué se diferencia del curso presencial?','El método es el mismo: los 7 principios de inmunidad del bosque. El presencial son 4 días inmersivos en La Huerta, en Colombia; el online son 8 semanas desde tu país, con un año de acceso al contenido y un año de comunidad. Los bonos son los mismos en ambas modalidades.']
   );
  }

  r.innerHTML=`
   <section class="dark center">
    <div class="w">
     <div class="offer-bar" data-offer-bar>
      <div class="offer-copy"><b>Esta oferta cierra el jueves 24 de septiembre</b><span>23:59 · Hora de Colombia · 2026</span></div>
      <div class="offer-clock" role="timer" aria-label="Tiempo que falta para el cierre de la oferta">
       <span><b data-oc="d">00</b><i>días</i></span><span><b data-oc="h">00</b><i>horas</i></span><span><b data-oc="m">00</b><i>min</i></span><span><b data-oc="s">00</b><i>seg</i></span>
      </div>
     </div>
     <nav class="nav">
      <img class="logo" src="${D}6aa46253f4e2fd8aa0ffbddd.png" alt="La Huerta LAB">
      <div class="nav-cta">
       ${cta()}
       ${O?`<small data-go-note>${payNote}</small>`:''}
      </div>
     </nav>
     <p class="eye">${O?'Fincas Productivas · Programa online':'Campo Escuela presencial'}</p>
     <h1>Aprende a diseñar una finca productiva.<br><em>${O?'Desde donde estés.':'Viviendo el método en el campo.'}</em></h1>
     <p class="lead">Ordena tus decisiones sobre suelo, agua y producción antes de invertir a ciegas. ${O?'Ocho semanas con Iván, a tu ritmo y desde tu país.':'Observa el sistema funcionando y conecta lo aprendido con tu propia finca.'}</p>
     ${O?'<p class="pill">Primera clase en vivo: <b>30 de septiembre de 2026</b></p>':''}
     <div class="bundle">
      <img data-bundle src="${D+C.bundle}" alt="Vista general de la oferta ${O?'online':'presencial'}" fetchpriority="high">
     </div>
     <small data-bundle-note>Vista general del programa. Los bonos y sus condiciones se explican más abajo. No se entregan los dispositivos ilustrados.</small>
     ${cta()}
     ${O?`<small class="pay-note" data-go-note>${payNote}</small>`:''}
     ${ok(C.programa)?`<div class="prog">
      <b>Conoce el programa antes de inscribirte.</b>
      <p>Consulta los temas, las fechas y cómo trabajaremos cada semana.</p>
      <a class="prog-btn" href="${C.programa}" target="_blank" rel="noopener">&darr; Descargar programa educativo · PDF</a>
      <small>Se abre en Google Drive, en otra pestaña.</small>
     </div>`:''}
    </div>
   </section>`+

   sec(
    'Lo que cambia para ti',
    'Más criterio para decidir. Más claridad para empezar.',
    `<div class="grid">${benefits.map(x=>`<div class="card"><b>${x[0]}</b>${x[1]}</div>`).join('')}</div>`
   )+

   sec(

  function render(){
   const expired=Date.now()>=cut;

   if(!O){
    if(cohort==='october'&&(expired||stock.octoberAvailable===0)){
     cohort='december';
    }

    const n=stock[cohort+'Available'];
    q('[data-date]').textContent=cohort==='october'?'1 al 4 de octubre de 2026':'3 al 6 de diciembre de 2026';
    q('[data-stock]').textContent=n+' plazas disponibles';

     (stock.octoberAvailable===0?'Octubre agotado. ':expired?'La convocatoria de octubre ha cerrado. ':'')+
     (fresh?'Dato actualizado desde reservas. ':'Dato de referencia; confirmar antes de pagar. ')+
     (40-n)+' de 40 plazas cubiertas.';

    r.querySelectorAll('[data-cohort]').forEach(b=>{
     b.setAttribute('aria-pressed',String(b.dataset.cohort===cohort));
     b.disabled=b.dataset.cohort==='october'&&(expired||stock.octoberAvailable===0);
    });

    q('[data-bundle-note]').textContent='Consulta los entregables y bonos detallados más abajo. La disponibilidad final se confirma al reservar.';

   const closed=O?expired:stock[cohort+'Available']===0,

   const pay=q('[data-pay]'),
         payUrl=!closed&&ok(u)?u:(O?waNext:wa);

     a.href=go?C.checkout:waNext;

   }
   q('[data-pay]').textContent=closed
    ?'Consultar próximas convocatorias →'
    :ok(u)
     ?(O?'Inscribirme online →':'Reservar '+(cohort==='october'?'octubre':'diciembre')+' →')

  }

  async function refresh(){
   if(!ok(C.inventory)||busy)return;
   busy=true;
   const ctl=new AbortController(),
         t=setTimeout(()=>ctl.abort(),8000);

   try{
    const res=await fetch(C.inventory,{cache:'no-store',signal:ctl.signal});
    if(!res.ok)throw Error();
    const d=await res.json();

    if(!O){
     if(!['octoberAvailable','decemberAvailable'].every(k=>
      Number.isInteger(d[k])&&d[k]>=0&&d[k]<=40
     ))throw Error();
     stock=d;
     fresh=true;
    }

    bonusAvailable=
     Number.isInteger(d.bonusAvailable)&&d.bonusAvailable>=0&&d.bonusAvailable<=30
      ?d.bonusAvailable:null;
   }catch(e){
    fresh=false;
    bonusAvailable=null;
   }finally{
    clearTimeout(t);
    busy=false;
    render();
   }
  }

  function time(end){
   const s=Math.max(0,Math.ceil((end-Date.now())/1000));
   return [
    Math.floor(s/86400)+' d',
    String(Math.floor(s/3600)%24).padStart(2,'0')+' h',
    String(Math.floor(s/60)%60).padStart(2,'0')+' min',
    String(s%60).padStart(2,'0')+' s'
   ].join(' · ');
  }

  function offerBar(now){
   const bar=q('[data-offer-bar]');
   if(!bar)return;
   const s=Math.max(0,Math.ceil((cut-now)/1000));
   bar.hidden=s===0;
   if(!s)return;
   const v={d:Math.floor(s/86400),h:Math.floor(s/3600)%24,m:Math.floor(s/60)%60,s:s%60};
   Object.keys(v).forEach(k=>{bar.querySelector('[data-oc="'+k+'"]').textContent=String(v[k]).padStart(2,'0');});
  }

  function tick(){
   const now=Date.now(),expired=now>=cut,ended=[];
   offerBar(now);
   q('[data-clock]').textContent=expired?'Inscripciones cerradas':time(cut);

   [['plan',null],['route',routeEnd],['soil',soilEnd]].forEach(([key,end])=>{
    const gone=key==='plan'?bonusAvailable===0:now>=end;
    q('[data-bonus="'+key+'"]').hidden=gone;

    if(gone){
     ended.push(key==='plan'?'1 a 1 con Iván':key==='route'?'Ruta de 90 días':'Interpreta tu suelo');
    }else{
     q('[data-bonus-clock="'+key+'"]').textContent=
      key==='plan'
       ?(bonusAvailable===null?'Hasta agotar 30 plazas · cupo compartido':bonusAvailable+' de 30 plazas disponibles')
       :'Termina en '+time(end);
    }
   });

   q('[data-bonus-title]').textContent=[
    'Los bonos de esta convocatoria ya no están disponibles.',
    'Un apoyo extra, con su límite.',
    'Dos apoyos extra. Cada uno con su límite.',
    'Tres apoyos extra. Cada uno con su límite.'

    ?'Ya no se incluyen para nuevas inscripciones: '+ended.join(', ')+'. Quienes los obtuvieron dentro del plazo conservan sus bonos.'
    :'';

   const bundle=
    now<routeEnd&&!expired&&(O||(cohort==='october'&&stock.octoberAvailable===33))

     :'La Huerta, la finca en funcionamiento donde se aplica el método.';
    lastBundle=bundle;
   }

   if(expired){
    q('[data-close-note]').textContent=O
     ?'Inscripciones cerradas. Consulta próximas convocatorias.'
     :'Inscripciones de octubre cerradas. Consulta disponibilidad de diciembre.';
   }
   render();
  }

  const fit=()=>r.style.setProperty('--vw',document.documentElement.clientWidth+'px');
  fit();
  window.addEventListener('resize',fit);

  r.querySelectorAll('[data-cohort]').forEach(b=>{
   b.addEventListener('click',()=>{
    cohort=b.dataset.cohort;
    render();
    tick();
   });
  });

  q('[data-pay]').addEventListener('click',render);
  render();
  tick();
  refresh();

  let n=0;
  const timer=setInterval(()=>{
   if(!r.isConnected){
    clearInterval(timer);
    window.removeEventListener('resize',fit);
    return;
   }
   tick();
   if(++n%30===0&&!document.hidden)refresh();
  },1000);
