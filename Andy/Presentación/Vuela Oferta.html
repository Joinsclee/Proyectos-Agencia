<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vuela · Programa de transformación 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400;1,9..144,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0a0a0a; }
  body { font-family: 'Inter', sans-serif; }
  deck-stage > section { background: #0a0a0a; }
  /* Force the React mount div to fill the section so percentage-height inside Slide works.
     Without this, height:100% on the Slide collapses to content height. */
  deck-stage > section > div { position: absolute; inset: 0; width: 100%; height: 100%; }
  ::selection { background: rgba(201,169,97,0.4); color: #f5f1e8; }

  /* ============ SLIDE ANIMATIONS ============
     Elements declare an intent via [data-anim="..."] with optional --d delay.
     We control replay by toggling a class .anim-on on the active <section>.
     When the class is removed and re-added, the descendant selectors stop
     matching the animation rules and then start matching again — that
     guarantees the browser restarts the @keyframes from the beginning. */

  /* Resting state (used while [data-anim] elements exist but their slide is
     not currently animating). */
  [data-anim] { opacity: 0; }
  [data-anim="strike"], [data-anim="reveal"], [data-anim="draw-x"], [data-anim="draw-y"] { opacity: 1; }
  [data-anim="draw-x"] { transform: scaleX(0); transform-origin: left center; }
  [data-anim="draw-y"] { transform: scaleY(0); transform-origin: top center; }
  [data-anim="strike"] {
    background-image: linear-gradient(currentColor, currentColor);
    background-repeat: no-repeat;
    background-size: 0% 2px;
    background-position: left 56%;
    text-decoration: none !important;
  }

  @keyframes vuela-rise    { from { opacity: 0; transform: translateY(28px); }  to { opacity: 1; transform: none; } }
  @keyframes vuela-fall    { from { opacity: 0; transform: translateY(-24px); } to { opacity: 1; transform: none; } }
  @keyframes vuela-slide-l { from { opacity: 0; transform: translateX(-48px); } to { opacity: 1; transform: none; } }
  @keyframes vuela-slide-r { from { opacity: 0; transform: translateX(48px); }  to { opacity: 1; transform: none; } }
  @keyframes vuela-zoom    { from { opacity: 0; transform: scale(0.92); }       to { opacity: 1; transform: none; } }
  @keyframes vuela-reveal  { from { clip-path: inset(0 100% 0 0); }             to { clip-path: inset(0 0 0 0); } }
  @keyframes vuela-draw-x  { from { transform: scaleX(0); }                     to { transform: scaleX(1); } }
  @keyframes vuela-draw-y  { from { transform: scaleY(0); }                     to { transform: scaleY(1); } }
  @keyframes vuela-strike  { from { background-size: 0% 2px; }                  to { background-size: 100% 2px; } }

  /* Active animation rules — only active when the section has data-deck-active.
     deck-stage already toggles that attribute on every navigation, so changing
     animation-name from "none" -> "vuela-..." triggers the browser to start
     the animation fresh on every entry/re-entry. */
  [data-deck-active] [data-anim="rise"]    { animation: vuela-rise    900ms cubic-bezier(.2,.7,.2,1) var(--d, 0ms) both; }
  [data-deck-active] [data-anim="fall"]    { animation: vuela-fall    900ms cubic-bezier(.2,.7,.2,1) var(--d, 0ms) both; }
  [data-deck-active] [data-anim="slide-l"] { animation: vuela-slide-l 900ms cubic-bezier(.2,.7,.2,1) var(--d, 0ms) both; }
  [data-deck-active] [data-anim="slide-r"] { animation: vuela-slide-r 900ms cubic-bezier(.2,.7,.2,1) var(--d, 0ms) both; }
  [data-deck-active] [data-anim="zoom"]    { animation: vuela-zoom    1000ms cubic-bezier(.2,.7,.2,1) var(--d, 0ms) both; }
  [data-deck-active] [data-anim="reveal"]  { animation: vuela-reveal  1100ms cubic-bezier(.7,0,.2,1)  var(--d, 0ms) both; }
  [data-deck-active] [data-anim="draw-x"]  { animation: vuela-draw-x  900ms cubic-bezier(.7,0,.2,1)  var(--d, 0ms) both; }
  [data-deck-active] [data-anim="draw-y"]  { animation: vuela-draw-y  1300ms cubic-bezier(.7,0,.2,1) var(--d, 0ms) both; }
  [data-deck-active] [data-anim="strike"]  { animation: vuela-strike  700ms cubic-bezier(.7,0,.2,1)  var(--d, 0ms) both; }

  /* prefers-reduced-motion override removed intentionally — Windows often
     reports it as 'reduce' which silently kills our deck animations. */

  /* ============ PREMIUM PULSE UTILITIES ============
     Always-on decorative pulses that reinforce premium feel. */
  @keyframes vuela-pulse-dot { 0%, 100% { transform: scale(1); opacity: 1; }
                               50% { transform: scale(1.5); opacity: 0.55; } }
  @keyframes vuela-pulse-ring { 0% { transform: scale(1); opacity: 0.7; }
                                100% { transform: scale(2.4); opacity: 0; } }
  @keyframes vuela-glow-border { 0%, 100% { border-color: rgba(201,169,97,0.28); box-shadow: 0 0 0 0 rgba(201,169,97,0); }
                                 50% { border-color: rgba(201,169,97,0.6);  box-shadow: 0 0 28px 0 rgba(201,169,97,0.12); } }
  @keyframes vuela-shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
  @keyframes vuela-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

  .pulse-dot {
    position: relative; display: inline-block;
    width: 10px; height: 10px; border-radius: 50%;
    background: #c9a961;
    animation: vuela-pulse-dot 2s ease-in-out infinite;
  }
  .pulse-dot::after {
    content: ''; position: absolute; inset: -4px; border-radius: 50%;
    border: 1px solid #c9a961;
    animation: vuela-pulse-ring 2s ease-out infinite;
  }
  .pulse-glow { animation: vuela-glow-border 3.2s ease-in-out infinite; }
  .pulse-float { animation: vuela-float 4s ease-in-out infinite; }
  .gold-shimmer {
    background: linear-gradient(90deg, #c9a961 0%, #f5e2a8 35%, #c9a961 65%, #c9a961 100%);
    background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: vuela-shimmer 4.5s linear infinite;
  }

  /* ============ SISTEMA SOLAR · 3 PILARES (TEMA CLARO) ============
     Adaptado del hero de vuela-gracias.html para fondo cream. */
  @keyframes solar-twinkle { 0%, 100% { opacity: 0.10; } 50% { opacity: 0.55; } }
  .solar-svg { width: 100%; height: auto; display: block; }
  .solar-svg .star { fill: #b08a3e; opacity: 0.30; animation: solar-twinkle 4s ease-in-out infinite; }
  .solar-svg .star.s2 { animation-duration: 5s; animation-delay: 0.6s; }
  .solar-svg .star.s3 { animation-duration: 3.4s; animation-delay: 1.2s; }
  .solar-svg .star.s4 { animation-duration: 6s; animation-delay: 1.9s; }
  .solar-svg .star.s5 { animation-duration: 4.6s; animation-delay: 2.6s; }
  .solar-svg .star.gold { fill: #c9a961; }
  .solar-svg .orbit-path { fill: none; stroke: #b08a3e; stroke-width: 0.7; stroke-dasharray: 3 6; opacity: 0.28; }
  .solar-svg .sun-disk { fill: #ffffff; stroke: #b08a3e; stroke-width: 1.6; filter: drop-shadow(0 6px 20px rgba(176,138,62,0.32)); }
  .solar-svg .sun-eyebrow { fill: #b08a3e; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 9.5px; letter-spacing: 2.4px; text-transform: uppercase; }
  .solar-svg .sun-name { fill: #1a1a1a; font-family: 'Fraunces', serif; font-style: italic; font-weight: 400; font-size: 26px; letter-spacing: -0.01em; }
  .solar-svg .planet-bg { fill: #ffffff; }
  .solar-svg .planet-ring { fill: none; stroke: #b08a3e; stroke-width: 1.5; filter: drop-shadow(0 0 4px rgba(176,138,62,0.55)); }
  .solar-svg .planet-icon { fill: none; stroke: #b08a3e; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .solar-svg .planet-label { fill: #1a1a1a; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 1.8px; text-transform: uppercase; }

  /* ============ MINIAPP FLOW · entrada → IA → resultado ============ */
  @keyframes mini-pulse { 0%, 100% { opacity: 0.40; transform: scale(1); } 50% { opacity: 1; transform: scale(1.10); } }
  .mini-svg { width: 100%; height: auto; display: block; }
  .mini-svg .mini-stage { fill: #ffffff; stroke: #b08a3e; stroke-width: 1.6; }
  .mini-svg .mini-rail { fill: none; stroke: #b08a3e; stroke-dasharray: 2 5; opacity: 0.50; }
  .mini-svg .mini-node { fill: #ffffff; stroke: #b08a3e; stroke-width: 1.4; }
  .mini-svg .mini-node-label { fill: #5a5a5a; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 2.2px; text-transform: uppercase; }
  .mini-svg .mini-icon { fill: none; stroke: #b08a3e; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .mini-svg .mini-core { fill: #b08a3e; transform-box: fill-box; transform-origin: center; animation: mini-pulse 2.4s ease-in-out infinite; }

  /* ============ NÚMEROS PULSANTES (W01) ============ */
  @keyframes pulse-num {
    0%, 100% { box-shadow: 0 0 0 0 rgba(176,138,62,0.0); transform: scale(1); }
    50%      { box-shadow: 0 0 24px 4px rgba(176,138,62,0.25); transform: scale(1.05); }
  }

  /* ============ COMMUNITY NETWORK (W10) ============ */
  .comm-svg { width: 100%; height: auto; display: block; }
  .comm-svg .comm-line { stroke: #b08a3e; stroke-width: 1.2; opacity: 0.40; }
  .comm-svg .comm-line-outer { stroke: #b08a3e; stroke-width: 1; opacity: 0.22; }
  .comm-svg .comm-node { fill: #ffffff; stroke: #b08a3e; stroke-width: 1.6; }
  .comm-svg .comm-icon { fill: none; stroke: #b08a3e; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .comm-svg .comm-center-disk { fill: #b08a3e; stroke: #b08a3e; stroke-width: 2; }
  .comm-svg .comm-center-text { fill: #ffffff; font-family: 'Fraunces', serif; font-style: italic; font-weight: 400; font-size: 18px; }

  /* ============ MÉTODO ÚNICO (W11) ============ */
  .metodo-svg { width: 100%; height: auto; display: block; }
  .metodo-svg .metodo-hex { fill: none; stroke: #b08a3e; stroke-width: 1.5; opacity: 0.30; }
  .metodo-svg .metodo-arc { fill: none; stroke: #b08a3e; stroke-width: 1.4; }
  .metodo-svg .metodo-core { fill: #ffffff; stroke: #b08a3e; stroke-width: 1.8; }
  .metodo-svg .metodo-eyebrow { fill: #b08a3e; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 2.4px; text-transform: uppercase; }
  .metodo-svg .metodo-name { fill: #1a1a1a; font-family: 'Fraunces', serif; font-style: italic; font-weight: 400; font-size: 26px; }
  .metodo-svg .metodo-vertex { fill: #b08a3e; }

  /* ============ TRANSFORMATION TIMELINE (S04 — tema oscuro) ============ */
  .trans-svg { width: 100%; height: auto; display: block; }
  .trans-svg .trans-rail { stroke: rgba(245,241,232,0.14); stroke-width: 3; }
  .trans-svg .trans-rail-fill { stroke: #c9a961; stroke-width: 4; }
  .trans-svg .trans-stop { fill: #0a0a0a; stroke: #c9a961; stroke-width: 2.2; }
  .trans-svg .trans-stop-end { fill: #c9a961; stroke: #c9a961; }
  .trans-svg .trans-label-key { fill: #c9a961; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: 3px; text-transform: uppercase; }
  .trans-svg .trans-label-val { fill: #f5f1e8; font-family: 'Fraunces', serif; font-style: italic; font-weight: 400; font-size: 26px; }
  .trans-svg .trans-label-muted { fill: rgba(138,138,138,0.95); font-family: 'Inter', sans-serif; font-weight: 600; font-size: 17px; letter-spacing: 2.4px; text-transform: uppercase; }

  /* ============ ECUACIÓN DE VALOR (W18b — tema claro) ============ */
  @keyframes veq-shine { 0%, 100% { background-position: -120% 0; } 50% { background-position: 120% 0; } }
  @keyframes veq-bar-sweep { 0% { transform: translateX(-100%); opacity: 0; } 30% { opacity: 1; } 70% { opacity: 1; } 100% { transform: translateX(360%); opacity: 0; } }
  @keyframes veq-ring-pulse { 0% { opacity: 0.6; transform: scale(1); } 100% { opacity: 0; transform: scale(1.12); } }

  /* ============ AVISO DE ROTACIÓN (sólo móvil portrait) ============
     El deck está diseñado en 16:9 (1920×1080). En portrait móvil queda
     letterbox arriba/abajo. Sugerimos rotar para una experiencia plena. */
  @keyframes vuela-rotate-hint { 0%, 100% { transform: rotate(-12deg); } 50% { transform: rotate(12deg); } }
  .rotate-hint {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    z-index: 2147481000; pointer-events: none;
    display: none; align-items: center; gap: 12px;
    padding: 12px 20px; border-radius: 999px;
    background: rgba(201, 169, 97, 0.14); border: 1px solid rgba(201, 169, 97, 0.45);
    color: #f5e2a8; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase; white-space: nowrap;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    animation: vuela-rotate-hint-fade 6s ease-in-out 1.5s forwards;
  }
  .rotate-hint svg { animation: vuela-rotate-hint 1.6s ease-in-out infinite; }
  @keyframes vuela-rotate-hint-fade {
    0%, 70% { opacity: 1; }
    100% { opacity: 0; visibility: hidden; }
  }
  @media (orientation: portrait) and (max-width: 720px) {
    .rotate-hint { display: inline-flex; }
  }

  /* ============ CAMINO 90 DÍAS · planetas (S07 — tema oscuro) ============ */
  @keyframes path-pulse-ring { 0%, 100% { transform: scale(1); opacity: 0.6; } 50% { transform: scale(1.18); opacity: 0; } }
  .path-svg { width: 100%; height: auto; display: block; }
  .path-svg .path-trunk { stroke: #c9a961; stroke-width: 1; stroke-dasharray: 3 6; opacity: 0.4; }
  .path-svg .path-planet-bg { fill: #0a0a0a; stroke: #c9a961; stroke-width: 1.5; }
  .path-svg .path-planet-ring { fill: none; stroke: #c9a961; stroke-width: 1; opacity: 0.5; }
  .path-svg .path-planet-icon { fill: none; stroke: #c9a961; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .path-svg .path-planet-num { fill: #c9a961; font-family: 'Fraunces', serif; font-style: italic; font-weight: 400; font-size: 13px; }
  .path-svg .path-pulse { fill: none; stroke: #c9a961; stroke-width: 1.4; transform-box: fill-box; transform-origin: center; animation: path-pulse-ring 3s ease-out infinite; }

</style>
</head>
<body>
<deck-stage width="1920" height="1080">
  <!-- ===== VUELA — Diapositivas de oferta (tema oscuro) ===== -->
  <section data-label="01 Portada Vuela"><div id="s01"></div></section>
  <section data-label="02 No es mentoría"><div id="s02"></div></section>
  <section data-label="03 No vienes a aprender"><div id="s03"></div></section>
  <section data-label="04 La transformación"><div id="s04"></div></section>
  <section data-label="05 Lo que te llevas"><div id="s05"></div></section>
  <section data-label="06 El camino 90 días"><div id="s07"></div></section>
  <section data-label="07 Mes 1 Construye"><div id="s08"></div></section>
  <section data-label="08 Mes 2 Estructura"><div id="s09"></div></section>
  <section data-label="09 Mes 3 Vende"><div id="s10"></div></section>
  <section data-label="10 Día 91"><div id="s11"></div></section>
  <section data-label="11 Bonos"><div id="s13"></div></section>
  <section data-label="12 Inversión"><div id="s14"></div></section>
  <section data-label="13 No es dinero"><div id="s15"></div></section>
  <section data-label="14 Garantía"><div id="s16"></div></section>
  <section data-label="15 20 plazas"><div id="s17"></div></section>
  <section data-label="16 30 minutos juntos"><div id="s17b"></div></section>
  <section data-label="17 Cierre"><div id="s18"></div></section>
</deck-stage>

<div class="rotate-hint" aria-hidden="true">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5" y="2" width="14" height="20" rx="2"/>
    <line x1="12" y1="18" x2="12" y2="18.01"/>
  </svg>
  <span>Gira tu pantalla para ver mejor</span>
</div>

<script>
/* ============================================================
   <deck-stage> — web component (inlined)
   ============================================================ */
(() => {
  const DESIGN_W_DEFAULT = 1920;
  const DESIGN_H_DEFAULT = 1080;
  const OVERLAY_HIDE_MS = 1800;
  const VALIDATE_ATTR = 'no_overflowing_text,no_overlapping_text,slide_sized_text';
  const pad2 = (n) => String(n).padStart(2, '0');

  const stylesheet = `
    :host { position: fixed; inset: 0; display: block; background: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; overflow: hidden; }
    .stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    .canvas { position: relative; transform-origin: center center; flex-shrink: 0; background: #0a0a0a; will-change: transform; }
    ::slotted(*) { position: absolute !important; inset: 0 !important; width: 100% !important; height: 100% !important;
      box-sizing: border-box !important; overflow: hidden; opacity: 0; pointer-events: none; visibility: hidden; }
    ::slotted([data-deck-active]) { opacity: 1; pointer-events: auto; visibility: visible; }
    .tapzones { position: fixed; inset: 0; display: flex; z-index: 2147482000; pointer-events: none; }
    .tapzone { flex: 1; pointer-events: auto; -webkit-tap-highlight-color: transparent; }
    @media (hover: hover) and (pointer: fine) { .tapzones { display: none; } }
    .overlay { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 6px) scale(0.92); filter: blur(6px);
      display: flex; align-items: center; gap: 4px; padding: 4px; background: #000; color: #fff; border-radius: 999px;
      font-size: 12px; font-feature-settings: "tnum" 1; opacity: 0; pointer-events: none;
      transition: opacity 260ms ease, transform 260ms cubic-bezier(.2,.8,.2,1), filter 260ms ease;
      transform-origin: center bottom; z-index: 2147483000; user-select: none; }
    .overlay[data-visible] { opacity: 1; pointer-events: auto; transform: translate(-50%, 0) scale(1); filter: blur(0); }
    .btn { appearance: none; background: transparent; border: 0; margin: 0; padding: 0; color: inherit; font: inherit;
      cursor: pointer; display: inline-flex; align-items: center; justify-content: center; height: 28px; min-width: 28px;
      border-radius: 999px; color: rgba(255,255,255,0.72); transition: background 140ms ease, color 140ms ease; }
    .btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
    .btn:focus { outline: none; }
    .btn svg { width: 14px; height: 14px; display: block; }
    .btn.reset { font-size: 11px; font-weight: 500; padding: 0 10px 0 12px; gap: 6px; }
    .btn.reset .kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 16px; height: 16px;
      padding: 0 4px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10px; line-height: 1;
      color: rgba(255,255,255,0.88); background: rgba(255,255,255,0.12); border-radius: 4px; }
    .count { font-variant-numeric: tabular-nums; color: #fff; font-weight: 500; padding: 0 8px; min-width: 42px;
      text-align: center; font-size: 12px; }
    .count .sep { color: rgba(255,255,255,0.45); margin: 0 3px; font-weight: 400; }
    .count .total { color: rgba(255,255,255,0.55); }
    .divider { width: 1px; height: 14px; background: rgba(255,255,255,0.18); margin: 0 2px; }
    @media print {
      :host { position: static; inset: auto; background: none; overflow: visible; color: inherit; }
      .stage { position: static; display: block; }
      .canvas { transform: none !important; width: auto !important; height: auto !important; background: none; }
      ::slotted(*) { position: relative !important; inset: auto !important; width: var(--deck-design-w) !important;
        height: var(--deck-design-h) !important; opacity: 1 !important; visibility: visible !important;
        pointer-events: auto; break-after: page; page-break-after: always; break-inside: avoid; overflow: hidden; }
      ::slotted(*:last-child) { break-after: auto; page-break-after: auto; }
      .overlay, .tapzones { display: none !important; }
    }
  `;

  class DeckStage extends HTMLElement {
    static get observedAttributes() { return ['width', 'height', 'noscale']; }
    constructor() {
      super();
      this._root = this.attachShadow({ mode: 'open' });
      this._index = 0; this._slides = []; this._hideTimer = null;
      this._onKey = this._onKey.bind(this);
      this._onResize = this._onResize.bind(this);
      this._onSlotChange = this._onSlotChange.bind(this);
      this._onMouseMove = this._onMouseMove.bind(this);
      this._onTapBack = this._onTapBack.bind(this);
      this._onTapForward = this._onTapForward.bind(this);
    }
    get designWidth() { return parseInt(this.getAttribute('width'), 10) || DESIGN_W_DEFAULT; }
    get designHeight() { return parseInt(this.getAttribute('height'), 10) || DESIGN_H_DEFAULT; }
    connectedCallback() {
      this._render(); this._syncPrintPageRule();
      window.addEventListener('keydown', this._onKey);
      window.addEventListener('resize', this._onResize);
      window.addEventListener('mousemove', this._onMouseMove, { passive: true });
    }
    disconnectedCallback() {
      window.removeEventListener('keydown', this._onKey);
      window.removeEventListener('resize', this._onResize);
      window.removeEventListener('mousemove', this._onMouseMove);
      if (this._hideTimer) clearTimeout(this._hideTimer);
    }
    attributeChangedCallback() {
      if (this._canvas) {
        this._canvas.style.width = this.designWidth + 'px';
        this._canvas.style.height = this.designHeight + 'px';
        this._canvas.style.setProperty('--deck-design-w', this.designWidth + 'px');
        this._canvas.style.setProperty('--deck-design-h', this.designHeight + 'px');
        this._fit(); this._syncPrintPageRule();
      }
    }
    _render() {
      const style = document.createElement('style'); style.textContent = stylesheet;
      const stage = document.createElement('div'); stage.className = 'stage';
      const canvas = document.createElement('div'); canvas.className = 'canvas';
      canvas.style.width = this.designWidth + 'px';
      canvas.style.height = this.designHeight + 'px';
      canvas.style.setProperty('--deck-design-w', this.designWidth + 'px');
      canvas.style.setProperty('--deck-design-h', this.designHeight + 'px');
      const slot = document.createElement('slot');
      slot.addEventListener('slotchange', this._onSlotChange);
      canvas.appendChild(slot); stage.appendChild(canvas);

      const tapzones = document.createElement('div'); tapzones.className = 'tapzones';
      const tzBack = document.createElement('div'); tzBack.className = 'tapzone'; tzBack.style.flex = '0 0 18%';
      const tzMid = document.createElement('div'); tzMid.className = 'tapzone'; tzMid.style.pointerEvents = 'none';
      const tzFwd = document.createElement('div'); tzFwd.className = 'tapzone'; tzFwd.style.flex = '0 0 18%';
      tzBack.addEventListener('click', this._onTapBack);
      tzFwd.addEventListener('click', this._onTapForward);
      tapzones.append(tzBack, tzMid, tzFwd);

      // Swipe gestures globales — funcionan en cualquier parte de la pantalla,
      // incluido el centro donde están los CTAs. Diferenciamos tap (corto)
      // vs swipe (>40px horizontal) para no romper los enlaces.
      this._touch = { x: 0, y: 0, t: 0, active: false };

        const dy = t.clientY - this._touch.y;

      const overlay = document.createElement('div'); overlay.className = 'overlay';
      overlay.innerHTML = `
        <button class="btn prev" type="button" aria-label="Previous"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg></button>
        <span class="count"><span class="current">1</span><span class="sep">/</span><span class="total">1</span></span>
        <button class="btn next" type="button" aria-label="Next"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg></button>
        <span class="divider"></span>
        <button class="btn fs" type="button" title="Pantalla completa (F)" aria-label="Fullscreen"><svg class="fs-enter" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4"/></svg><svg class="fs-exit" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M6 2v4H2M10 2v4h4M6 14v-4H2M10 14v-4h4"/></svg></button>
        <button class="btn reset" type="button">Reset<span class="kbd">R</span></button>
      `;
      overlay.querySelector('.prev').addEventListener('click', () => this._go(this._index - 1));
      overlay.querySelector('.next').addEventListener('click', () => this._go(this._index + 1));
      overlay.querySelector('.reset').addEventListener('click', () => this._go(0));
      const fsBtn = overlay.querySelector('.fs');
      const fsEnter = fsBtn.querySelector('.fs-enter');
      const fsExit = fsBtn.querySelector('.fs-exit');
      fsBtn.addEventListener('click', () => this._toggleFullscreen());
      document.addEventListener('fullscreenchange', () => {
        const on = !!document.fullscreenElement;
        fsEnter.style.display = on ? 'none' : 'block';
        fsExit.style.display = on ? 'block' : 'none';

      this._root.append(style, stage, tapzones, overlay);
      this._canvas = canvas; this._slot = slot; this._overlay = overlay;
      this._countEl = overlay.querySelector('.current');
      this._totalEl = overlay.querySelector('.total');
    }
    _syncPrintPageRule() {
      const id = 'deck-stage-print-page';
      let tag = document.getElementById(id);
      if (!tag) { tag = document.createElement('style'); tag.id = id; document.head.appendChild(tag); }
      tag.textContent =
        '@page { size: ' + this.designWidth + 'px ' + this.designHeight + 'px; margin: 0; } ' +
        '@media print { html, body { margin: 0 !important; padding: 0 !important; background: none !important; overflow: visible !important; height: auto !important; } * { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }';
    }
    _onSlotChange() {
      this._collectSlides(); this._restoreIndex();
      this._applyIndex({ showOverlay: false }); this._fit();
    }
    _collectSlides() {
      const assigned = this._slot.assignedElements({ flatten: true });
      this._slides = assigned.filter((el) => !['TEMPLATE', 'SCRIPT', 'STYLE'].includes(el.tagName));
      this._slides.forEach((slide, i) => {
        const n = i + 1;
        let label = slide.getAttribute('data-label') || 'Slide';
        slide.setAttribute('data-screen-label', `${pad2(n)} ${label}`);
        if (!slide.hasAttribute('data-om-validate')) slide.setAttribute('data-om-validate', VALIDATE_ATTR);
        slide.setAttribute('data-deck-slide', String(i));
      });
      if (this._totalEl) this._totalEl.textContent = String(this._slides.length || 1);
      if (this._index >= this._slides.length) this._index = Math.max(0, this._slides.length - 1);
    }
    _restoreIndex() {
      const h = (location.hash || '').match(/^#(\d+)$/);
      if (h) { const n = parseInt(h[1], 10) - 1; if (n >= 0 && n < this._slides.length) this._index = n; }
    }
    _applyIndex({ showOverlay = true } = {}) {
      if (!this._slides.length) return;
      const curr = this._index;
      // history.replaceState fails on file:// — skip silently.
      if (location.protocol !== 'file:') {
        try { history.replaceState(null, '', '#' + (curr + 1)); } catch (e) {}
      }
      // Toggle data-deck-active. The CSS animation rules are scoped to
      // [data-deck-active] [data-anim="..."] so the selector starts matching
      // (or stops) every time this attribute flips, and the browser restarts
      // the @keyframes for us. No JS animation gymnastics needed.
      this._slides.forEach((s, i) => {
        if (i === curr) s.setAttribute('data-deck-active', '');
        else s.removeAttribute('data-deck-active');
      });
      if (this._countEl) this._countEl.textContent = String(curr + 1);
      // Dispatch a CustomEvent so React components (e.g., CountUp) can react.
      this.dispatchEvent(new CustomEvent('slidechange', {
        detail: { index: curr, total: this._slides.length, slide: this._slides[curr] || null },
        bubbles: true, composed: true,
      }));
      if (showOverlay) this._flashOverlay();
    }

    /** Public: force-restart animations on the active slide by removing and
     *  re-adding the data-deck-active attribute (next frame). Used after the
     *  initial React commit, since deck-stage's first _applyIndex ran before
     *  any [data-anim] elements existed. */
    replayAnimations() {
      const active = this._slides[this._index];
      if (!active) return;
      active.removeAttribute('data-deck-active');
      void active.offsetWidth;
      requestAnimationFrame(() => active.setAttribute('data-deck-active', ''));
    }
    _flashOverlay() {
      if (!this._overlay) return;
      this._overlay.setAttribute('data-visible', '');
      if (this._hideTimer) clearTimeout(this._hideTimer);
      this._hideTimer = setTimeout(() => this._overlay.removeAttribute('data-visible'), OVERLAY_HIDE_MS);
    }
    _fit() {
      if (!this._canvas) return;
      if (this.hasAttribute('noscale')) { this._canvas.style.transform = 'none'; return; }
      const s = Math.min(window.innerWidth / this.designWidth, window.innerHeight / this.designHeight);
      this._canvas.style.transform = `scale(${s})`;
    }
    _onResize() { this._fit(); }
    _onMouseMove() { this._flashOverlay(); }
    _onTapBack(e) { e.preventDefault(); this._go(this._index - 1); }
    _onTapForward(e) { e.preventDefault(); this._go(this._index + 1); }
    _onKey(e) {
      const t = e.target;
      if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const k = e.key; let handled = true;
      if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') this._go(this._index + 1);
      else if (k === 'ArrowLeft' || k === 'PageUp') this._go(this._index - 1);
      else if (k === 'Home') this._go(0);
      else if (k === 'End') this._go(this._slides.length - 1);
      else if (k === 'r' || k === 'R') this._go(0);
      else if (k === 'f' || k === 'F') this._toggleFullscreen();
      else if (/^[0-9]$/.test(k)) { const n = k === '0' ? 9 : parseInt(k, 10) - 1; if (n < this._slides.length) this._go(n); }
      else handled = false;
      if (handled) { e.preventDefault(); this._flashOverlay(); }
    }
    _go(i) {
      if (!this._slides.length) return;
      const clamped = Math.max(0, Math.min(this._slides.length - 1, i));
      if (clamped === this._index) { this._flashOverlay(); return; }
      this._index = clamped; this._applyIndex({ showOverlay: true });
    }
    _toggleFullscreen() {
      if (!document.fullscreenElement) {
        const el = document.documentElement;
        (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen).call(el);
      } else {
        (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document);
      }
    }
  }
  if (!customElements.get('deck-stage')) customElements.define('deck-stage', DeckStage);
})();

/* CountUp: animates a number from 0 to target whenever the slide enters.
   Listens to slidechange on document and finds the closest active section. */
function CountUp({ to = 20, duration = 1400, style = {} }) {
  const ref = React.useRef(null);
  const [val, setVal] = React.useState(0);
  React.useEffect(() => {
    const node = ref.current;
    if (!node) return;
    const sec = node.closest('section');
    if (!sec) return;
    let raf = null;
    const run = () => {
      const t0 = performance.now();
      const tick = (t) => {
        const p = Math.min(1, (t - t0) / duration);
        const eased = 1 - Math.pow(1 - p, 3);
        setVal(Math.round(to * eased));
        if (p < 1) raf = requestAnimationFrame(tick);
      };
      raf = requestAnimationFrame(tick);
    };
    const onChange = (e) => {
      if (e.detail && e.detail.slide === sec) {
        if (raf) cancelAnimationFrame(raf);
        setVal(0);
        // Defer by one frame so the layout settles after the slide becomes active.
        requestAnimationFrame(run);
      }

    document.addEventListener('slidechange', onChange);
    // If we mount on an already-active slide (initial render), kick off immediately.
    if (sec.hasAttribute('data-deck-active')) run();
    return () => {
      document.removeEventListener('slidechange', onChange);
      if (raf) cancelAnimationFrame(raf);
    };
  }, [to, duration]);
  return <span ref={ref} style={style}>{val}</span>;
}

function ParadigmShiftInfographic() {

        </radialGradient>
      </defs>
      {items.map((it, i) => {

        const fromX = 130;

        return (
          <g key={i}>
            {/* Halo del lado dorado */}
            <ellipse cx={toX} cy={y} rx="120" ry="34" fill="url(#shift-glow)">
              <animate attributeName="opacity" values="0.4;0.85;0.4" dur="3s" repeatCount="indefinite" begin={`${i * 0.4}s`}/>
            </ellipse>
            {/* Estado FROM (gris, tachado) */}
            <g>
              <rect x={fromX - 110} y={y - 28} width="220" height="56" rx="6"
                fill="rgba(245,241,232,0.04)" stroke="rgba(138,138,138,0.4)" strokeWidth="1"/>
              <text x={fromX} y={y + 6} textAnchor="middle"
                fill="#8a8a8a" fontFamily="Inter" fontSize="17" fontWeight="400"
                textDecoration="line-through">{it.from}</text>

            {/* Conector con partícula viajando */}
            <line x1={fromX + 110} y1={y} x2={toX - 110} y2={y}
              stroke="#c9a961" strokeWidth="1" strokeDasharray="3 4" opacity="0.5"/>
            {/* Flecha */}
            <path d={`M ${toX - 116} ${y - 8} L ${toX - 102} ${y} L ${toX - 116} ${y + 8}`}
              fill="none" stroke="#c9a961" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
            {/* Partícula dorada que cruza */}
            <circle r="4" fill="#c9a961">
              <animateMotion dur="3.2s" repeatCount="indefinite"
                path={`M ${fromX + 110} ${y} L ${toX - 110} ${y}`}
                begin={`${i * 0.5}s`}/>
              <animate attributeName="opacity" values="0;1;1;0"
                dur="3.2s" repeatCount="indefinite"
                begin={`${i * 0.5}s`}/>
            </circle>
            {/* Estado TO (dorado, italic) */}
            <g>
              <rect x={toX - 110} y={y - 30} width="220" height="60" rx="6"
                fill="rgba(201,169,97,0.10)" stroke="rgba(201,169,97,0.4)" strokeWidth="1.4"/>
              <text x={toX} y={y + 8} textAnchor="middle"
                fill="#f5f1e8" fontFamily="Fraunces" fontSize="20" fontWeight="500" fontStyle="italic">{it.to}</text>
            </g>
          </g>
        );
      })}
    </svg>
  );
}

function TransformationTimeline() {
  const stops = [
    { y:  70,  key: 'DÍA 1',  val: 'Conocimiento disperso',  muted: true },
    { y: 195,  key: 'MES 1',  val: 'Construye' },
    { y: 320,  key: 'MES 2',  val: 'Estructura' },
    { y: 445,  key: 'MES 3',  val: 'Vende' },
    { y: 570,  key: 'DÍA 90', val: 'Estructura ejecutable',  highlight: true },
  ];
  /* Animación: el dot viaja del Día 1 al Día 90 en los primeros 70% del
     ciclo, mantiene 25% en la meta (highlight), y los últimos 5% reinicia
     fuera de vista (opacity 0). Riel se sincroniza con el dot. */
  return (
    <svg className="trans-svg" viewBox="0 0 580 660" aria-hidden="true">
      <defs>
        <radialGradient id="trans-glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%"   stopColor="#c9a961" stopOpacity="0.85"/>
          <stop offset="100%" stopColor="#c9a961" stopOpacity="0"/>
        </radialGradient>
      </defs>

      {/* Riel base (gris tenue) */}
      <line className="trans-rail" x1="80" y1="70" x2="80" y2="570"/>

      {/* Riel dorado relleno — se dibuja sincrónico al dot */}
      <line className="trans-rail-fill" x1="80" y1="70" x2="80" y2="570"
        strokeDasharray="500" strokeDashoffset="500">
        <animate attributeName="stroke-dashoffset"
          values="500;0;0;500"
          keyTimes="0;0.7;0.95;1"
          dur="6s" repeatCount="indefinite"/>
      </line>

      {/* Halo del dot viajando */}
      <circle r="22" fill="url(#trans-glow)">
        <animateMotion dur="6s" repeatCount="indefinite" path="M 80 70 L 80 570"
          keyPoints="0;1;1;0" keyTimes="0;0.7;0.95;1" calcMode="linear"/>
        <animate attributeName="opacity"
          values="0;0.85;0.85;0;0"
          keyTimes="0;0.06;0.7;0.85;1"
          dur="6s" repeatCount="indefinite"/>
      </circle>

      {/* Dot dorado viajando */}
      <circle r="8" fill="#c9a961">
        <animateMotion dur="6s" repeatCount="indefinite" path="M 80 70 L 80 570"
          keyPoints="0;1;1;0" keyTimes="0;0.7;0.95;1" calcMode="linear"/>
        <animate attributeName="opacity"
          values="0;1;1;0;0"
          keyTimes="0;0.06;0.7;0.85;1"
          dur="6s" repeatCount="indefinite"/>
      </circle>

      {/* Paradas */}
      {stops.map((s, i) => (
        <g key={i}>
          <circle
            className={s.highlight ? 'trans-stop-end' : 'trans-stop'}
            cx="80" cy={s.y} r={s.highlight ? 16 : 12}
          >
            {s.highlight && <animate attributeName="r" values="15;19;15" dur="2.4s" repeatCount="indefinite"/>}
          </circle>
          <text
            className={s.muted ? 'trans-label-muted' : 'trans-label-key'}
            x="125" y={s.y - 8}
          >{s.key}</text>
          <text className="trans-label-val" x="125" y={s.y + 22}>{s.val}</text>
        </g>
      ))}
    </svg>
  );
}

/* ========== SLIDE 5 — Hexagonal de 6 activos animados ========== */
function SixAssetsHexagon() {
  /* 6 nodos en hexágono apaisado (apunta a izquierda/derecha) alrededor
     del centro. Hexágono ancho para aprovechar slide widescreen. */
  const center = { x: 500, y: 320 };
  const rx = 380; // radio horizontal (hexágono apaisado)
  const ry = 220; // radio vertical
  const nodes = [
    { angle: -180, label: 'Método propio',          n: '01', icon: 'fingerprint' },
    { angle: -120, label: 'Oferta premium',         n: '02', icon: 'star' },
    { angle:  -60, label: 'Posicionamiento',        n: '03', icon: 'target' },
    { angle:    0, label: 'Sistema comercial',      n: '04', icon: 'briefcase' },
    { angle:   60, label: 'IA aplicada',            n: '05', icon: 'cpu' },
    { angle:  120, label: 'Estrategia · contenido', n: '06', icon: 'grid' },
  ].map((it) => {
    const rad = (it.angle * Math.PI) / 180;
    return { ...it, x: center.x + rx * Math.cos(rad), y: center.y + ry * Math.sin(rad) };
  });

  const renderIcon = (name, color) => {
    const props = { fill: 'none', stroke: color, strokeWidth: 1.7, strokeLinecap: 'round', strokeLinejoin: 'round' };
    switch (name) {
      case 'fingerprint': return (
        <g {...props}>
          <path d="M3 12a9 9 0 0 1 14.95-6.74"/>
          <path d="M12 3a9 9 0 0 1 9 9c0 1-.1 2-.3 3"/>
          <path d="M12 7a5 5 0 0 1 5 5v1a4 4 0 0 1-1 2.6"/>
          <path d="M12 11a1 1 0 0 1 1 1v3a3 3 0 0 1-1.5 2.6"/>
          <path d="M9 21c-1-2-1-4-1-6a4 4 0 0 1 1.4-3"/>
          <path d="M3 16c.5 1.5 1 3 1.5 4.5"/>
        </g>
      );
      case 'star': return (
        <g {...props}>
          <polygon points="12 2 15.1 8.3 22 9.3 17 14.1 18.2 21 12 17.8 5.8 21 7 14.1 2 9.3 8.9 8.3"/>
        </g>
      );
      case 'target': return (
        <g {...props}>
          <circle cx="12" cy="12" r="10"/>
          <circle cx="12" cy="12" r="6"/>
          <circle cx="12" cy="12" r="2" fill={color}/>
        </g>
      );
      case 'briefcase': return (
        <g {...props}>
          <rect x="2" y="7" width="20" height="14" rx="2"/>
          <path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
          <line x1="2" y1="13" x2="22" y2="13"/>
        </g>
      );
      case 'cpu': return (
        <g {...props}>
          <rect x="4" y="4" width="16" height="16" rx="2"/>
          <rect x="9" y="9" width="6" height="6"/>
          <line x1="9" y1="2" x2="9" y2="4"/>
          <line x1="15" y1="2" x2="15" y2="4"/>
          <line x1="9" y1="20" x2="9" y2="22"/>
          <line x1="15" y1="20" x2="15" y2="22"/>
          <line x1="20" y1="9" x2="22" y2="9"/>
          <line x1="20" y1="14" x2="22" y2="14"/>
          <line x1="2" y1="9" x2="4" y2="9"/>
          <line x1="2" y1="14" x2="4" y2="14"/>
        </g>
      );
      case 'grid': return (
        <g {...props}>
          <rect x="3" y="3" width="7" height="7"/>
          <rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/>
        </g>
      );
      default: return null;
    }
  };

  return (
    <svg viewBox="0 0 1000 620" aria-hidden="true" style={{ width: '100%', height: 'auto', display: 'block', overflow: 'visible' }}>
      <defs>
        <radialGradient id="six-glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%"   stopColor="#fff8e0" stopOpacity="0.45"/>
          <stop offset="60%"  stopColor="#d4b876" stopOpacity="0.18"/>
          <stop offset="100%" stopColor="#c9a961" stopOpacity="0"/>
        </radialGradient>
      </defs>

      {/* Halo central */}
      <circle cx={center.x} cy={center.y} r="170" fill="url(#six-glow)">
        <animate attributeName="opacity" values="0.55;1;0.55" dur="4s" repeatCount="indefinite"/>
      </circle>

      {/* Anillo dasheado (elíptico, sutil) */}
      <ellipse cx={center.x} cy={center.y} rx="270" ry="160" fill="none"
        stroke="#c9a961" strokeWidth="1" strokeDasharray="5 8" opacity="0.30"/>

      {/* Líneas del centro a cada nodo */}
      {nodes.map((n, i) => (
        <line key={`l-${i}`}
          x1={center.x} y1={center.y} x2={n.x} y2={n.y}
          stroke="#c9a961" strokeWidth="0.8" opacity="0.30"/>
      ))}

      {/* Partículas viajando del centro a cada nodo (escalonadas) */}
      {nodes.map((n, i) => (
        <circle key={`p-${i}`} r="3.5" fill="#c9a961">
          <animateMotion dur="3.6s" repeatCount="indefinite"
            path={`M ${center.x} ${center.y} L ${n.x} ${n.y}`}
            begin={`${i * 0.55}s`}/>
          <animate attributeName="opacity" values="0;1;1;0"
            dur="3.6s" repeatCount="indefinite" begin={`${i * 0.55}s`}/>
        </circle>
      ))}

      {/* Nodo central */}
      <circle cx={center.x} cy={center.y} r="92"
        fill="#0a0a0a" stroke="#c9a961" strokeWidth="2"/>
      <text x={center.x} y={center.y - 14} textAnchor="middle"
        fill="#c9a961" fontFamily="Inter" fontSize="13" fontWeight="600"
        letterSpacing="2.6">SALES CON</text>
      <text x={center.x} y={center.y + 28} textAnchor="middle"
        fill="#f5f1e8" fontFamily="Fraunces" fontStyle="italic" fontWeight="400" fontSize="50"
        letterSpacing="-0.02em">6 activos</text>

      {/* Nodos periféricos */}
      {nodes.map((n, i) => {
        // Etiqueta arriba si el nodo está en la fila inferior; debajo si está en la superior.
        const labelBelow = n.y <= center.y;
        const labelY = labelBelow ? n.y + 82 : n.y - 64;
        const numberY = labelBelow ? n.y - 64 : n.y + 82;
        return (
          <g key={`n-${i}`}>
            {/* Anillo de pulso saliente */}
            <circle cx={n.x} cy={n.y} r="50" fill="none" stroke="#c9a961" strokeWidth="1" opacity="0.5">
              <animate attributeName="r" values="50;66;50" dur={`${3 + i * 0.18}s`} repeatCount="indefinite" begin={`${i * 0.3}s`}/>
              <animate attributeName="opacity" values="0.6;0;0.6" dur={`${3 + i * 0.18}s`} repeatCount="indefinite" begin={`${i * 0.3}s`}/>
            </circle>
            {/* Disco del nodo */}
            <circle cx={n.x} cy={n.y} r="48"
              fill="#0a0a0a" stroke="#c9a961" strokeWidth="1.8"/>
            {/* Icono centrado */}
            <g transform={`translate(${n.x - 19} ${n.y - 19}) scale(1.6)`}>
              {renderIcon(n.icon, '#c9a961')}
            </g>
            {/* Label */}
            <text x={n.x} y={labelY} textAnchor="middle"
              fill="#f5f1e8" fontFamily="Inter" fontSize="17" fontWeight="600"
              letterSpacing="0.5">
              {n.label}
            </text>
            {/* Número en italic dorado, opuesto al label */}
            <text x={n.x} y={numberY} textAnchor="middle"
              fill="#c9a961" fontFamily="Fraunces" fontStyle="italic" fontWeight="400" fontSize="18">
              {n.n}
            </text>
          </g>
        );
      })}
    </svg>
  );
}

/* ========== SLIDE 17b — 30 minutos juntos ========== */
function ThirtyMinClock() {
  /* Reloj circular animado: aro dorado, manecilla giratoria continua,
     pulso de luz orbital y micro-partículas. */
  return (
    <svg viewBox="0 0 360 360" aria-hidden="true" style={{ width: '100%', maxWidth: 320, display: 'block' }}>
      <defs>
        <radialGradient id="t30-glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%"  stopColor="#c9a961" stopOpacity="0.55"/>
          <stop offset="100%" stopColor="#c9a961" stopOpacity="0"/>
        </radialGradient>
        <radialGradient id="t30-core" cx="50%" cy="50%" r="50%">
          <stop offset="0%"  stopColor="#c9a961" stopOpacity="0.9"/>
          <stop offset="100%" stopColor="#c9a961" stopOpacity="0"/>
        </radialGradient>
      </defs>

      {/* Halo exterior pulsante */}
      <circle cx="180" cy="180" r="150" fill="url(#t30-glow)" opacity="0.6">
        <animate attributeName="opacity" values="0.4;0.85;0.4" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="r" values="146;156;146" dur="3.6s" repeatCount="indefinite"/>
      </circle>

      {/* Anillo expansivo (onda) */}
      <circle cx="180" cy="180" r="130" fill="none" stroke="#c9a961" strokeWidth="2" opacity="0.6">
        <animate attributeName="r" values="130;165;130" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0;0.6" dur="2.8s" repeatCount="indefinite"/>
      </circle>

      {/* Aro base */}
      <circle cx="180" cy="180" r="130" fill="none" stroke="rgba(201,169,97,0.18)" strokeWidth="2"/>

      {/* Aro dorado dibujándose y luego rotando suavemente */}
      <g transform="rotate(-90 180 180)">
        <circle cx="180" cy="180" r="130" fill="none" stroke="#c9a961" strokeWidth="3"
          strokeDasharray="817" strokeDashoffset="817" strokeLinecap="round">
          <animate attributeName="stroke-dashoffset" from="817" to="0" dur="2.2s" begin="0.2s" fill="freeze"/>
        </circle>
        {/* Punto luminoso recorriendo el aro */}
        <circle r="6" fill="#fff" opacity="0">
          <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="6s" begin="2.4s" repeatCount="indefinite"/>
          <animateMotion dur="6s" begin="2.4s" repeatCount="indefinite"
            path="M 180 50 A 130 130 0 1 1 179.99 50 Z"/>
        </circle>
      </g>

      {/* Marcas cada 5 min con destello rotando */}
      {[...Array(12)].map((_, i) => {
        const angle = (i * 30) * Math.PI / 180;
        const x1 = 180 + Math.cos(angle - Math.PI/2) * 142;
        const y1 = 180 + Math.sin(angle - Math.PI/2) * 142;
        const x2 = 180 + Math.cos(angle - Math.PI/2) * 152;
        const y2 = 180 + Math.sin(angle - Math.PI/2) * 152;
        return (
          <line key={i} x1={x1} y1={y1} x2={x2} y2={y2}
            stroke="#c9a961" strokeWidth={i % 6 === 0 ? 3 : 1}
            opacity={i % 6 === 0 ? 1 : 0.5}
          >
            <animate attributeName="opacity"
              values={i % 6 === 0 ? "1;0.4;1" : "0.5;1;0.5"}
              dur="4.8s"
              begin={`${i * 0.2}s`}
              repeatCount="indefinite"/>
          </line>
        );
      })}

      {/* Manecilla con rotación inicial + giro continuo */}
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="0 180 180; 180 180 180; 540 180 180"
          keyTimes="0;0.25;1"
          dur="9s"
          begin="0.4s"
          repeatCount="indefinite"/>
        <line x1="180" y1="180" x2="180" y2="62" stroke="#c9a961" strokeWidth="3" strokeLinecap="round"/>
        {/* Estela */}
        <line x1="180" y1="180" x2="180" y2="80" stroke="#c9a961" strokeWidth="6" strokeLinecap="round" opacity="0.25"/>
      </g>

      {/* Núcleo central */}
      <circle cx="180" cy="180" r="14" fill="url(#t30-core)">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="180" cy="180" r="6" fill="#c9a961"/>

      {/* Texto central con leve brillo */}
      <text x="180" y="170" textAnchor="middle" fontFamily="Fraunces" fontSize="76" fontStyle="italic" fontWeight="300" fill="#c9a961">
        30
        <animate attributeName="fill-opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/>
      </text>
      <text x="180" y="208" textAnchor="middle" fontFamily="Inter" fontSize="13" letterSpacing="6" fill="#8a8a8a">MINUTOS</text>

      {/* Partículas orbitando */}
      {[0, 1, 2].map((i) => (
        <circle key={i} r="2.5" fill="#c9a961" opacity="0.85">
          <animateMotion
            dur={`${5 + i * 1.2}s`}
            repeatCount="indefinite"
            begin={`${i * 0.6}s`}
            path={`M 180 ${60 + i * 8} A ${120 - i * 8} ${120 - i * 8} 0 1 1 179.99 ${60 + i * 8} Z`}/>
          <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
        </circle>
      ))}
    </svg>
  );
}

/* W12 — Audiencias dispersas vs comunidades conectadas */
function AudiencesVsCommunities() {
  const audiencePts = [
    {x: 30, y: 50}, {x: 70, y: 70}, {x: 110, y: 60}, {x: 50, y: 95},
    {x: 100, y: 105}, {x: 140, y: 80}, {x: 30, y: 130}, {x: 80, y: 140},
    {x: 130, y: 130}, {x: 60, y: 165}, {x: 110, y: 170}, {x: 30, y: 85},
    {x: 145, y: 145}, {x: 90, y: 50}, {x: 20, y: 110}, {x: 150, y: 110},
  ];
  const cluster1 = [{x:240,y:55},{x:260,y:45},{x:280,y:55},{x:265,y:75}];
  const cluster2 = [{x:320,y:100},{x:340,y:88},{x:360,y:100},{x:350,y:118}];
  const cluster3 = [{x:245,y:140},{x:265,y:155},{x:285,y:145},{x:265,y:170}];
  const drawCluster = (pts, key) => (
    <g key={key}>
      {pts.map((p, i) => (
        pts.slice(i + 1).map((q, j) => (
          <line key={`${i}-${j}`} x1={p.x} y1={p.y} x2={q.x} y2={q.y} stroke="#b08a3e" strokeWidth="0.7" opacity="0.6"/>
        ))
      ))}
      {pts.map((p, i) => (
        <circle key={`pt-${i}`} cx={p.x} cy={p.y} r="3.5" fill="#c9a961">
          <animate attributeName="opacity" values="0.7;1;0.7" dur={`${2.5 + i * 0.2}s`} repeatCount="indefinite" begin={`${key * 0.3 + i * 0.1}s`}/>
        </circle>
      ))}
    </g>
  );
  return (
    <svg width="400" height="200" viewBox="0 0 400 200" aria-hidden="true">
      {/* Labels */}
      <text x="85" y="20" textAnchor="middle" fill="#5a5a5a" fontFamily="Inter" fontSize="11" fontWeight="600" letterSpacing="2">AUDIENCIAS</text>
      <text x="305" y="20" textAnchor="middle" fill="#b08a3e" fontFamily="Inter" fontSize="11" fontWeight="600" letterSpacing="2">COMUNIDADES</text>
      {/* Audiencias dispersas (sin conectar) */}
      {audiencePts.map((p, i) => (
        <circle key={`a-${i}`} cx={p.x} cy={p.y} r="3" fill="#999">
          <animate attributeName="opacity" values="0.3;0.6;0.3" dur={`${2.5 + (i % 4) * 0.3}s`} repeatCount="indefinite" begin={`${i * 0.1}s`}/>

      {/* Divider */}
      <line x1="195" y1="30" x2="195" y2="190" stroke="#b08a3e" strokeDasharray="3 4" opacity="0.35"/>
      {/* Comunidades conectadas */}
      {drawCluster(cluster1, 0)}
      {drawCluster(cluster2, 1)}
      {drawCluster(cluster3, 2)}
    </svg>
  );
}

/* ========== MOUNT ========== */
const slides = [
  S01_Cover, S02_NotMentorship, S03_NotToLearn, S04_Transformation,
  S05_Outcomes, /* S06_Traction OCULTA */ S07_PathHeader,
  S08_Mes1, S09_Mes2, S10_Mes3,
  S11_Day91, /* S12_Deliverables OCULTA */ S13_Bonuses,
  S14_Investment, S15_NotAboutMoney,
  S16_Guarantee, S17_Seats, S17b_ThirtyMinutes, S18_Close,
];
/* Mount IDs: 17 slides de oferta. S06 y S12 ocultas. */
const slideIds = [
  's01','s02','s03','s04','s05','s07','s08','s09','s10',
  's11','s13','s14','s15','s16','s17','s17b','s18',
];
slides.forEach((Comp, i) => {
  const el = document.getElementById(slideIds[i]);
  if (el) ReactDOM.createRoot(el).render(<Comp />);
});

// React mounts synchronously above, but the deck-stage already scheduled a
// rAF in _replayActiveAnimations before this script ran (during slotchange).
// That rAF fires next frame, after React's DOM is in place — the .anim-on
// class lands on the active section and CSS picks up the animation.
// We additionally trigger one more replay after a real paint, in case some
// slow load path leaves the first rAF without animated descendants yet.
requestAnimationFrame(() => requestAnimationFrame(() => {
  const deck = document.querySelector('deck-stage');
  if (deck && typeof deck.replayAnimations === 'function') deck.replayAnimations();
}));
</script>
