<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>lizpinto.ai</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        /* ── GHL ENCAPSULATION SHIELD ──────────────────────── */
        html.hl_page-creator,
        body.hl_page-creator,
        .main-content-wrapper,
        .hl_page-creator .container,
        .hl_page-creator .row,
        .hl_page-creator .col-md-12,
        .hl_page-creator [class*="inner-container"],
        .hl_page-creator [class*="section-"],
        #section- ,
        #preview-container,
        .preview-section,
        [data-page-element] {
            margin: 0 !important;
            padding: 0 !important;
            max-width: 100% !important;
            width: 100% !important;
            overflow: visible !important;
            min-height: 0 !important;
            height: auto !important;
            border: none !important;
            box-shadow: none !important;
            background: transparent !important;
        }

        :root {
            --bg: #ffffff;
            --bg-alt: #f7f7f8;
            --bg-user: #1a1a1a;
            --text: #1a1a1a;
            --text-soft: #3f3f46;
            --text-muted: #71717a;
            --border: rgba(0, 0, 0, 0.08);
            --border-strong: rgba(0, 0, 0, 0.12);
            --accent: #c8a04a;
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 24px rgba(0, 0, 0, 0.04);
        }

        @supports (-webkit-touch-callout: none) {
            #app { height: -webkit-fill-available; }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        html, body {
            height: 100% !important;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important;
            color: var(--text) !important;
            background: var(--bg) !important;
            overflow: hidden !important;
        }

        /* App wrapper full-viewport */
        #app {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100% !important;
            height: 100% !important;
            background: var(--bg) !important;
            display: flex !important;
            flex-direction: column !important;
            overflow: hidden !important;
            z-index: 9999;
        }

        /* -- HEADER minimalista -- */
        .header {
            position: relative;
            width: 100% !important;
            padding: 10px 24px 4px !important;
            display: flex !important;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: var(--bg) !important;
            z-index: 10;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .brand-logo {
            display: block;
            height: 110px;
            width: auto;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* -- MAIN -- */
        .main {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            overflow: hidden;
        }

        .chat {
            width: 100%;
            max-width: 780px;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            padding: 0 20px;
        }

        /* -- MENSAJES -- */
        .messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 24px 4px 12px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            scroll-behavior: smooth;
        }

        .messages::-webkit-scrollbar { width: 6px; }
        .messages::-webkit-scrollbar-track { background: transparent; }
        .messages::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.12);
            border-radius: 999px;
        }

        /* Welcome */
        .welcome {
            margin: auto 0;
            text-align: center;
            padding: 12px 8px 24px;
            animation: fadeIn 0.5s ease-out;
        }

        .welcome h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.9rem;
            font-weight: 400;
            color: var(--text);
            line-height: 1.25;
            letter-spacing: -0.01em;
            margin-bottom: 10px;
        }

        .welcome p {
            font-size: 1rem;
            color: var(--text-muted);
            line-height: 1.55;
            max-width: 520px;
            margin: 0 auto;
            font-weight: 400;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Mensajes individuales */
        .message {
            display: flex;
            width: 100%;
            animation: fadeIn 0.3s ease-out;
        }

        .message.user { justify-content: flex-end; }
        .message.bot  { justify-content: flex-start; }

        .bubble {
            max-width: 86%;
            font-size: 0.96rem;
            line-height: 1.6;
            color: var(--text);
            white-space: normal;
        }

        .message.user .bubble {
            background: var(--bg-user);
            color: #fff;
            padding: 12px 18px;
            border-radius: 22px;
            border-bottom-right-radius: 6px;
        }

        .message.bot .bubble {
            background: transparent;
            padding: 2px 0;
        }

        /* Markdown */
        .bubble h1, .bubble h2, .bubble h3 {
            font-family: 'Playfair Display', serif;
            color: var(--text);
            margin-top: 12px;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .bubble h1:first-child,
        .bubble h2:first-child,
        .bubble h3:first-child { margin-top: 0; }
        .bubble h1 { font-size: 1.15rem; }
        .bubble h2 { font-size: 1.05rem; }
        .bubble h3 { font-size: 0.98rem; }
        .bubble p { margin-bottom: 8px; }
        .bubble p:last-child { margin-bottom: 0; }
        .bubble ul, .bubble ol { padding-left: 22px; margin-bottom: 8px; }
        .bubble li { margin-bottom: 4px; }
        .bubble strong { font-weight: 600; color: var(--text); }
        .bubble em { font-style: italic; color: var(--text-soft); }
        .bubble code {
            background: var(--bg-alt);
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 0.86em;
            font-family: 'SF Mono', Menlo, Consolas, monospace;
        }
        .bubble a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }

        /* Typing */
        .typing {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 2px;
            animation: fadeIn 0.3s ease-out;
        }

        .dot {
            width: 7px; height: 7px;
            background: var(--text-muted);
            border-radius: 50%;
            opacity: 0.4;
            animation: dotBounce 1.4s ease-in-out infinite;
        }
        .dot:nth-child(2) { animation-delay: 0.18s; }
        .dot:nth-child(3) { animation-delay: 0.36s; }

        @keyframes dotBounce {
            0%, 60%, 100% { opacity: 0.35; transform: translateY(0); }
            30%            { opacity: 1;    transform: translateY(-4px); }
        }

        /* -- COMPOSER -- */
        .composer {
            padding: 8px 0 16px;
            flex-shrink: 0;
            background: var(--bg);
            padding-bottom: max(16px, env(safe-area-inset-bottom));
        }

        .composer-pill {
            position: relative;
            display: flex;
            align-items: flex-end;
            background: var(--bg-alt);
            border: 1px solid var(--border);
            border-radius: 26px;
            padding: 8px 8px 8px 18px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .composer-pill:focus-within {
            border-color: var(--border-strong);
            box-shadow: var(--shadow);
        }

        .input-field {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-family: inherit;
            font-size: 16px;
            color: var(--text);
            resize: none;
            min-height: 28px;
            max-height: 140px;
            line-height: 1.45;
            padding: 8px 8px 8px 0;
            -webkit-appearance: none;
            appearance: none;
        }

        .input-field::placeholder { color: var(--text-muted); }

        .send-btn {
            width: 36px; height: 36px;
            min-width: 36px;
            background: var(--text);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.2s, transform 0.15s, opacity 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .send-btn:hover:not(:disabled) {
            background: #000;
            transform: translateY(-1px);
        }

        .send-btn:active:not(:disabled) { transform: scale(0.94); }

        .send-btn:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }

        .send-btn svg { width: 16px; height: 16px; fill: #fff; }

        .composer-hint {
            font-size: 0.72rem;
            color: var(--text-muted);
            text-align: center;
            margin-top: 10px;
            letter-spacing: 0.01em;
        }

        /* -- RESPONSIVE -- */
        @media (max-width: 640px) {
            .header { padding: 8px 16px 2px !important; }
            .brand-logo { height: 86px; }
            .chat { padding: 0 14px; }
            .messages { padding: 18px 2px 8px; gap: 16px; }
            .welcome h1 { font-size: 1.5rem; }
            .welcome p { font-size: 0.95rem; }
            .bubble { font-size: 0.94rem; }
            .message.user .bubble { max-width: 92%; }
            .composer { padding: 6px 0 12px; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
            .composer-pill { padding: 6px 6px 6px 16px; border-radius: 22px; }
            .composer-hint { display: none; }
        }

        @media (max-width: 380px) {
            .welcome h1 { font-size: 1.35rem; }
            .welcome p { font-size: 0.9rem; }
            .bubble { font-size: 0.9rem; }
        }

        @media (max-height: 500px) {
            .header { padding: 4px 20px 2px !important; }
            .brand-logo { height: 56px; }
            .welcome { padding: 8px 4px 12px; }
            .welcome h1 { font-size: 1.25rem; margin-bottom: 6px; }
            .welcome p { font-size: 0.88rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>

<body>

<div id="app">

    <!-- HEADER -->
    <header class="header">
        <div class="brand">
            <img class="brand-logo" src="https://assets.cdn.filesafe.space/Np6qnux1pM5NRF9JY3lh/media/6a077f03dbe569a25d517665.png" alt="Liz Pinto">
        </div>
    </header>

    <!-- MAIN -->
    <main class="main">
        <div class="chat">

            <!-- Mensajes -->
            <div class="messages" id="messagesArea">
                <div class="welcome" id="welcomeCard">
                    <h1>Hola, soy el clon digital de Liz.</h1>
                    <p>Estoy aqui para resolver cualquier pregunta sobre el negocio de la fotografia.</p>
                </div>
            </div>

            <!-- Composer -->
            <div class="composer">
                <div class="composer-pill">
                    <textarea
                        id="messageInput"
                        class="input-field"
                        placeholder="Escribe tu pregunta..."
                        rows="1"
                    ></textarea>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()" aria-label="Enviar">
                        <svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L17.17 12H4v2h13.17l-6.58 6.59L12 22l10-10z" transform="rotate(-90 12 12)"/></svg>
                    </button>
                </div>
                <p class="composer-hint">Enter para enviar &nbsp;&middot;&nbsp; Shift + Enter para nueva linea</p>
            </div>

        </div>
    </main>

</div>

    <script>
        const WEBHOOK_URL = 'https://joinsclee-n8n.juno8i.easypanel.host/webhook/liz-pinto-soporte-chat';

        let isProcessing = false;

        function getSessionId() {
            let id = sessionStorage.getItem('liz_support_session');
            if (!id) {
                id = 'liz_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                sessionStorage.setItem('liz_support_session', id);
            }
            return id;
        }

        const inputEl = document.getElementById('messageInput');
        inputEl.addEventListener('input', function () {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 140) + 'px';
        });

        inputEl.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function hideWelcome() {
            const card = document.getElementById('welcomeCard');
            if (card) card.remove();
        }

        function addMessage(text, role, useMarkdown) {
            hideWelcome();
            const area = document.getElementById('messagesArea');

            const wrap = document.createElement('div');
            wrap.className = `message ${role}`;

            const bubble = document.createElement('div');
            bubble.className = 'bubble';

            if (useMarkdown && typeof marked !== 'undefined') {
                const rawHtml = marked.parse(text);
                bubble.innerHTML = rawHtml.replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '');
            } else {
                const safe = text.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                bubble.innerHTML = safe.replace(/\n/g, '<br>');
            }

            wrap.appendChild(bubble);
            area.appendChild(wrap);
            area.scrollTop = area.scrollHeight;
        }

        function showTyping() {
            const area = document.getElementById('messagesArea');
            const wrap = document.createElement('div');
            wrap.className = 'message bot';
            wrap.id = 'typingWrap';
            wrap.innerHTML = `
                <div class="typing">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            `;
            area.appendChild(wrap);
            area.scrollTop = area.scrollHeight;
        }

        function hideTyping() {
            const el = document.getElementById('typingWrap');
            if (el) el.remove();
        }

        async function sendMessage() {
            if (isProcessing) return;
            const text = inputEl.value.trim();
            if (!text) return;

            isProcessing = true;
            document.getElementById('sendBtn').disabled = true;
            inputEl.disabled = true;
            inputEl.value = '';
            inputEl.style.height = 'auto';

            addMessage(text, 'user', false);
            showTyping();

            try {
                const res = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: text,
                        sessionId: getSessionId(),
                        timestamp: new Date().toISOString()
                    })
                });

                if (!res.ok) throw new Error(`HTTP ${res.status}`);

                const bodyText = await res.text();
                if (!bodyText || !bodyText.trim()) {
                    throw new Error('EMPTY_BODY');
                }

                let raw;
                try {
                    raw = JSON.parse(bodyText);
                } catch (parseErr) {
                    raw = { output: bodyText };
                }
                const data = Array.isArray(raw) ? raw[0] : raw;

                const reply =
                    data.output          ||
                    data.respuesta       ||
                    data.respuesta_final ||
                    data.response        ||
                    data.message         ||
                    data.text            ||
                    'He recibido tu consulta. Hay algo mas en lo que pueda ayudarte?';

                hideTyping();
                addMessage(reply, 'bot', true);

            } catch (err) {
                hideTyping();
                const msg = err && err.message === 'EMPTY_BODY'
                    ? 'El asistente esta despertando. Por favor intentalo de nuevo en unos segundos.'
                    : 'Lo siento, hubo un problema de conexion. Por favor intenta de nuevo en un momento.';
                addMessage(msg, 'bot', false);
            } finally {
                isProcessing = false;
                document.getElementById('sendBtn').disabled = false;
                inputEl.disabled = false;
                inputEl.focus();
            }
        }

        window.addEventListener('load', () => inputEl.focus());

        /* Virtual keyboard resize (iOS/Android) */
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => {
                const app = document.getElementById('app');
                app.style.height = window.visualViewport.height + 'px';
                const area = document.getElementById('messagesArea');
                if (area) area.scrollTop = area.scrollHeight;
            });
        }
    </script>

</body>
</html>
